name: Unit Simulations

on:
  workflow_dispatch:
  workflow_call:
  repository_dispatch:
    types: rebuild
  push:
    branches:
      - master
  schedule:
    - cron: '0 0 * * *' # runs every night
jobs:
  find_unit_sims:
    runs-on: ubuntu-latest
    outputs:
      unitsims: ${{ steps.generate-matrix.outputs.unitsims }}
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: 'recursive'
        token: ${{secrets.PAT}} # Personal Access Token, must be defined in the repo's secrets
    - id: generate-matrix
      run: |
        for folder in `find -name .simunit | xargs dirname`; do
          if [ ! -z "$UNITSIMS" ]; then UNITSIMS="$UNITSIMS, "; fi
          UNITSIMS="$UNITSIMS \"$folder\""
        done
        UNITSIMS="[ $UNITSIMS ]"
        echo $UNITSIMS
        echo "unitsims=${UNITSIMS}" >> $GITHUB_OUTPUT
  run_sims:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    needs:
      - find_unit_sims
    strategy:
      fail-fast: false
      matrix:
        unitsim: ${{ fromJSON(needs.find_unit_sims.outputs.unitsims) }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: 'recursive'
          token: ${{ secrets.PAT }}
      - id: simulation
        run: |
          docker run --network host -e GITHUB_ACTIONS="${GITHUB_ACTIONS}" -v `pwd`:/jtcores jotego/linter /jtcores/modules/jtframe/devops/xsimunit.sh /jtcores/${{matrix.unitsim}}
  rotation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Install isolated rotation test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator python3-pil
      - name: Check rotation across pixel enable cadences
        run: /usr/bin/python3 modules/jtframe/ver/video/rotation/run.py --suite
  jttms10:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: 'recursive'
          token: ${{ secrets.PAT }}
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23.4'
      - name: Install CPU simulation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog python3-yaml
      - name: Check CPU architecture, bus protocols and TI instruction timing
        env:
          JTTMS10_TIMING_REPORT: ${{ github.workspace }}/jttms10-timing.json
        run: PATH="/usr/bin:$PATH" bash modules/jttms10/ver/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jttms10-timing
          path: jttms10-timing.json
          if-no-files-found: ignore
