name: Unit Simulations

on:
  workflow_dispatch:
  workflow_call:
  repository_dispatch:
    types: rebuild
  push:
    branches:
      - master
  schedule:
    - cron: '0 0 * * *' # runs every night
jobs:
  # Run jobs in the private mirror only for PRs; keep public triggers unchanged.
  find_unit_sims:
    if: ${{ github.repository != 'jotego/jtcores-private' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    outputs:
      unitsims: ${{ steps.generate-matrix.outputs.unitsims }}
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: 'recursive'
        token: ${{ secrets.PAT || github.token }}
    - id: generate-matrix
      run: |
        for folder in `find -name .simunit | xargs dirname`; do
          if [ ! -z "$UNITSIMS" ]; then UNITSIMS="$UNITSIMS, "; fi
          UNITSIMS="$UNITSIMS \"$folder\""
        done
        UNITSIMS="[ $UNITSIMS ]"
        echo $UNITSIMS
        echo "unitsims=${UNITSIMS}" >> $GITHUB_OUTPUT
  run_sims:
    if: ${{ github.repository != 'jotego/jtcores-private' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    needs:
      - find_unit_sims
    strategy:
      fail-fast: false
      matrix:
        unitsim: ${{ fromJSON(needs.find_unit_sims.outputs.unitsims) }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: 'recursive'
          token: ${{ secrets.PAT || github.token }}
      - id: simulation
        run: |
          docker run --network host -e GITHUB_ACTIONS="${GITHUB_ACTIONS}" -v `pwd`:/jtcores jotego/linter /jtcores/modules/jtframe/devops/xsimunit.sh /jtcores/${{matrix.unitsim}}
  rotation:
    if: ${{ github.repository != 'jotego/jtcores-private' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Install isolated rotation test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator python3-pil
      - name: Check rotation across pixel enable cadences
        run: /usr/bin/python3 modules/jtframe/ver/video/rotation/run.py --suite
