name: Cores affected by pull request

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
concurrency:
  group: affected-cores-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: write

jobs:
  affected_cores:
    runs-on: ubuntu-24.04
    outputs:
      affected-cores: ${{ steps.analyze.outputs.affected-cores }}
      affected-core-names: ${{ steps.analyze.outputs.affected-core-names }}
      unresolved-cores: ${{ steps.analyze.outputs.unresolved-cores }}
    steps:
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23.4'

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Initialize submodules
        run: |
          if [ -n "$PAT" ]; then
            git config --global \
              url."https://x-access-token:${PAT}@github.com/".insteadOf \
              "git@github.com:"
          fi
          git submodule init
          for sm in $(git config --file .gitmodules --get-regexp path | awk '{print $2}'); do
            git submodule update --init --recursive -- "$sm" 2>&1 || \
              echo "::warning::Skipped submodule $sm"
          done
        env:
          PAT: ${{ secrets.PAT }}
          GIT_TERMINAL_PROMPT: '0'

      - name: Build JTFRAME CLI
        env:
          JTROOT: ${{ github.workspace }}
          JTFRAME: ${{ github.workspace }}/modules/jtframe
          CORES: ${{ github.workspace }}/cores
          MODULES: ${{ github.workspace }}/modules
          JTBIN: ${{ runner.temp }}/jtbin
        run: |
          mkdir -p "$JTBIN"
          "$JTFRAME/bin/jtframe" --help > /dev/null

      - name: List changed pull-request files
        id: changed-files
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          result-encoding: string
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            return JSON.stringify(files.map(({ filename }) => filename));

      - id: analyze
        uses: jotego/jtcheck@v0
        with:
          repository-path: .
          changed-files: ${{ steps.changed-files.outputs.result }}
          skip-submodules: modules/jt900h,modules/jtframe/target/pocket,modules/jt680x/crasm

      - name: Find existing comment
        id: find-comment
        continue-on-error: true
        uses: peter-evans/find-comment@3eae4d37986fb5a8592848f6a574fdf654e61f9e # v3.1.0
        with:
          token: ${{ github.token }}
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: '<!-- jtcores-affected-cores -->'
          direction: first

      - name: Create affected-cores comment
        if: steps.find-comment.outcome == 'success' && steps.find-comment.outputs.comment-id == 0
        continue-on-error: true
        uses: peter-evans/create-or-update-comment@71345be0265236311c031f5c7866368bd1eff043 # v4.0.0
        with:
          token: ${{ github.token }}
          issue-number: ${{ github.event.pull_request.number }}
          body: ${{ steps.analyze.outputs.pull-request-comment }}

      - name: Update affected-cores comment
        if: steps.find-comment.outcome == 'success' && steps.find-comment.outputs.comment-id != 0
        continue-on-error: true
        uses: peter-evans/create-or-update-comment@71345be0265236311c031f5c7866368bd1eff043 # v4.0.0
        with:
          token: ${{ github.token }}
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          edit-mode: replace
          body: ${{ steps.analyze.outputs.pull-request-comment }}
