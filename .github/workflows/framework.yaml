name: Framework Unit Tests

on:
  workflow_dispatch:
  workflow_call:
  repository_dispatch:
    types: rebuild
  push:
    branches:
      - master
  schedule:
    - cron: '0 0 * * *' # runs every night
jobs:
  # Run jobs in the private mirror only for PRs; keep public triggers unchanged.
  framework:
    if: ${{ github.repository != 'jotego/jtcores-private' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.23.4'
    - uses: actions/checkout@v5
      with:
        submodules: 'recursive'
        token: ${{ secrets.PAT || github.token }}
    - id: bash
      run: |
        source setprj.sh
        $JTFRAME/bin/jtsim-funcs-test.sh
    - id: go
      run: |
        source ./setprj.sh
        cd $JTFRAME/src/jtframe
        go test ./...
        cd $JTFRAME/src/jtutil
        go test ./...
