# Each case loads the 16-bit words consecutively at `entry` (a bit address).
# `after` is the opcode's bit address. `pc` is the PC after retirement.
# The testbench samples one retire pulse per expected checkpoint.
# Unlisted registers/status bits are deliberately unconstrained.
# `mem` at case level initializes consecutive 16-bit physical words at a
# bit-addressed, 16-bit-aligned `at`. `mem` in a check compares `size` raw
# bits (1..32) beginning at bit address `addr`, with bit 0 at that address.
# Each short branch row expands to one program exercising both outcomes.
short_branch_conditions:
  - {code: 0x1, mnemonic: P,  taken_st: 0x00000010, not_st: 0x80000010}
  - {code: 0x2, mnemonic: LS, taken_st: 0x40000010, not_st: 0x00000010}
  - {code: 0x3, mnemonic: HI, taken_st: 0x00000010, not_st: 0x40000010}
  - {code: 0x4, mnemonic: LT, taken_st: 0x80000010, not_st: 0x00000010}
  - {code: 0x5, mnemonic: GE, taken_st: 0x00000010, not_st: 0x80000010}
  - {code: 0x6, mnemonic: LE, taken_st: 0x80000010, not_st: 0x00000010}
  - {code: 0x7, mnemonic: GT, taken_st: 0x00000010, not_st: 0x20000010}
  - {code: 0x8, mnemonic: C,  taken_st: 0x40000010, not_st: 0x00000010}
  - {code: 0x9, mnemonic: NC, taken_st: 0x00000010, not_st: 0x40000010}
  - {code: 0xA, mnemonic: EQ, taken_st: 0x20000010, not_st: 0x00000010}
  - {code: 0xB, mnemonic: NE, taken_st: 0x00000010, not_st: 0x20000010}
  - {code: 0xC, mnemonic: V,  taken_st: 0x10000010, not_st: 0x00000010}
  - {code: 0xD, mnemonic: NV, taken_st: 0x00000010, not_st: 0x10000010}
  - {code: 0xE, mnemonic: N,  taken_st: 0x80000010, not_st: 0x00000010}
  - {code: 0xF, mnemonic: NN, taken_st: 0x00000010, not_st: 0x80000010}
cases:
  - name: reset_vector_and_movk32
    entry: 0x1000
    mem:
      - {at: 0x0200, words: [0xA55A, 0x5AA5, 0x0F0F]}
    words: [0x1800, 0x0300] # MOVK 32,A0; NOP
    checks:
      - after: 0x1000
        pc: 0x1010
        regs: {A0: 32}
        st: 0x00000010
        mem:
          - {addr: 0x0204, size: 20, value: 0xA5A55}
          - {addr: 0x0210, size: 32, value: 0x0F0F5AA5}
      - {after: 0x1010, pc: 0x1020, regs: {A0: 32}, st: 0x00000010}

  - name: immediate_arithmetic_and_move
    entry: 0x1000
    words:
      - 0x09C0 # MOVI IW 5,A0
      - 0x0005
      - 0x1060 # ADDK 3,A0
      - 0x1420 # SUBK 1,A0
      - 0x4C01 # MOVE A0,A1
      - 0x4001 # ADD A0,A1
      - 0x4401 # SUB A0,A1
      - 0x4E02 # MOVE A0,B2 (cross file)
      - 0x09C3 # MOVI IW -1,A3
      - 0xFFFF
      - 0x09F4 # MOVI IL 80000000,B4
      - 0x0000
      - 0x8000
    checks:
      - {after: 0x1000, pc: 0x1020, regs: {A0: 5}, flags: {N: 0, Z: 0, V: 0}}
      - {after: 0x1020, pc: 0x1030, regs: {A0: 8}, flags: {N: 0, Z: 0, C: 0, V: 0}}
      - {after: 0x1030, pc: 0x1040, regs: {A0: 7}, flags: {N: 0, Z: 0, C: 0, V: 0}}
      - {after: 0x1040, pc: 0x1050, regs: {A1: 7}, flags: {N: 0, Z: 0, C: 0, V: 0}}
      - {after: 0x1050, pc: 0x1060, regs: {A1: 14}, flags: {N: 0, Z: 0, C: 0, V: 0}}
      - {after: 0x1060, pc: 0x1070, regs: {A1: 7}, flags: {N: 0, Z: 0, C: 0, V: 0}}
      - {after: 0x1070, pc: 0x1080, regs: {B2: 7}, flags: {N: 0, Z: 0, C: 0, V: 0}}
      - {after: 0x1080, pc: 0x10A0, regs: {A3: 0xFFFFFFFF}, flags: {N: 1, Z: 0, V: 0}}
      - {after: 0x10A0, pc: 0x10D0, regs: {B4: 0x80000000}, flags: {N: 1, Z: 0, V: 0}}

  - name: conditional_branch_taken_and_not_taken
    entry: 0x1000
    words:
      - 0x09C0 # MOVI IW 0,A0: Z=1
      - 0x0000
      - 0xCA01 # JR EQ,+1; skips MOVK 31,A0
      - 0x1BE0 # skipped
      - 0x1820 # MOVK 1,A0; leaves Z=1
      - 0x09C1 # MOVI IW 1,A1: Z=0
      - 0x0001
      - 0xCA01 # JR EQ,+1; not taken
      - 0x1BE0 # MOVK 31,A0
    checks:
      - {after: 0x1000, pc: 0x1020, regs: {A0: 0}, flags: {Z: 1}}
      - {after: 0x1020, pc: 0x1040, regs: {A0: 0}, flags: {Z: 1}}
      - {after: 0x1040, pc: 0x1050, regs: {A0: 1}, flags: {Z: 1}}
      - {after: 0x1050, pc: 0x1070, regs: {A1: 1}, flags: {Z: 0}}
      - {after: 0x1070, pc: 0x1080, regs: {A0: 1}, flags: {Z: 0}}
      - {after: 0x1080, pc: 0x1090, regs: {A0: 31}, flags: {Z: 0}}

  - name: jump_register_alignment
    entry: 0x1000
    words:
      - 0x09E3 # MOVI IL 0x1087,A3
      - 0x1087
      - 0x0000
      - 0x0163 # JUMP A3; target low nibble is cleared
      - 0x1BE0 # skipped MOVK 31,A0
      - 0x0300
      - 0x0300
      - 0x0300
      - 0x1820 # target at 0x1080: MOVK 1,A0
    checks:
      - {after: 0x1000, pc: 0x1030, regs: {A3: 0x1087}}
      - {after: 0x1030, pc: 0x1080, regs: {A3: 0x1087}}
      - {after: 0x1080, pc: 0x1090, regs: {A0: 1}}

  - name: carry_borrow_and_signed_overflow
    entry: 0x1000
    words:
      - 0x09E0 # MOVI IL FFFFFFFF,A0
      - 0xFFFF
      - 0xFFFF
      - 0x1020 # ADDK 1,A0 -> 0 with carry
      - 0x1420 # SUBK 1,A0 -> FFFFFFFF with borrow
      - 0x09E1 # MOVI IL 7FFFFFFF,A1
      - 0xFFFF
      - 0x7FFF
      - 0x1021 # ADDK 1,A1 -> signed overflow
      - 0x09E2 # MOVI IL 80000000,A2
      - 0x0000
      - 0x8000
      - 0x1422 # SUBK 1,A2 -> signed overflow
    checks:
      - {after: 0x1000, pc: 0x1030, regs: {A0: 0xFFFFFFFF}, flags: {N: 1, C: 0, Z: 0, V: 0}}
      - {after: 0x1030, pc: 0x1040, regs: {A0: 0}, flags: {N: 0, C: 1, Z: 1, V: 0}}
      - {after: 0x1040, pc: 0x1050, regs: {A0: 0xFFFFFFFF}, flags: {N: 1, C: 1, Z: 0, V: 0}}
      - {after: 0x1050, pc: 0x1080, regs: {A1: 0x7FFFFFFF}, flags: {N: 0, C: 1, Z: 0, V: 0}}
      - {after: 0x1080, pc: 0x1090, regs: {A1: 0x80000000}, flags: {N: 1, C: 0, Z: 0, V: 1}}
      - {after: 0x1090, pc: 0x10C0, regs: {A2: 0x80000000}, flags: {N: 1, C: 0, Z: 0, V: 0}}
      - {after: 0x10C0, pc: 0x10D0, regs: {A2: 0x7FFFFFFF}, flags: {N: 0, C: 0, Z: 0, V: 1}}

  - name: movi_word_sign_zero_and_carry_preserve
    entry: 0x1000
    words:
      - 0x0DE0 # SETC
      - 0x09C0 # MOVI IW -1,A0
      - 0xFFFF
      - 0x09C1 # MOVI IW 0,A1
      - 0x0000
      - 0x09D0 # MOVI IW 8000,B0 -> FFFF8000
      - 0x8000
    checks:
      - {after: 0x1000, pc: 0x1010, flags: {C: 1}}
      - {after: 0x1010, pc: 0x1030, regs: {A0: 0xFFFFFFFF}, flags: {N: 1, C: 1, Z: 0, V: 0}}
      - {after: 0x1030, pc: 0x1050, regs: {A1: 0}, flags: {N: 0, C: 1, Z: 1, V: 0}}
      - {after: 0x1050, pc: 0x1070, regs: {B0: 0xFFFF8000}, flags: {N: 1, C: 1, Z: 0, V: 0}}

  - name: logical_updates_only_z
    entry: 0x1000
    words:
      - 0x09E0 # MOVI IL 7FFFFFFF,A0
      - 0xFFFF
      - 0x7FFF
      - 0x1020 # ADDK 1,A0 -> N=1,V=1
      - 0x0DE0 # SETC -> C=1
      - 0x1821 # MOVK 1,A1; flags unchanged
      - 0x5020 # AND A1,A0 -> zero, preserve N/C/V
      - 0x1862 # MOVK 3,A2
      - 0x5222 # ANDN A1,A2 -> 2
      - 0x5420 # OR A1,A0 -> 1
      - 0x5600 # XOR A0,A0 -> zero
    checks:
      - {after: 0x1000, pc: 0x1030, regs: {A0: 0x7FFFFFFF}}
      - {after: 0x1030, pc: 0x1040, regs: {A0: 0x80000000}, flags: {N: 1, C: 0, Z: 0, V: 1}}
      - {after: 0x1040, pc: 0x1050, flags: {N: 1, C: 1, Z: 0, V: 1}}
      - {after: 0x1050, pc: 0x1060, regs: {A1: 1}, flags: {N: 1, C: 1, Z: 0, V: 1}}
      - {after: 0x1060, pc: 0x1070, regs: {A0: 0}, flags: {N: 1, C: 1, Z: 1, V: 1}}
      - {after: 0x1070, pc: 0x1080, regs: {A2: 3}, flags: {N: 1, C: 1, Z: 1, V: 1}}
      - {after: 0x1080, pc: 0x1090, regs: {A2: 2}, flags: {N: 1, C: 1, Z: 0, V: 1}}
      - {after: 0x1090, pc: 0x10A0, regs: {A0: 1}, flags: {N: 1, C: 1, Z: 0, V: 1}}
      - {after: 0x10A0, pc: 0x10B0, regs: {A0: 0}, flags: {N: 1, C: 1, Z: 1, V: 1}}

  - name: shared_sp_alias
    entry: 0x1000
    words:
      - 0x09CF # MOVI IW 1234,A15 (SP)
      - 0x1234
      - 0x4DE0 # MOVE A15,A0
      - 0x183F # MOVK 1,B15 (the same SP)
      - 0x4DF1 # MOVE B15,B1
    checks:
      - {after: 0x1000, pc: 0x1020, regs: {A15: 0x1234, B15: 0x1234}}
      - {after: 0x1020, pc: 0x1030, regs: {A0: 0x1234}}
      - {after: 0x1030, pc: 0x1040, regs: {A15: 1, B15: 1}}
      - {after: 0x1040, pc: 0x1050, regs: {B1: 1}}

  - name: immediate_arithmetic_iw_complement_and_flags
    entry: 0x1000
    words:
      - 0x09E0 # MOVI IL 7FFFFFFF,A0
      - 0xFFFF
      - 0x7FFF
      - 0x0B00 # ADDI IW 1,A0 -> 80000000, signed overflow
      - 0x0001
      - 0x0BE0 # SUBI IW 1,A0; extension is one's complement of 1
      - 0xFFFE
      - 0x0B40 # CMPI IW -1,A0; extension is one's complement of FFFF
      - 0x0000
    checks:
      - {after: 0x1000, pc: 0x1030, regs: {A0: 0x7FFFFFFF}}
      - {after: 0x1030, pc: 0x1050, regs: {A0: 0x80000000}, flags: {N: 1, C: 0, Z: 0, V: 1}}
      - {after: 0x1050, pc: 0x1070, regs: {A0: 0x7FFFFFFF}, flags: {N: 0, C: 0, Z: 0, V: 1}}
      - {after: 0x1070, pc: 0x1090, regs: {A0: 0x7FFFFFFF}, flags: {N: 1, C: 1, Z: 0, V: 1}}

  - name: immediate_arithmetic_il_complement_and_flags
    entry: 0x1000
    words:
      - 0x09F1 # MOVI IL FFFFFFFF,B1
      - 0xFFFF
      - 0xFFFF
      - 0x0B31 # ADDI IL 1,B1 -> zero with carry
      - 0x0001
      - 0x0000
      - 0x0D11 # SUBI IL 1,B1; both extension words complemented
      - 0xFFFE
      - 0xFFFF
      - 0x0B71 # CMPI IL -1,B1; complement is 00000000
      - 0x0000
      - 0x0000
    checks:
      - {after: 0x1000, pc: 0x1030, regs: {B1: 0xFFFFFFFF}}
      - {after: 0x1030, pc: 0x1060, regs: {B1: 0}, flags: {N: 0, C: 1, Z: 1, V: 0}}
      - {after: 0x1060, pc: 0x1090, regs: {B1: 0xFFFFFFFF}, flags: {N: 1, C: 1, Z: 0, V: 0}}
      - {after: 0x1090, pc: 0x10C0, regs: {B1: 0xFFFFFFFF}, flags: {N: 0, C: 0, Z: 1, V: 0}}

  - name: illegal_opcode_traps_to_vector_thirty
    entry: 0x1000
    vectors: {30: 0x1080} # ILLOP vector at FFFFFC20 (TI guide, 8-9)
    words:
      - 0x09CF # MOVI IW 0x0300,SP
      - 0x0300
      - 0x0200 # reserved opcode: acts as TRAP 30
      - 0x1821 # MOVK 1,A1 after RETI
      - 0x0300
      - 0x0300
      - 0x0300
      - 0x0300
      - 0x0940 # RETI in vector 30 handler
    checks:
      - {after: 0x1000, pc: 0x1020, regs: {A15: 0x0300}}
      - after: 0x1020
        pc: 0x1080
        st: 0x00000010
        regs: {A15: 0x02C0}
        mem:
          - {addr: 0x02C0, size: 32, value: 0x00000010}
          - {addr: 0x02E0, size: 32, value: 0x00001030}
      - {after: 0x1080, pc: 0x1030, st: 0x00000010, regs: {A15: 0x0300}}
      - {after: 0x1030, pc: 0x1040, regs: {A1: 1}}

  - name: pause_across_memory_ack
    entry: 0x1000
    words: [0x09C0, 0x0007, 0x1020] # MOVI IW 7,A0; ADDK 1,A0
    pause_on_ack: true
    expected_requests: 4 # reset vector + three instruction words, each once
    checks:
      - {after: 0x1000, pc: 0x1020, regs: {A0: 7}}
      - {after: 0x1020, pc: 0x1030, regs: {A0: 8}}

  - name: plain_move_field16_unaligned
    entry: 0x1000
    mem:
      - {at: 0x0200, words: [0xA55A, 0x5AA5, 0x0F0F]}
    words:
      - 0x09C0 # MOVI IW 0x020B,A0: pointer uses a bit address
      - 0x020B
      - 0x09C1 # MOVI IW 0xDEAD,A1: store low 16 bits
      - 0xDEAD
      - 0x8020 # MOVE A1,*A0, FS0=16
      - 0x8402 # MOVE *A0,A2, FE0=0 (zero extension)
    checks:
      - {after: 0x1000, pc: 0x1020, regs: {A0: 0x020B}}
      - {after: 0x1020, pc: 0x1040, regs: {A1: 0xFFFFDEAD}}
      - after: 0x1040
        pc: 0x1050
        regs: {A0: 0x020B}
        mem:
          - {addr: 0x0200, size: 16, value: 0x6D5A}
          - {addr: 0x0210, size: 16, value: 0x5EF5}
          - {addr: 0x0220, size: 16, value: 0x0F0F}
          - {addr: 0x020B, size: 16, value: 0xDEAD}
      - {after: 0x1050, pc: 0x1060, regs: {A2: 0x0000DEAD}, flags: {N: 0, Z: 0, V: 0}}

  - name: plain_move_field8_sign_extension
    entry: 0x1000
    mem:
      - {at: 0x0200, words: [0x80A5, 0x1234]}
    words:
      - 0x09C0 # MOVI IW 0x0200,A0
      - 0x0200
      - 0x09C1 # MOVI IW 0x28,A1: FE0=1, FS0=8
      - 0x0028
      - 0x01A1 # PUTST A1
      - 0x8402 # MOVE *A0,A2; byte A5 sign-extends
      - 0x0183 # GETST A3; inspect updated N and field bits
      - 0x09C4 # MOVI IW 0xF0,A4
      - 0x00F0
      - 0x8080 # MOVE A4,*A0; low byte only
      - 0x8405 # MOVE *A0,A5; byte F0 sign-extends
    checks:
      - {after: 0x1000, pc: 0x1020, regs: {A0: 0x0200}}
      - {after: 0x1020, pc: 0x1040, regs: {A1: 0x28}}
      - {after: 0x1040, pc: 0x1050, st: 0x00000028}
      - {after: 0x1050, pc: 0x1060, regs: {A2: 0xFFFFFFA5}, flags: {N: 1, Z: 0, V: 0}}
      - {after: 0x1060, pc: 0x1070, regs: {A3: 0x80000028}}
      - {after: 0x1070, pc: 0x1090, regs: {A4: 0xF0}}
      - after: 0x1090
        pc: 0x10A0
        mem:
          - {addr: 0x0200, size: 16, value: 0x80F0}
          - {addr: 0x0210, size: 16, value: 0x1234}
      - {after: 0x10A0, pc: 0x10B0, regs: {A5: 0xFFFFFFF0}, flags: {N: 1, Z: 0, V: 0}}

  - name: plain_move_field32_unaligned
    entry: 0x1000
    mem:
      - {at: 0x0200, words: [0x80A5, 0x1234, 0xAAAA, 0x5555, 0x0F0F]}
    words:
      - 0x09C0 # MOVI IW 0x0200,A0
      - 0x0200
      - 0x8601 # MOVE *A0,A1, FS1=32
      - 0x09E2 # MOVI IL 0xCAFEBABE,A2
      - 0xBABE
      - 0xCAFE
      - 0x09C3 # MOVI IW 0x0223,A3
      - 0x0223
      - 0x8243 # MOVE A2,*A3, FS1=32, unaligned three-word write
      - 0x8664 # MOVE *A3,A4, FS1=32
    checks:
      - {after: 0x1000, pc: 0x1020, regs: {A0: 0x0200}}
      - {after: 0x1020, pc: 0x1030, regs: {A1: 0x123480A5}}
      - {after: 0x1030, pc: 0x1060, regs: {A2: 0xCAFEBABE}}
      - {after: 0x1060, pc: 0x1080, regs: {A3: 0x0223}}
      - after: 0x1080
        pc: 0x1090
        regs: {A3: 0x0223}
        mem:
          - {addr: 0x0200, size: 16, value: 0x80A5}
          - {addr: 0x0210, size: 16, value: 0x1234}
          - {addr: 0x0220, size: 16, value: 0xD5F2}
          - {addr: 0x0230, size: 16, value: 0x57F5}
          - {addr: 0x0240, size: 16, value: 0x0F0E}
          - {addr: 0x0223, size: 32, value: 0xCAFEBABE}
      - {after: 0x1090, pc: 0x10A0, regs: {A4: 0xCAFEBABE}}

  - name: plain_move_sp_pointer_alias
    entry: 0x1000
    mem:
      - {at: 0x0200, words: [0xBEEF, 0xCAFE]}
    words:
      - 0x09CF # MOVI IW 0x0200,A15 (shared SP)
      - 0x0200
      - 0x85F1 # MOVE *B15,B1: pointer through B-file SP alias
      - 0x09D2 # MOVI IW 0x1234,B2
      - 0x1234
      - 0x805F # MOVE B2,*B15
      - 0x85E3 # MOVE *A15,A3: read through A-file SP alias
    checks:
      - {after: 0x1000, pc: 0x1020, regs: {A15: 0x0200, B15: 0x0200}}
      - {after: 0x1020, pc: 0x1030, regs: {B1: 0xBEEF, A15: 0x0200}}
      - {after: 0x1030, pc: 0x1050, regs: {B2: 0x1234}}
      - after: 0x1050
        pc: 0x1060
        regs: {A15: 0x0200, B15: 0x0200}
        mem:
          - {addr: 0x0200, size: 16, value: 0x1234}
          - {addr: 0x0210, size: 16, value: 0xCAFE}
      - {after: 0x1060, pc: 0x1070, regs: {A3: 0x1234, A15: 0x0200}}

  - name: move_postinc_predec_and_aliases
    entry: 0x1000
    mem:
      - {at: 0x0200, words: [0x1111, 0x2222, 0x3333, 0x4444]}
    words:
      - 0x09C0 # MOVI IW 0x0210,A0
      - 0x0210
      - 0xA401 # MOVE -*A0,A1: predecrement load
      - 0x9402 # MOVE *A0+,A2: postincrement load
      - 0x9400 # MOVE *A0+,A0: loaded value wins over pointer increment
      - 0x09C3 # MOVI IW 0x0220,A3
      - 0x0220
      - 0x09C4 # MOVI IW 0xABCD,A4
      - 0xABCD
      - 0x9083 # MOVE A4,*A3+: postincrement store
      - 0xA083 # MOVE A4,-*A3: predecrement store
      - 0x9063 # MOVE A3,*A3+: old pointer data must be stored
    checks:
      - {after: 0x1000, pc: 0x1020, regs: {A0: 0x0210}}
      - {after: 0x1020, pc: 0x1030, regs: {A0: 0x0200, A1: 0x1111}}
      - {after: 0x1030, pc: 0x1040, regs: {A0: 0x0210, A2: 0x1111}}
      - {after: 0x1040, pc: 0x1050, regs: {A0: 0x2222}}
      - {after: 0x1050, pc: 0x1070, regs: {A3: 0x0220}}
      - {after: 0x1070, pc: 0x1090, regs: {A4: 0xFFFFABCD}, flags: {N: 1}}
      - after: 0x1090
        pc: 0x10A0
        regs: {A3: 0x0230}
        mem:
          - {addr: 0x0220, size: 16, value: 0xABCD}
          - {addr: 0x0230, size: 16, value: 0x4444}
      - {after: 0x10A0, pc: 0x10B0, regs: {A3: 0x0220}, mem: [{addr: 0x0220, size: 16, value: 0xABCD}]}
      - {after: 0x10B0, pc: 0x10C0, regs: {A3: 0x0230}, mem: [{addr: 0x0220, size: 16, value: 0x0220}]}

  - name: predecrement_store_same_register_uses_updated_pointer
    entry: 0x1000
    mem:
      - {at: 0x0220, words: [0x1111, 0xBEEF, 0x3333]}
    words:
      - 0x09C0 # MOVI IW 0x0240,A0
      - 0x0240
      - 0xA000 # MOVE A0,-*A0: decrement A0 before sampling source field
    checks:
      - {after: 0x1000, pc: 0x1020, regs: {A0: 0x0240}}
      - after: 0x1020
        pc: 0x1030
        st: 0x00000010
        regs: {A0: 0x0230}
        mem:
          - {addr: 0x0220, size: 16, value: 0x1111}
          - {addr: 0x0230, size: 16, value: 0x0230}
          - {addr: 0x0240, size: 16, value: 0x3333}
