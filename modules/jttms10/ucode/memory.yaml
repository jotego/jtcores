# TI SPVU001A pp. 12-127..155; addresses and pointer increments are in BITS.
# MOVB shares these sequences; the opcode forces byte width/sign extension.
ucode:
  - name: store
    start: 33
    seq:
      - write_mem, ni
  - name: load
    start: 34
    seq:
      - read_mem, ext_a
      - pass_alu, wr_reg, nzv_cc, ni
  - name: storepi
    start: 35
    seq:
      - size_a, reg_b
      - add_alu, wr_reg, write_mem, ni
  - name: loadpi
    start: 36
    seq:
      - size_a, bsrc
      - add_alu, wrsrc
      - read_mem, ext_a
      - pass_alu, wr_reg, nzv_cc, ni
  - name: storepd
    start: 37
    seq:
      - size_a, reg_b
      - sub_alu, sum_ea, wr_reg
      # The source is sampled AFTER predecrement (TI p.12-130). If Rs==Rd,
      # the value written is the decremented pointer, not its original value.
      - reg_a
      - a_md
      - write_mem, ni
  - name: loadpd
    start: 38
    seq:
      - size_a, bsrc
      - sub_alu, sum_ea, wrsrc
      - read_mem, ext_a
      - pass_alu, wr_reg, nzv_cc, ni
  - name: storeoff
    start: 39
    seq:
      - imm_bus, pcinc, immse_a, reg_b
      - add_alu, sum_ea
      - write_mem, ni
  - name: loadoff
    start: 40
    seq:
      - imm_bus, pcinc, immse_a, bsrc
      - add_alu, sum_ea
      - read_mem, ext_a
      - pass_alu, wr_reg, nzv_cc, ni
  - name: storeabs
    start: 41
    seq:
      - imm_bus, pcinc, immlo_a
      - imm_bus, pcinc, immhi_a, a_ea
      - write_mem, ni
  - name: loadabs
    start: 42
    seq:
      - imm_bus, pcinc, immlo_a
      - imm_bus, pcinc, immhi_a, a_ea
      - read_mem, ext_a
      - pass_alu, wr_reg, nzv_cc, ni
  - name: moveind
    start: 43
    seq:
      # Prime both pointers at opcode acceptance; the read captures the
      # entire source before posting the destination, including overlaps.
      - read_mem
      - write_mem, ni
  - name: movepi
    start: 44
    seq:
      - size_a, bsrc
      - add_alu, wrsrc
      - size_a, reg_b
      - read_mem
      - add_alu, wr_reg, write_mem, ni
  - name: movepd
    start: 45
    seq:
      - size_a, bsrc
      - sub_alu, sum_ea, wrsrc
      - size_a, reg_b
      # Keep the source EA intact while its read is outstanding.
      - sub_alu, wr_reg
      - read_mem
      - write_mem, ni
  - name: moveoff
    start: 46
    seq:
      - imm_bus, pcinc, immse_a, bsrc
      - add_alu, sum_ea
      - imm_bus, pcinc, immse_a, reg_b, ea_tmp
      - add_alu, sum_ea
      - swap_ea
      - read_mem
      - write_mem, ni
  - name: moveoffpi
    start: 47
    seq:
      - imm_bus, pcinc, immse_a, bsrc
      - add_alu, sum_ea
      - size_a, reg_b
      - read_mem
      - add_alu, wr_reg, write_mem, ni
  - name: moveabspi
    start: 48
    seq:
      - imm_bus, pcinc, immlo_a
      - imm_bus, pcinc, immhi_a, a_ea
      - size_a, reg_b
      - read_mem
      - add_alu, wr_reg, write_mem, ni
  - name: moveabs
    start: 49
    seq:
      - imm_bus, pcinc, immlo_a
      - imm_bus, pcinc, immhi_a, a_ea
      - imm_bus, pcinc, immlo_a, ea_tmp
      - imm_bus, pcinc, immhi_a, a_ea
      - swap_ea
      - read_mem
      - write_mem, ni
