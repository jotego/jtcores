# Generic LINE0/LINE1 microprogram. The parent graphics ROM includes this
# leaf. B0, B2 and full-width B10 are committed before every CHECK boundary.
# Scratch 36/37 hold 2b and 2b-2a across XY conversion. The two read ports
# capture the chosen increment and B2 together after the decision writeback.
constants:
  TARGET_GLINEEMPTY: t4 t6 t10 t11
  TARGET_GLINECONVERT: t6 t10 t11
  TARGET_GLINEINIT: t7 t9 t10
  TARGET_GLINELOOP: t4 t7 t9 t10
  TARGET_GLINEW1: t5 t7 t9 t10
  TARGET_GLINEW2: t4 t5 t7 t9 t10
  TARGET_GLINEW3: t6 t7 t9 t10
  TARGET_GLINEDRAW: t4 t6 t7 t9 t10
  TARGET_GLINEADVANCE: t5 t6 t7 t9 t10
  TARGET_GLINEDIAG: t4 t5 t6 t7 t9 t10
  TARGET_GLINELATERAL: t8 t9 t10
  TARGET_GLINECOUNT: t5 t8 t9 t10
  TARGET_GLINEFINISH: t4 t6 t8 t9 t10
  TARGET_GLINEWVP: t5 t6 t8 t9 t10
  TARGET_GLINEFASTINIT: t5 t6 t10 t11
  TARGET_GLINEFASTCONVERT: t4 t5 t6 t10 t11
  TARGET_GLINEFASTPOST: t7 t10 t11
  TARGET_GLINEFASTDIAG: t4 t7 t10 t11
  TARGET_GLINEFASTLATERAL: t5 t7 t10 t11
  TARGET_GLINEFASTCOUNT: t4 t5 t7 t10 t11
  TARGET_GLINEFASTFINISH: t6 t7 t10 t11
  TARGET_GLINEFASTWINPREP: t4 t6 t7 t10 t11
  TARGET_GLINEFASTNEXT0: t5 t6 t7 t10 t11
  TARGET_GLINEFASTWININIT: t4 t5 t6 t7 t10 t11
ucode:
- name: glineinit
  start: 104
  seq:
  - sa1 sa3 sa4 # B10 COUNT
  - qs_gas, sa1 sa3 sa4
  - z_gcond, jump_gflow, ${TARGET_GLINEEMPTY}, sa0 sa1 sa2 sa4 # prime B7 b:a
  - qs_gas, m4_gam, sa0 sa1 sa2 sa4 # unsigned b
  - shl_galu, a_gdst, sa0 sa1 sa2 sa4
  - rf_gdst, da2 da5, sa0 sa1 sa2 sa4 # scratch36 = 2b
  - b_gdst, qs_gas, m2_gam, sa0 sa1 sa2 sa4 # retain 2b and capture unsigned a
  - shl_galu, a_gdst
  - sub_galu, rf_gdst, da0 da2 da5, jump_gflow, ${TARGET_GLINELOOP} # scratch37 = 2b-2a
- name: glineloop
  start: 105
  seq:
  - w0_gcond, jump_gflow, ${TARGET_GLINEDRAW}, sa1 sa4 # W0 has no window operation
  - qs_gas, sa1 sa4
  - rf_gdst, da0 da5 # scratch33 for window and converter
  - call_gflow, ${TARGET_GWINCHECK}
  - w1_gcond, jump_gflow, ${TARGET_GLINEW1}
  - w2_gcond, jump_gflow, ${TARGET_GLINEW2}
  - w3_gcond, jump_gflow, ${TARGET_GLINEW3}
  - jump_gflow, ${TARGET_GLINEDRAW}
- name: glinew1
  start: 106
  seq:
  - vclip_gflg
  - nclip_gcond, jump_gflow, ${TARGET_GLINEWVP}
  - jump_gflow, ${TARGET_GLINEADVANCE}
- name: glinew2
  start: 107
  seq:
  - vclip_gflg
  - clip_gcond, jump_gflow, ${TARGET_GLINEWVP}
  - jump_gflow, ${TARGET_GLINEDRAW}
- name: glinew3
  start: 108
  seq:
  - vclip_gflg
  - clip_gcond, jump_gflow, ${TARGET_GLINEADVANCE}
  - jump_gflow, ${TARGET_GLINEDRAW}
- name: glinedraw
  start: 109
  seq:
  - call_gflow, ${TARGET_GLINECONVERT}
  - need_gcond, call_gflow, ${TARGET_GPXDREAD}, sa0 sa3 sa4 # B9 COLOR1; bypass source PMASK
  - sa0 sa3 sa4
  - process_gpix, sa0 sa3 sa4
  # The shared bus suppresses a transparent pixel and acknowledges its
  # microstep without launching a field; no separate branch is needed.
  - wrpx_gbus
  - jump_gflow, ${TARGET_GLINEADVANCE}
- name: glineadvance
  start: 110
  seq:
  - sa4 # B0 signed decision
  - qs_gas, sa4
  - linediag_gcond, jump_gflow, ${TARGET_GLINEDIAG}
  - jump_gflow, ${TARGET_GLINELATERAL}
- name: glinediag
  start: 111
  seq:
  - sa0 sa2 sa5, da4 # scratch37 and B0
  - qs_gas, qd_gbs, sa0 sa2 sa5, da4
  - add_galu, rf_gdst, sa0 sa1 sa3 sa4, da4 # B0 += 2b-2a; prime B11
  - sa0 sa1 sa3 sa4, da1 da4 # B11 and B2
  - qs_gas, qd_gbs, sa0 sa1 sa3 sa4, da1 da4
  - add_galu, packed_gmath, rf_gdst, da1 da4, sa1 sa3 sa4, jump_gflow, ${TARGET_GLINECOUNT}
- name: glinelateral
  start: 112
  seq:
  - sa2 sa5, da4 # scratch36 and B0
  - qs_gas, qd_gbs, sa2 sa5, da4
  - add_galu, rf_gdst, sa2 sa3 sa4, da4 # B0 += 2b; prime B12
  - sa2 sa3 sa4, da1 da4 # B12 and B2
  - qs_gas, qd_gbs, sa2 sa3 sa4, da1 da4
  - add_galu, packed_gmath, rf_gdst, da1 da4, sa1 sa3 sa4, jump_gflow, ${TARGET_GLINECOUNT}
- name: glinecount
  start: 114
  seq:
  - qs_gbs, k_gas, m1_gam, sa1 sa3 sa4 # B10 full 32-bit count
  - sub_galu, rf_gdst, da1 da3 da4, lineend_gcond, jump_gflow, ${TARGET_GLINEFINISH}
  - check_gflow
  - jump_gflow, ${TARGET_GLINELOOP}
- name: glinefinish
  start: 117
  seq:
  - end_gflow
- name: glinewvp
  start: 118
  seq:
  - wvp_gflg
  - jump_gflow, ${TARGET_GLINEADVANCE}
# Unreachable schema anchor for LINE-specific controls.
- name: glineschema
  start: 125
  seq:
  - linediag_gcond
# Shared scalar DSP computes Y*pitch and X*PSIZE. B2 and OFFSET are
# synchronous RF reads; the existing ALU ORs the components and adds OFFSET.
- name: glineconvert
  start: 196
  seq:
  - sa1 sa4, da2 da4 # B2 and B4 OFFSET
  - qs_gas, m3_gam, yproduct_gmath, b_gdst, sa1 sa4, da2 da4
  - qs_gas, m2_gam, xproduct_gmath, or_galu, a_gdst, qd_gbs, sa1 sa4, da2 da4
  - add_galu, ea_gdst, ret_gflow, sa0 sa3 sa4 # prime COLOR1 for the caller
# Table12-10 has four setup states even when COUNT is zero. There are
# no pixel or bus events to overlap; keep the remaining setup clocks here.
- name: glineempty
  start: 197
  seq:
  - sa1 sa3 sa4
  - sa1 sa3 sa4
  - sa1 sa3 sa4
  - sa1 sa3 sa4
  - sa1 sa3 sa4
  - sa1 sa3 sa4
  - sa1 sa3 sa4
  - sa1 sa3 sa4
  - end_gflow

# Native replace/W0/W2/W3 schedule: prepare the following pixel during the posted
# physical write. SYNC checkpoints and END share the pixel's intrinsic
# five-state budget; external bus wait states freeze preparation and budget.
- name: glinefastinit
  start: 198
  seq:
  - sa1 sa3 sa4, da1 da3 da4 # COUNT
  - passnow_galu, qs_gas, z_gcond, jump_gflow, ${TARGET_GLINEFASTFINISH}, sa0 sa1 sa2 sa4, da2 da5
  - addnow_galu, qs_gas, m4_gam, qs_gbs, m4_gbm, rf_gdst, wprev, sa0 sa1 sa2 sa4, da0 da2 da5 # scratch36=2b
  - addnow_galu, qs_gas, m4_gam, qs_gbs, m4_gbm, b_gdst, sa0 sa1 sa2 sa4, da0 da2 da5
  - addnow_galu, qs_gas, m2_gam, qs_gbs, m2_gbm, a_gdst, sa0 sa1 sa2 sa4, da0 da2 da5 # A=2a
  - sub_galu, rf_gdst, wprev, call_gflow, ${TARGET_GLINEFASTCONVERT}, sa1 sa4, da2 da4 # scratch37=2b-2a
  - jump_gflow, ${TARGET_GLINEFASTPOST}, sa4, da4
- name: glinefastconvert
  start: 199
  seq:
  - qs_gas, m3_gam, yproduct_gmath, b_gdst, sa1 sa4, da2 da4
  - qs_gas, m2_gam, xproduct_gmath, or_galu, a_gdst, qd_gbs, sa1 sa4, da2 da4
  - add_galu, ea_gdst, sa0 sa3 sa4, da4
  - process_gpix, ret_gflow, sa4, da4
- name: glinefastpost
  start: 200
  seq:
  - postpx_gbus, sa4, da4
  - passnow_galu, qs_gas, linediag_gcond, jump_gflow, ${TARGET_GLINEFASTDIAG}, sa0 sa2 sa5, da4
  - jump_gflow, ${TARGET_GLINEFASTLATERAL}, sa2 sa5, da4
- name: glinefastdiag
  start: 201
  seq:
  - addnow_galu, qs_gas, qd_gbs, rf_gdst, wprev, sa0 sa1 sa3 sa4, da1 da4
  - addnow_galu, qs_gas, qd_gbs, packed_gmath, rf_gdst, wprev, jump_gflow, ${TARGET_GLINEFASTCOUNT}, sa1 sa3 sa4, da1 da3 da4
- name: glinefastlateral
  start: 202
  seq:
  - addnow_galu, qs_gas, qd_gbs, rf_gdst, wprev, sa2 sa3 sa4, da1 da4
  - addnow_galu, qs_gas, qd_gbs, packed_gmath, rf_gdst, wprev, jump_gflow, ${TARGET_GLINEFASTCOUNT}, sa1 sa3 sa4, da1 da3 da4
- name: glinefastcount
  start: 203
  seq:
  - subnow_galu, k_gas, m1_gam, qd_gbs, rf_gdst, wprev, lineend_gcond, jump_gflow, ${TARGET_GLINEFASTFINISH}, sa1 sa4, da2 da4
  - w0_gcond, jump_gflow, ${TARGET_GLINEFASTNEXT0}, sa1 sa4, da0 da2 da4
  - call_gflow, ${TARGET_GLINEFASTWINPREP}, sa1 sa4, da0 da2 da4
  - sync_gbus, check_gflow, sa4, da4
  - jump_gflow, ${TARGET_GLINEFASTPOST}, sa4, da4
- name: glinefastfinish
  start: 204
  seq:
  - sync_gbus, end_gflow

# Packed SUB shares the scalar ALU. Sign correction covers a half-word
# subtraction overflowing when point and limit signs differ.
- name: glinefastwinprep
  start: 205
  seq:
  - subnow_galu, qs_gas, qd_gbs, packed_gmath, xylow_gclip, sa1 sa4, da1 da2 da4
  - subnow_galu, qs_gas, qd_gbs, packed_gmath, xyhigh_gclip, sa1 sa4, da2 da4
  - nclip_gcond, jump_gflow, ${TARGET_GLINEFASTCONVERT}, sa1 sa4, da2 da4
  - ret_gflow, sa4, da4
- name: glinefastnext0
  start: 206
  seq:
  - call_gflow, ${TARGET_GLINEFASTCONVERT}, sa1 sa4, da2 da4
  - sync_gbus, check_gflow, sa4, da4
  - jump_gflow, ${TARGET_GLINEFASTPOST}, sa4, da4
- name: glinefastwininit
  start: 207
  seq:
  - sa1 sa3 sa4, da1 da3 da4
  - passnow_galu, qs_gas, z_gcond, jump_gflow, ${TARGET_GLINEFASTFINISH}, sa0 sa1 sa2 sa4, da2 da5
  - addnow_galu, qs_gas, m4_gam, qs_gbs, m4_gbm, rf_gdst, wprev, sa0 sa1 sa2 sa4, da0 da2 da5
  - addnow_galu, qs_gas, m4_gam, qs_gbs, m4_gbm, b_gdst, sa0 sa1 sa2 sa4, da0 da2 da5
  - addnow_galu, qs_gas, m2_gam, qs_gbs, m2_gbm, a_gdst, sa0 sa1 sa2 sa4, da0 da2 da5
  - sub_galu, rf_gdst, wprev, call_gflow, ${TARGET_GLINEFASTWINPREP}, sa1 sa4, da0 da2 da4
  - jump_gflow, ${TARGET_GLINEFASTPOST}, sa4, da4
