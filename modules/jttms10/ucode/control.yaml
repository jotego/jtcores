# PC' is the bit address after all instruction words have been fetched.
ucode:
  - name: jrl
    start: 50
    seq:
      - imm_bus, pcinc
      - longrel_pc, ni
  - name: jacc
    start: 51
    seq:
      - imm_bus, pcinc, immlo_a
      - imm_bus, pcinc, immhi_a, abs_pc, ni
  # Untaken extended jumps advance over their unused address words. The
  # core still enforces the printed path count before the next fetch.
  - name: jrl_false
    start: 147
    seq:
      - pcinc, ni
  - name: jacc_false
    start: 148
    seq:
      - pcinc
      - pcinc, ni
  - name: getpc
    start: 52
    seq:
      - pc_a
      - pass_alu, wr_reg, ni
  - name: exgpc
    start: 53
    seq:
      - pc_a
      - pass_alu, wr_reg, reg_pc, ni
  - name: rev
    start: 54
    seq:
      - rev_a
      - pass_alu, wr_reg, ni
  - name: pushst
    start: 55
    seq:
      - sub_alu, sum_ea, wr_sp, st_md
      - write_stack, ni
  - name: popst
    start: 56
    seq:
      - pop32_jsr
      - md_st, ni
  - name: callrs
    start: 57
    seq:
      - reg_a, reg_b
      - a_tmp, word_a
      - sub_alu, sum_ea, wr_sp, pc_md
      - write_stack, tmp_pc, ni
  - name: calla
    start: 58
    seq:
      - imm_bus, pcinc, immlo_a
      - imm_bus, pcinc, a_tmp, word_a, reg_b
      - sub_alu, sum_ea, wr_sp, pc_md
      - write_stack, tmp_pc, ni
  - name: callr
    start: 59
    seq:
      - imm_bus, pcinc, a_tmp, word_a, reg_b
      - sub_alu, sum_ea, wr_sp, pc_md
      - write_stack, tmprel_pc, ni
  - name: rets
    start: 60
    seq:
      - reg_b
      - b_ea
      - read_stack
      - retadj_a
      - add_alu, wr_sp, md_pc, ni
  - name: reti
    start: 61
    seq:
      - pop32_jsr
      - md_tmp
      - pop32_jsr
      - tmp_st, md_pc, ni
  - name: trap
    start: 62
    seq:
      - pc_md, word_a, reg_b
      - sub_alu, sum_ea, wr_sp
      - write_stack, st_md, word_a, reg_b
      - sub_alu, sum_ea, wr_sp
      - write_stack, trap_ea
      - read_stack
      - init_st, md_pc, ni
  - name: trap0
    start: 63
    seq:
      - trap_ea
      - read_stack
      - init_st, md_pc, ni
  # A one-level generated JSR is sufficient: callers never invoke another
  # helper from within these routines. Both transfers force a 32-bit field.
  - name: push32
    start: 64
    seq:
      # MSW first: two predecremented 16-bit writes, so the final 32-bit
      # stack value remains little-endian at SP. MD retains the whole value.
      - half_a, reg_b
      - sub_alu, sum_ea, wr_sp
      - write_stack
      - half_a, reg_b
      - sub_alu, sum_ea, wr_sp
      - write_stack, ret_jsr
  - name: pop32
    start: 65
    seq:
      - reg_b
      - b_ea
      - read_stack
      - word_a
      - add_alu, wr_sp, ret_jsr
  # ABS sets N from 0-Rd, but writes |Rd| and preserves C (TI p.12-35).
  - name: abs
    start: 66
    seq:
      - rd_a
      - abs_alu, wr_reg, nzvabs_cc, ni
  - name: neg
    start: 67
    seq:
      - rd_a
      - neg_alu, wr_reg, nvzc_cc, ni
  - name: negb
    start: 68
    seq:
      - rd_a, zero_b
      - sbc_alu, wr_reg, nvzc_cc, ni
  - name: not
    start: 69
    seq:
      - rd_a
      - not_alu, wr_reg, z_cc, ni
  # ANDI/ANDNI share one opcode. Hardware always computes Rd & ~encoded IL;
  # the assembler complements the extension words for source-level ANDI.
  - name: andi
    start: 70
    seq:
      - imm_bus, pcinc
      - immlo_a
      - imm_bus, pcinc
      - immhi_a, reg_b
      - andn_alu, wr_reg, z_cc, ni
  - name: ori
    start: 71
    seq:
      - imm_bus, pcinc
      - immlo_a
      - imm_bus, pcinc
      - immhi_a, reg_b
      - or_alu, wr_reg, z_cc, ni
  - name: xori
    start: 72
    seq:
      - imm_bus, pcinc
      - immlo_a
      - imm_bus, pcinc
      - immhi_a, reg_b
      - xor_alu, wr_reg, z_cc, ni
  # A DSP product by a one-hot operand supplies the complete shift/rotate.
  # Right counts are encoded as their five-bit two's complement in both forms.
  - name: shiftk
    start: 73
    seq:
      - rd_a, kinit_shift
      - wr_reg, finish_shift, ni
  - name: shiftr
    start: 74
    seq:
      - rd_a, rinit_shift
      - wr_reg, finish_shift, ni
  - name: setf
    start: 76
    seq:
      - setf_misc, ni
  - name: sext
    start: 77
    seq:
      - sext_a
      - pass_alu, wr_reg, nzfield_cc, ni
  - name: zext
    start: 78
    seq:
      - zext_a
      - pass_alu, wr_reg, z_cc, ni
  - name: exgf
    start: 79
    seq:
      - exgf_misc, wr_reg, ni
  # K is one's-complement encoded. The register form uses Rs[4:0].
  - name: btst
    start: 80
    seq:
      - rd_a, bsrc
      - btstfinish_misc, ni
  - name: lmo
    start: 81
    seq:
      - reg_a, init_lmo
      - finish_lmo, wr_reg, ni
  # TI pp.12-109..112: the shared leading-bit encoder skips empty
  # positions. Each full-width field completes before the next starts.
  - name: mmtm
    start: 83
    seq:
      - imm_bus, pcinc, init_multi, word_a, reg_b
      - mmtmloop_jsr
  - name: mmfm
    start: 84
    seq:
      - imm_bus, pcinc, init_multi, word_a, reg_b
      - mmfmloop_jsr
  - name: mmtmloop
    start: 85
    seq:
      - sub_alu, sum_ea, ptrwr, reg_a
      - a_md
      - write_stack, advance_multi, word_a, reg_b, ret_jsr
  - name: mmfmloop
    start: 86
    seq:
      - b_ea, add_alu, ptrwr
      - read_stack, listwr, advance_multi, reg_b, ret_jsr
  # Reserved helper ID retained for stable family numbering.
  - name: multinext
    start: 87
    seq: [ni]
  # One inferred unsigned 32x32 product. MPYS corrects its high word
  # for signed operands through the ordinary shared 32-bit ALU.
  - name: mpy
    start: 88
    seq:
      - init_mul
      - step_mul
      - sub_alu, corrq_mul
      - sub_alu, corrm_mul
      - finish_mul
      - wrhi_mul
      - wrlo_mul, ni
  # DIV and MOD share a restoring unsigned loop. Signed forms normalize
  # operands first, then correct quotient and remainder after flag evaluation.
  - name: div
    start: 90
    seq:
      - initdiv_mul
      - loaddiv_mul
      - neg_alu, negdiv_mul
      - neg_alu, negmd_mul
      - sbc_alu, negb_mul
      - sub_alu, checkdiv_mul
      - divloop_jsr
      - finish_mul
      - neg_alu, negmd_mul
      - neg_alu, negb_mul
      - wrhi_mul
      - wrlo_mul, ni
  - name: divloop
    start: 91
    seq:
      - sub_alu, stepdiv_mul, ret_jsr
  - name: divfail
    start: 92
    seq:
      - finish_mul, ni
  # DSJ/DSJEQ/DSJNE consume their signed extension before testing the
  # original Z gate. DSJS uses the direction and five-bit opcode offset.
  - name: dsj
    start: 93
    seq:
      - imm_bus, pcinc
      - one_a, reg_b
      - sub_alu, dsj_misc, ni
  - name: dsjs
    start: 94
    seq:
      - one_a, reg_b
      - sub_alu, dsj_misc, ni
  - name: movx
    start: 95
    seq:
      - movx_a
      - pass_alu, wr_reg, ni
  - name: movy
    start: 96
    seq:
      - movy_a
      - pass_alu, wr_reg, ni
  # The shared adder's spacer isolates the two signed 16-bit coordinates.
  # CMPXY retains its data-sheet/summary three-state schedule in hardware.
  - name: addxy
    start: 97
    seq:
      - reg_a, reg_b
      - add_alu, x_misc, wr_reg, ni
  - name: subxy
    start: 98
    seq:
      - reg_a, reg_b
      - sub_alu, x_misc, wr_reg, ni
  - name: cmpxy
    start: 99
    seq:
      - reg_a, reg_b
      - sub_alu, x_misc, ni
  # Boundary interrupt and reserved-opcode entries do not retire an
  # architectural instruction. The datapath suppresses retire for these.
  - name: hwsave
    start: 100
    seq:
      - pc_md, push32_jsr
      - st_md, push32_jsr
      - hwvector_ea
      - read_stack
      - init_st, md_pc, ni
  - name: hwnosave
    start: 101
    seq:
      - hwvector_ea
      - read_stack
      - init_st, md_pc, ni
  - name: emu
    start: 102
    seq:
      - emu_misc, ni
  # Graphics instructions dispatch to the separate graphics microprogram.
  # Keep their scalar entry numbers stable for the opcode decoder.
  - name: cpw
    start: 103
    seq:
      # Source/WSTART are captured at decode; the read port then selects WEND.
      - sub_alu, x_misc, reg_b
      - sub_alu, x_misc, wr_reg, ni
  - name: cvxyl
    start: 104
    seq:
      # Shared DSP computes Y*pitch and X*pixel-size. B retains OFFSET.
      - init_mul, reg_b
      - step_mul
      - corrq_mul
      - step_mul
      - add_alu, wr_reg, ni
  - name: pixt_rxy
    start: 106
    seq: [gfx_mul]
  - name: pixt_xyreg
    start: 107
    seq: [gfx_mul]
  - name: pixt_xyxy
    start: 108
    seq: [gfx_mul]
  - name: drav
    start: 109
    seq: [gfx_mul]
  - name: pixt_rlin
    start: 110
    seq: [gfx_mul]
  - name: pixt_linreg
    start: 111
    seq:
      - read_mem, ext_a
      - pass_alu, wr_reg, ni
  - name: pixt_linlin
    start: 112
    seq: [gfx_mul]
  - name: array
    start: 117
    seq: [gfx_mul]
  - name: line
    start: 131
    seq: [gfx_mul]
  # The scalar sequencer holds here while the graphics ROM runs.
  - name: gfxrun
    start: 137
    seq: [gfx_mul]
  - name: fill_l
    start: 139
    seq: [gfx_mul]
  - name: blt_ll
    start: 140
    seq: [gfx_mul]
  - name: fill_xy
    start: 141
    seq: [gfx_mul]
  - name: blt_bl
    start: 142
    seq: [gfx_mul]
  - name: blt_lxy
    start: 143
    seq: [gfx_mul]
  - name: blt_xyl
    start: 144
    seq: [gfx_mul]
  - name: blt_xyxy
    start: 145
    seq: [gfx_mul]
  - name: blt_bxy
    start: 146
    seq: [gfx_mul]
