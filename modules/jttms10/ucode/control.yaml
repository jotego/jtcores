# PC' is the bit address after all instruction words have been fetched.
ucode:
  - name: jrl
    start: 50
    seq:
      - imm, pcinc
      - longrel_pc, ni
  - name: jacc
    start: 51
    seq:
      - imm, pcinc
      - immlo_a
      - imm, pcinc
      - immhi_a
      - abs_pc, ni
  - name: getpc
    start: 52
    seq:
      - pc_a
      - pass_alu, wr_reg, ni
  - name: exgpc
    start: 53
    seq:
      - pc_a
      - pass_alu, wr_reg, reg_pc, ni
  - name: rev
    start: 54
    seq:
      - rev_a
      - pass_alu, wr_reg, ni
  - name: pushst
    start: 55
    seq:
      - st_md, push32_jsr
      - ni
  - name: popst
    start: 56
    seq:
      - pop32_jsr
      - md_st, ni
  - name: callrs
    start: 57
    seq:
      - reg_a
      - a_tmp
      - pc_md, push32_jsr
      - tmp_pc, ni
  - name: calla
    start: 58
    seq:
      - imm, pcinc
      - immlo_a
      - imm, pcinc
      - immhi_a
      - a_tmp
      - pc_md, push32_jsr
      - tmp_pc, ni
  - name: callr
    start: 59
    seq:
      - imm, pcinc
      - immse_a
      - a_tmp
      - pc_md, push32_jsr
      - tmprel_pc, ni
  - name: rets
    start: 60
    seq:
      - sp_b
      - b_ea
      - read_stack
      - retadj_a
      - add_alu, wr_sp, md_pc, ni
  - name: reti
    start: 61
    seq:
      - pop32_jsr
      - md_tmp
      - pop32_jsr
      - tmp_st, md_pc, ni
  - name: trap
    start: 62
    seq:
      - pc_md, push32_jsr
      - st_md, push32_jsr
      - trap_ea
      - read_stack
      - init_st, md_pc, ni
  - name: trap0
    start: 63
    seq:
      - trap_ea
      - read_stack
      - init_st, md_pc, ni
  # A one-level generated JSR is sufficient: callers never invoke another
  # helper from within these routines. Both transfers force a 32-bit field.
  - name: push32
    start: 64
    seq:
      - word_a, sp_b
      - sub_alu, sum_ea, wr_sp
      - write_stack, ret_jsr
  - name: pop32
    start: 65
    seq:
      - sp_b
      - b_ea
      - read_stack
      - word_a
      - add_alu, wr_sp, ret_jsr
  # ABS sets N from 0-Rd, but writes |Rd| and preserves C (TI p.12-35).
  - name: abs
    start: 66
    seq:
      - rd_a
      - neg_alu, nzvabs_cc
      - abs_alu, wr_reg, ni
  - name: neg
    start: 67
    seq:
      - rd_a
      - neg_alu, wr_reg, nvzc_cc, ni
  - name: negb
    start: 68
    seq:
      - rd_a, zero_b
      - sbc_alu, wr_reg, nvzc_cc, ni
  - name: not
    start: 69
    seq:
      - rd_a
      - not_alu, wr_reg, z_cc, ni
  # ANDI/ANDNI share one opcode. Hardware always computes Rd & ~encoded IL;
  # the assembler complements the extension words for source-level ANDI.
  - name: andi
    start: 70
    seq:
      - imm, pcinc
      - immlo_a
      - imm, pcinc
      - immhi_a, reg_b
      - andn_alu, wr_reg, z_cc, ni
  - name: ori
    start: 71
    seq:
      - imm, pcinc
      - immlo_a
      - imm, pcinc
      - immhi_a, reg_b
      - or_alu, wr_reg, z_cc, ni
  - name: xori
    start: 72
    seq:
      - imm, pcinc
      - immlo_a
      - imm, pcinc
      - immhi_a, reg_b
      - xor_alu, wr_reg, z_cc, ni
  # Both encodings share the same iterative one-bit ALU helper. Right-shift
  # counts are encoded as their five-bit two's complement in both forms.
  - name: shiftk
    start: 73
    seq:
      - rd_a, shiftkinit
      - shiftloop_jsr
      - pass_alu, wr_reg, shift_finish, ni
  - name: shiftr
    start: 74
    seq:
      - rd_a, shiftrinit
      - shiftloop_jsr
      - pass_alu, wr_reg, shift_finish, ni
  - name: shiftloop
    start: 75
    seq:
      - shift_alu, shift_step, ret_jsr
  - name: setf
    start: 76
    seq:
      - setf, ni
  - name: sext
    start: 77
    seq:
      - rd_a
      - sext_a
      - pass_alu, wr_reg, nzfield_cc, ni
  - name: zext
    start: 78
    seq:
      - rd_a
      - zext_a
      - pass_alu, wr_reg, z_cc, ni
  - name: exgf
    start: 79
    seq:
      - exgf, wr_reg, ni
  # K is one's-complement encoded. The register form uses Rs[4:0].
  - name: btst
    start: 80
    seq:
      - rd_a, bsrc
      - btstfinish, ni
  - name: lmo
    start: 81
    seq:
      - reg_a, lmoinit
      - lmoloop_jsr
      - lmofinish, wr_reg, ni
  - name: lmoloop
    start: 82
    seq:
      - lmo_alu, lmoscan, ret_jsr
  # TI pp.12-109..112: both encodings consume the mask MSB first. MMTM's
  # bit15 names R0 and walks upward; MMFM's bit15 names R15 and walks down.
  - name: mmtm
    start: 83
    seq:
      - imm, pcinc
      - multiinit
      - mmtmloop_jsr
      - ni
  - name: mmfm
    start: 84
    seq:
      - imm, pcinc
      - multiinit
      - mmfmloop_jsr
      - ni
  - name: mmtmloop
    start: 85
    seq:
      - multiskip
      - word_a, reg_b
      - sub_alu, sum_ea, ptrwr
      - reg_a
      - a_md
      - write_stack
      - multiadvance, ret_jsr
  - name: mmfmloop
    start: 86
    seq:
      - multiskip
      - reg_b
      - b_ea
      - read_stack
      - listwr
      - word_a, reg_b
      - add_alu, ptrwr
      - multiadvance, ret_jsr
  - name: multinext
    start: 87
    seq:
      - multiadvance, ret_jsr
