# PC' is the bit address after all instruction words have been fetched.
ucode:
  - name: jrl
    start: 50
    seq:
      - imm_bus, pcinc
      - longrel_pc, ni
  - name: jacc
    start: 51
    seq:
      - imm_bus, pcinc
      - immlo_a
      - imm_bus, pcinc
      - immhi_a
      - abs_pc, ni
  - name: getpc
    start: 52
    seq:
      - pc_a
      - pass_alu, wr_reg, ni
  - name: exgpc
    start: 53
    seq:
      - pc_a
      - pass_alu, wr_reg, reg_pc, ni
  - name: rev
    start: 54
    seq:
      - rev_a
      - pass_alu, wr_reg, ni
  - name: pushst
    start: 55
    seq:
      - st_md, push32_jsr
      - ni
  - name: popst
    start: 56
    seq:
      - pop32_jsr
      - md_st, ni
  - name: callrs
    start: 57
    seq:
      - reg_a
      - a_tmp
      - pc_md, push32_jsr
      - tmp_pc, ni
  - name: calla
    start: 58
    seq:
      - imm_bus, pcinc
      - immlo_a
      - imm_bus, pcinc
      - immhi_a
      - a_tmp
      - pc_md, push32_jsr
      - tmp_pc, ni
  - name: callr
    start: 59
    seq:
      - imm_bus, pcinc
      - immse_a
      - a_tmp
      - pc_md, push32_jsr
      - tmprel_pc, ni
  - name: rets
    start: 60
    seq:
      - reg_b
      - b_ea
      - read_stack
      - retadj_a
      - add_alu, wr_sp, md_pc, ni
  - name: reti
    start: 61
    seq:
      - pop32_jsr
      - md_tmp
      - pop32_jsr
      - tmp_st, md_pc, ni
  - name: trap
    start: 62
    seq:
      - pc_md, push32_jsr
      - st_md, push32_jsr
      - trap_ea
      - read_stack
      - init_st, md_pc, ni
  - name: trap0
    start: 63
    seq:
      - trap_ea
      - read_stack
      - init_st, md_pc, ni
  # A one-level generated JSR is sufficient: callers never invoke another
  # helper from within these routines. Both transfers force a 32-bit field.
  - name: push32
    start: 64
    seq:
      # MSW first: two predecremented 16-bit writes, so the final 32-bit
      # stack value remains little-endian at SP. MD retains the whole value.
      - half_a, reg_b
      - sub_alu, sum_ea, wr_sp
      - write_stack
      - half_a, reg_b
      - sub_alu, sum_ea, wr_sp
      - write_stack, ret_jsr
  - name: pop32
    start: 65
    seq:
      - reg_b
      - b_ea
      - read_stack
      - word_a
      - add_alu, wr_sp, ret_jsr
  # ABS sets N from 0-Rd, but writes |Rd| and preserves C (TI p.12-35).
  - name: abs
    start: 66
    seq:
      - rd_a
      - neg_alu, nzvabs_cc
      - abs_alu, wr_reg, ni
  - name: neg
    start: 67
    seq:
      - rd_a
      - neg_alu, wr_reg, nvzc_cc, ni
  - name: negb
    start: 68
    seq:
      - rd_a, zero_b
      - sbc_alu, wr_reg, nvzc_cc, ni
  - name: not
    start: 69
    seq:
      - rd_a
      - not_alu, wr_reg, z_cc, ni
  # ANDI/ANDNI share one opcode. Hardware always computes Rd & ~encoded IL;
  # the assembler complements the extension words for source-level ANDI.
  - name: andi
    start: 70
    seq:
      - imm_bus, pcinc
      - immlo_a
      - imm_bus, pcinc
      - immhi_a, reg_b
      - andn_alu, wr_reg, z_cc, ni
  - name: ori
    start: 71
    seq:
      - imm_bus, pcinc
      - immlo_a
      - imm_bus, pcinc
      - immhi_a, reg_b
      - or_alu, wr_reg, z_cc, ni
  - name: xori
    start: 72
    seq:
      - imm_bus, pcinc
      - immlo_a
      - imm_bus, pcinc
      - immhi_a, reg_b
      - xor_alu, wr_reg, z_cc, ni
  # Both encodings share the same iterative one-bit ALU helper. Right-shift
  # counts are encoded as their five-bit two's complement in both forms.
  - name: shiftk
    start: 73
    seq:
      - rd_a, kinit_shift
      - shiftloop_jsr
      - pass_alu, wr_reg, finish_shift, ni
  - name: shiftr
    start: 74
    seq:
      - rd_a, rinit_shift
      - shiftloop_jsr
      - pass_alu, wr_reg, finish_shift, ni
  - name: shiftloop
    start: 75
    seq:
      - shift_alu, step_shift, ret_jsr
  - name: setf
    start: 76
    seq:
      - setf_misc, ni
  - name: sext
    start: 77
    seq:
      - rd_a
      - sext_a
      - pass_alu, wr_reg, nzfield_cc, ni
  - name: zext
    start: 78
    seq:
      - rd_a
      - zext_a
      - pass_alu, wr_reg, z_cc, ni
  - name: exgf
    start: 79
    seq:
      - exgf_misc, wr_reg, ni
  # K is one's-complement encoded. The register form uses Rs[4:0].
  - name: btst
    start: 80
    seq:
      - rd_a, bsrc
      - btstfinish_misc, ni
  - name: lmo
    start: 81
    seq:
      - reg_a, init_lmo
      - lmoloop_jsr
      - finish_lmo, wr_reg, ni
  - name: lmoloop
    start: 82
    seq:
      - lmo_alu, scan_lmo, ret_jsr
  # TI pp.12-109..112: both encodings consume the mask MSB first. MMTM's
  # bit15 names R0 and walks upward; MMFM's bit15 names R15 and walks down.
  - name: mmtm
    start: 83
    seq:
      - imm_bus, pcinc
      - init_multi
      - mmtmloop_jsr
      - ni
  - name: mmfm
    start: 84
    seq:
      - imm_bus, pcinc
      - init_multi
      - mmfmloop_jsr
      - ni
  - name: mmtmloop
    start: 85
    seq:
      - skip_multi
      - word_a, reg_b
      - sub_alu, sum_ea, ptrwr
      - reg_a
      - a_md
      - write_stack
      - advance_multi, ret_jsr
  - name: mmfmloop
    start: 86
    seq:
      - skip_multi
      - reg_b
      - b_ea
      - read_stack
      - listwr
      - word_a, reg_b
      - add_alu, ptrwr
      - advance_multi, ret_jsr
  - name: multinext
    start: 87
    seq:
      - advance_multi, ret_jsr
  # The 32 right-shift/add steps use the ordinary 32-bit ALU carry. MPYS
  # corrects the high word for signed operands after the unsigned loop.
  - name: mpy
    start: 88
    seq:
      - init_mul
      - mulloop_jsr
      - sub_alu, corrq_mul
      - sub_alu, corrm_mul
      - finish_mul
      - wrhi_mul
      - wrlo_mul, ni
  - name: mulloop
    start: 89
    seq:
      - add_alu, step_mul, ret_jsr
  # DIV and MOD share a restoring unsigned loop. Signed forms normalize
  # operands first, then correct quotient and remainder after flag evaluation.
  - name: div
    start: 90
    seq:
      - initdiv_mul
      - loaddiv_mul
      - neg_alu, negdiv_mul
      - neg_alu, negmd_mul
      - sbc_alu, negb_mul
      - sub_alu, checkdiv_mul
      - divloop_jsr
      - finish_mul
      - neg_alu, negmd_mul
      - neg_alu, negb_mul
      - wrhi_mul
      - wrlo_mul, ni
  - name: divloop
    start: 91
    seq:
      - sub_alu, stepdiv_mul, ret_jsr
  - name: divfail
    start: 92
    seq:
      - finish_mul, ni
  # DSJ/DSJEQ/DSJNE consume their signed extension before testing the
  # original Z gate. DSJS uses the direction and five-bit opcode offset.
  - name: dsj
    start: 93
    seq:
      - imm_bus, pcinc
      - one_a, reg_b
      - sub_alu, dsj_misc, ni
  - name: dsjs
    start: 94
    seq:
      - one_a, reg_b
      - sub_alu, dsj_misc, ni
  - name: movx
    start: 95
    seq:
      - movx_a
      - pass_alu, wr_reg, ni
  - name: movy
    start: 96
    seq:
      - movy_a
      - pass_alu, wr_reg, ni
  # Source/destination full words stay in A/B. Each half is sliced onto the
  # shared ALU in its own step, so X carry cannot enter Y.
  - name: addxy
    start: 97
    seq:
      - reg_a, reg_b
      - add_alu, x_misc
      - add_alu, y_misc
      - wr_reg, ni
  - name: subxy
    start: 98
    seq:
      - reg_a, reg_b
      - sub_alu, x_misc
      - sub_alu, y_misc
      - wr_reg, ni
  - name: cmpxy
    start: 99
    seq:
      - reg_a, reg_b
      - sub_alu, x_misc
      - sub_alu, y_misc, ni
  # Boundary interrupt and reserved-opcode entries do not retire an
  # architectural instruction. The datapath suppresses retire for these.
  - name: hwsave
    start: 100
    seq:
      - pc_md, push32_jsr
      - st_md, push32_jsr
      - hwvector_ea
      - read_stack
      - init_st, md_pc, ni
  - name: hwnosave
    start: 101
    seq:
      - hwvector_ea
      - read_stack
      - init_st, md_pc, ni
  - name: emu
    start: 102
    seq:
      - emu_misc, ni
  # Graphics instructions dispatch to the separate graphics microprogram.
  # Keep their scalar entry numbers stable for the opcode decoder.
  - name: cpw
    start: 103
    seq: [gfx_mul]
  - name: cvxyl
    start: 104
    seq: [gfx_mul]
  - name: pixt_rxy
    start: 106
    seq: [gfx_mul]
  - name: pixt_xyreg
    start: 107
    seq: [gfx_mul]
  - name: pixt_xyxy
    start: 108
    seq: [gfx_mul]
  - name: drav
    start: 109
    seq: [gfx_mul]
  - name: pixt_rlin
    start: 110
    seq: [gfx_mul]
  - name: pixt_linreg
    start: 111
    seq: [gfx_mul]
  - name: pixt_linlin
    start: 112
    seq: [gfx_mul]
  - name: array
    start: 117
    seq: [gfx_mul]
  - name: line
    start: 131
    seq: [gfx_mul]
  # The scalar sequencer holds here while the graphics ROM runs.
  - name: gfxrun
    start: 137
    seq: [gfx_mul]
  - name: fill_l
    start: 139
    seq: [gfx_mul]
  - name: blt_ll
    start: 140
    seq: [gfx_mul]
  - name: fill_xy
    start: 141
    seq: [gfx_mul]
  - name: blt_bl
    start: 142
    seq: [gfx_mul]
  - name: blt_lxy
    start: 143
    seq: [gfx_mul]
  - name: blt_xyl
    start: 144
    seq: [gfx_mul]
  - name: blt_xyxy
    start: 145
    seq: [gfx_mul]
  - name: blt_bxy
    start: 146
    seq: [gfx_mul]
