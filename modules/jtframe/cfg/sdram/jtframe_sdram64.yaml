jtframe:
  # a core may supply its own jtframe_romrq_lcache (same module name) by
  # defining JTFRAME_CORE_LCACHE and shipping the file in its hdl folder
  - from: sdram
    unless: [ JTFRAME_CORE_LCACHE ]
    get:
      - jtframe_romrq_lcache.v
  # a core may supply its own controller trio (same module names) by
  # defining JTFRAME_CORE_SDRAM64 and shipping the files in its hdl folder
  - from: sdram
    unless: [ JTFRAME_CORE_SDRAM64 ]
    get:
      - jtframe_sdram64.v
      - jtframe_sdram64_bank.v
      - jtframe_sdram64_init.v
  - from: sdram
    get:
      - jtframe_sdram64_rfsh.v
      - jtframe_sdram64_latch.v
      - jtframe_ramslot_ctrl.v
      - jtframe_ram1_1slot.v
      - jtframe_ram1_2slots.v
      - jtframe_ram1_3slots.v
      - jtframe_ram1_4slots.v
      - jtframe_ram1_5slots.v
      - jtframe_ram2_4slots.v
      - jtframe_ram2_5slots.v
      - jtframe_ram2_6slots.v
      - jtframe_rom_1slot.v
      - jtframe_rom_2slots.v
      - jtframe_rom_3slots.v
      - jtframe_rom_4slots.v
      - jtframe_rom_5slots.v
      - jtframe_rom_6slots.v
      - jtframe_rom_7slots.v
      - jtframe_romrq.v
      - jtframe_romrq_bcache.v
      - jtframe_romrq_xscache.v
      - jtframe_ucache.v
      - jtframe_rom.v
      - jtframe_ram_rq.v
      - jtframe_rom_sync.v
