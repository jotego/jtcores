ucode:
  - name: ivrd # interrupt service and reset vector read and jump
    start: 0
    cycles: 4
    seq:
      - invalid, iv_rmux, ld0_opnd, i1_cc
      - invalid, one_rmux, ld1_opnd, ea_ld
      - invalid
      - invalid
      - m_ea
      - m_ea
      - m_ea, fetch
      - m_ea, ea_rmux, ld0_opnd
      - add_alu, ea_ld
      - m_ea
      - m_ea, fetch, md_shift
      - ld0_opnd
      -                         pc_ld
      - i1_cc
      - fetch
      - ni
  - name: isrv
    start: 0xc7 # referenced in  jt680x_ctrl manually!
    cycles: 12
    seq:
      - invalid
      - invalid
      - invalid
      - invalid, pc_rmux, ld0_opnd, frame_jsr
  - name: frame
    start: 0x12
    seq:
      - s_ea, wr, md_ld, s_rmux, ld0_opnd
      - s_ea, wr, one_rmux, ld1_opnd
      - s_ea, wr
      - s_ea, wr, sub_alu, s_ld
      - s_ea, wr, md_shift, s_rmux, ld0_opnd
      - s_ea, wr, md_shift
      - s_ea, wr, md_shift, sub_alu, s_ld
      - s_ea, wr, md_shift, x_rmux, ld0_opnd
      - s_ea, wr, md_ld, s_rmux, ld0_opnd
      - s_ea, wr, one_rmux, ld1_opnd
      - s_ea, wr
      - s_ea, wr, sub_alu, s_ld
      - s_ea, wr, md_shift, s_rmux, ld0_opnd
      - s_ea, wr, md_shift
      - s_ea, wr, md_shift, sub_alu, s_ld
      - s_ea, wr, md_shift, a_rmux, ld0_opnd
      - s_ea, wr, md_ld, s_rmux, ld0_opnd
      - s_ea, wr, one_rmux, ld1_opnd
      - s_ea, wr, sub_alu, s_ld
      - s_ea, wr, b_rmux, ld0_opnd
      - s_ea, wr, md_ld, s_rmux, ld0_opnd
      - s_ea, wr, one_rmux, ld1_opnd
      - s_ea, wr, sub_alu, s_ld
      - s_ea, wr, cc_rmux, ld0_opnd
      - s_ea, wr, md_ld, s_rmux, ld0_opnd
      - s_ea, wr, one_rmux, ld1_opnd
      - s_ea, wr, sub_alu, s_ld
      - s_ea, wr, ivrd_jsr
  - name: waiframe
    start: 0x18
    seq:
      - s_ea, wr, md_ld, s_rmux, ld0_opnd
      - s_ea, wr, one_rmux, ld1_opnd
      - s_ea, wr
      - s_ea, wr, sub_alu, s_ld
      - s_ea, wr, md_shift, s_rmux, ld0_opnd
      - s_ea, wr, md_shift
      - s_ea, wr, md_shift, sub_alu, s_ld
      - s_ea, wr, md_shift, x_rmux, ld0_opnd
      - s_ea, wr, md_ld, s_rmux, ld0_opnd
      - s_ea, wr, one_rmux, ld1_opnd
      - s_ea, wr
      - s_ea, wr, sub_alu, s_ld
      - s_ea, wr, md_shift, s_rmux, ld0_opnd
      - s_ea, wr, md_shift
      - s_ea, wr, md_shift, sub_alu, s_ld
      - s_ea, wr, md_shift, a_rmux, ld0_opnd
      - s_ea, wr, md_ld, s_rmux, ld0_opnd
      - s_ea, wr, one_rmux, ld1_opnd
      - s_ea, wr, sub_alu, s_ld
      - s_ea, wr, b_rmux, ld0_opnd
      - s_ea, wr, md_ld, s_rmux, ld0_opnd
      - s_ea, wr, one_rmux, ld1_opnd
      - s_ea, wr, sub_alu, s_ld
      - s_ea, wr, cc_rmux, ld0_opnd
      - s_ea, wr, md_ld, s_rmux, ld0_opnd
      - s_ea, wr, one_rmux, ld1_opnd
      - s_ea, wr, sub_alu, s_ld
      - s_ea, wr, alt, halt
  - name: imm # 1+3 ucode cycles = 1 bus cycle
    start: 0x8F
    seq:
      -
      - fetch
      - inc_pc, ret_jsr
  - name: imm16 # 1+7 ucode cycles = 2 bus cycles
    start: 0xCF
    seq:
      -
      - fetch
      - inc_pc
      -
      -
      - fetch, md_shift
      - inc_pc, ret_jsr
  - name: dira
    start: 0x45
    seq:
      -
      - fetch
      - inc_pc, ld0_opnd, ret_jsr
  - name: dir # 1+7 ucode cycles = 2 bus cycles
    start: 0x14
    seq:
      -
      - fetch
      - inc_pc, ld0_opnd
      - ea_ld
      - m_ea
      - m_ea, fetch
      - ret_jsr
  - name: dir16 # 1+7 ucode cycles = 2 bus cycles
    start: 0x15
    seq:
      -
      - fetch
      - inc_pc, ld0_opnd
      - ea_ld
      - m_ea, one_rmux, ld1_opnd
      - m_ea, fetch, ea_rmux, ld0_opnd
      - m_ea, add_alu, ea_ld
      - m_ea
      - m_ea
      - m_ea, fetch, md_shift
      - ret_jsr
  - name: exta
    start: 0x55
    seq:
      -
      - fetch
      - inc_pc
      -
      -
      - fetch, md_shift
      - inc_pc, ld0_opnd, ret_jsr
  - name: ext # 1+11 ucode cycles = 3 bus cycles
    start: 0x1c
    seq:
      -
      - fetch
      - inc_pc
      -
      -
      - fetch, md_shift
      - inc_pc, ld0_opnd
      - ea_ld
      - m_ea
      - m_ea, fetch
      - ret_jsr
  - name: ext16 # 1+15 ucode cycles = 4 bus cycles
    start: 0x1d
    seq:
      -
      - fetch
      - inc_pc
      -
      -
      - fetch, md_shift
      - inc_pc, ld0_opnd
      - ea_ld
      - m_ea, one_rmux, ld1_opnd
      - m_ea, fetch, ea_rmux, ld0_opnd
      - m_ea, add_alu, ea_ld
      - m_ea
      - m_ea
      - m_ea, fetch, md_shift
      - ret_jsr
  - name: idxa
    start: 0x4b
    seq:
      -
      - fetch
      - inc_pc, ld0_opnd
      - x_rmux, ld1_opnd
      - x_ea, invalid, add_alu, ea_ld
      - x_ea, invalid
      - x_ea, invalid
      - p_ea, invalid
      - p_ea, invalid
      - p_ea, invalid
      - p_ea, invalid, ea_rmux, ld0_opnd, ret_jsr
  - name: idx # 1+11 ucode cycles = 3 bus cycles
    start: 0x1e
    seq:
      -
      - fetch
      - inc_pc, ld0_opnd
      - x_rmux, ld1_opnd
      - x_ea, invalid, add_alu, ea_ld
      - x_ea, invalid
      - x_ea, invalid
      - p_ea, invalid
      - p_ea, invalid
      - p_ea, invalid
      - p_ea, invalid
      - m_ea
      - m_ea
      - m_ea, fetch
      - ret_jsr
  - name: idx16 # 1+11 ucode cycles = 3 bus cycles
    start: 0x1f
    seq:
      -
      - fetch
      - inc_pc, ld0_opnd
      - x_rmux, ld1_opnd
      - x_ea, invalid, add_alu, ea_ld
      - x_ea, invalid
      - x_ea, invalid
      - p_ea, invalid
      - p_ea, invalid
      - p_ea, invalid
      - p_ea, invalid
      - m_ea
      - m_ea, one_rmux, ld1_opnd
      - m_ea, fetch, ea_rmux, ld0_opnd
      - m_ea, add_alu, ea_ld
      - m_ea
      - m_ea
      - m_ea, fetch, md_shift
      - ret_jsr
  - name: psh8 # one bus write, entered at E-high phase 1
    start: 0x4e
    seq:
      - s_ea, wr, s_rmux, ld0_opnd
      - s_ea, wr, one_rmux, ld1_opnd
      - s_ea, wr, sub_alu, s_ld, ret_jsr
  - name: psh16
    start: 2
    seq:
      - s_ea, wr, s_rmux, ld0_opnd
      - s_ea, wr, one_rmux, ld1_opnd
      - s_ea, wr, sub_alu, s_ld
      - s_ea, wr, md_shift, s_rmux, ld0_opnd
      - s_ea, wr, md_shift
      - s_ea, wr, md_shift
      - s_ea, wr, md_shift, sub_alu, s_ld, ret_jsr
  - name: pul8 # 1+11 ucode cycles = 3 bus cycles
    start: 3
    seq:
      - s_ea, invalid, one_rmux, ld1_opnd
      - s_ea, invalid
      - s_ea, invalid, add_alu, s_ld
      - s_ea
      - s_ea
      - s_ea, fetch
      - ld0_opnd, ret_jsr
  - name: pul16 # 1+15 ucode cycles = 4 bus cycles
    start: 0x41
    seq:
      - s_ea, invalid, one_rmux, ld1_opnd
      - s_ea, invalid
      - s_ea, invalid, add_alu, s_ld
      - s_ea, s_rmux, ld0_opnd
      - s_ea
      - s_ea, fetch
      - s_ea, add_alu, s_ld
      - s_ea
      - s_ea
      - s_ea, fetch, md_shift
      - ld0_opnd, ret_jsr
  - name: rti8
    start: 0x51
    seq:
      - s_ea, invalid, one_rmux, ld1_opnd
      - s_ea, invalid
      - s_ea, invalid, add_alu, s_ld
      - s_ea, s_rmux, ld0_opnd
      - s_ea
      - s_ea, fetch, add_alu, s_ld
      - ld0_opnd
      - s_ea, cc_ld, s_rmux, ld0_opnd
      - s_ea
      - s_ea, fetch, add_alu, s_ld
      - ld0_opnd
      - s_ea, b_ld, s_rmux, ld0_opnd
      - s_ea
      - s_ea, fetch, add_alu, s_ld
      - ld0_opnd, ret_jsr
  - name: rti16
    start: 0x52
    seq:
      - s_ea
      - s_ea, fetch, add_alu, s_ld
      - s_rmux, ld0_opnd
      - s_ea
      - s_ea
      - s_ea, fetch, md_shift, add_alu, s_ld
      - ld0_opnd
      - s_ea, x_ld, s_rmux, ld0_opnd
      - s_ea
      - s_ea, fetch, add_alu, s_ld
      - s_rmux, ld0_opnd
      - s_ea
      - s_ea
      - s_ea, fetch, md_shift
      - ld0_opnd, ret_jsr
  ######### mnemonics
  - mnemo: [ JMP ]
    seq:
      - ${addr}_jsr, inc_pc
      - pc_ld
      -
      - fetch
      - ni
  # read operand and write result to memory, typ 6 cycles (idx/ext=~3)
  - mnemo: [ ASR, CLR, COM, DEC, INC, LSL, LSR, NEG, ROL, ROR, TST ]
    seq:
      - ${addr}_jsr inc_pc # 3 bus cycles gone
      - m_ea, invalid, ${op0}_rmux, op0inv=${op0inv}, ld0_opnd
      - m_ea, invalid, ${op1}_rmux, ld1_opnd
      - m_ea, invalid, ${alu}_alu, ${carry}_carry, ${cc}_cc, md_ld
      - m_ea, invalid
      - m_ea, ${wr}, ${wr}?_:invalid
      - m_ea, ${wr}, ${wr}?_:invalid
      - m_ea, ${wr}, ${wr}?_:invalid
      - m_ea, ${wr}, ${wr}?_:invalid
      -
      -
      - fetch
      - ni
  - mnemo: [ # 3 cycles
      BRA, BHI, BLS, BCC, BCS, BNE, BEQ,
      BVC, BVS, BPL, BMI, BGE, BLT, BGT, BLE ]
    seq:
      - inc_pc, brlatch
      -
      - fetch
      - inc_pc
      - invalid, pc_rmux, ld1_opnd, branch
      - invalid, ld0_opnd
      - invalid, add_alu, branch, pc_ld
      - invalid
      - invalid
      - invalid
      - invalid
      - invalid
      -
      -
      - fetch
      - ni
  - mnemo: [ BSR ]
    seq:
      - inc_pc, brlatch
      -
      - fetch
      - inc_pc
      - invalid, branch, pc_rmux, ld1_opnd
      - invalid, ld0_opnd
      - invalid, add_alu, ea_ld
      - invalid, pc_rmux, ld0_opnd
      - md_ld, s_ea, wr
      - s_ea, wr, s_rmux, ld0_opnd
      - s_ea, wr, one_rmux, ld1_opnd
      - s_ea, wr, sub_alu, s_ld
      - s_ea, wr, md_shift, s_rmux, ld0_opnd
      - s_ea, wr, md_shift
      - s_ea, wr, md_shift
      - s_ea, wr, md_shift, sub_alu, s_ld
      - invalid
      - invalid
      - invalid
      - invalid
      - invalid
      - invalid
      - invalid
      - invalid
      - invalid
      - invalid
      - invalid, ea_rmux, ld0_opnd
      - invalid, pc_ld
      -
      -
      - fetch
      - ni
