- name: "054156"
  no_core_name: true
  size: 64
  dw: 16
  regs:
    - { name: reg0_db,  desc: "global/timing control; bit 4 H flip, bit 5 V flip", dw: 8,  at: "0x00" }
    - { name: reg2_db,  desc: "per-layer H/V flip-enable bitmap",                 dw: 8,  at: "0x02" }
    - { name: reg4_db,  desc: "tile attribute/LUT/color and address-latch mode",   dw: 8,  at: "0x04" }
    - { name: reg6_db,  desc: "IRQ/FIRQ/NMI enable and attribute/data steering",   dw: 8,  at: "0x06" }
    - { name: reg8_db,  desc: "CA/VA address-source mode and vertical sync-scroll", dw: 8, at: "0x08" }
    - { name: rega_db,  desc: "two-bit-per-layer linescroll control",              dw: 8,  at: "0x0a" }
    - { name: regc_db,  desc: "VRAM DB/strobe/address timing control",             dw: 6,  at: "0x0c[5:0]" }

    - { name: reg10_d,  desc: "layer A vertical grid/height",                      dw: 6,  at: "0x10[5:0]" }
    - { name: reg12_d,  desc: "layer B vertical grid/height",                      dw: 6,  at: "0x12[5:0]" }
    - { name: reg14_d,  desc: "layer C vertical grid/height",                      dw: 6,  at: "0x14[5:0]" }
    - { name: reg16_d,  desc: "layer D vertical grid/height",                      dw: 6,  at: "0x16[5:0]" }
    - { name: reg18_d,  desc: "layer A horizontal grid/width",                     dw: 6,  at: "0x18[5:0]" }
    - { name: reg1a_d,  desc: "layer B horizontal grid/width",                     dw: 6,  at: "0x1a[5:0]" }
    - { name: reg1c_d,  desc: "layer C horizontal grid/width",                     dw: 6,  at: "0x1c[5:0]" }
    - { name: reg1e_d,  desc: "layer D horizontal grid/width",                     dw: 6,  at: "0x1e[5:0]" }

    - { name: reg20_d,  desc: "layer A Y scroll",                                  dw: 11, at: "0x21[2:0],0x20" }
    - { name: reg22_d,  desc: "layer B Y scroll",                                  dw: 11, at: "0x23[2:0],0x22" }
    - { name: reg24_d,  desc: "layer C Y scroll",                                  dw: 11, at: "0x25[2:0],0x24" }
    - { name: reg26_d,  desc: "layer D Y scroll",                                  dw: 11, at: "0x27[2:0],0x26" }
    - { name: reg28_d,  desc: "layer A X scroll",                                  dw: 12, at: "0x29[3:0],0x28" }
    - { name: reg2a_d,  desc: "layer B X scroll",                                  dw: 12, at: "0x2b[3:0],0x2a" }
    - { name: reg2c_d,  desc: "layer C X scroll",                                  dw: 12, at: "0x2d[3:0],0x2c" }
    - { name: reg2e_d,  desc: "layer D X scroll",                                  dw: 12, at: "0x2f[3:0],0x2e" }

    - { name: reg30_d,  desc: "line-scroll/active-page RAM bank",                  dw: 6,  at: "0x30[5:0]" }
    - { name: reg32_d,  desc: "CPU-visible VRAM bank",                             dw: 6,  at: "0x32[5:0]" }
    - { name: reg34l_d, desc: "ROM/checksum bank low byte; bit 0 feeds CA11",      dw: 8,  at: "0x34" }
    - { name: reg34u_d, desc: "ROM/checksum COL output byte",                      dw: 8,  at: "0x35" }
    - { name: reg36_d,  desc: "secondary ROM/checksum VRC bits",                   dw: 2,  at: "0x36[1:0]" }
    - { name: reg38_d,  desc: "tile-bank lookup table",                            dw: 16, at: "0x39,0x38" }
    - { name: reg3a_d,  desc: "HFLIP horizontal correction",                       dw: 12, at: "0x3b[3:0],0x3a" }
    - { name: reg3c_d,  desc: "VFLIP vertical correction",                         dw: 11, at: "0x3d[2:0],0x3c" }

- name: "054157"
  no_core_name: true
  size: 8
  dw: 16
  regs:
    - { name: reg0_d0, desc: "global H offset phase/polarity control",             dw: 1, at: "0x00[0]" }
    - { name: reg0_d3, desc: "page-1 clock fanout reset/enable",                   dw: 1, at: "0x00[3]" }
    - { name: reg0_d4, desc: "page-9 RAM/readout clock phase select",              dw: 1, at: "0x00[4]" }

    - { name: reg2_d0, desc: "HOFSA flip enable",                                  dw: 1, at: "0x02[0]" }
    - { name: reg2_d2, desc: "HOFSB flip enable",                                  dw: 1, at: "0x02[2]" }
    - { name: reg2_d4, desc: "HOFSC flip enable",                                  dw: 1, at: "0x02[4]" }
    - { name: reg2_d6, desc: "HOFSD flip enable",                                  dw: 1, at: "0x02[6]" }

    - { name: reg4_d3, desc: "RAM/readout/output mux mode",                        dw: 1, at: "0x04[3]" }
    - { name: reg4_d4, desc: "RAM/readout/output mux mode",                        dw: 1, at: "0x04[4]" }
    - { name: reg4_d5, desc: "readout/VC direction qualifier",                     dw: 1, at: "0x04[5]" }
    - { name: reg4_d6, desc: "CROM/RAM-mode page-9 decode control",                dw: 1, at: "0x04[6]" }

    - { name: reg6_d5, desc: "DB half/byte-lane selector",                         dw: 1, at: "0x06[5]" }
    - { name: reg6_d6, desc: "color/attribute column source select",               dw: 1, at: "0x06[6]" }
    - { name: reg6_d7, desc: "color/attribute column source select",               dw: 1, at: "0x06[7]" }
