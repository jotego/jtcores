absolute_jumps_and_calls:
  test:
    - { asm: "AJMP target",     check: "PC=$0004" }
    - { asm: "NOP",             check: "" }
    - { asm: "target: NOP",     check: "" }

# as31 uses the first page encoding for mnemonic assembly.  Exercise the
# affected raw encodings so every AJMP/ACALL page selector stays decoded as
# its architectural instruction rather than its similarly shaped counterpart.
ajmp_page_21:
  code:
    - { from: 0x0100, data: "00" }
  test:
    - { asm: ".DB 21H,00H", check: "SP=$07, PC=$0101" }

ajmp_page_41:
  code:
    - { from: 0x0200, data: "00" }
  test:
    - { asm: ".DB 41H,00H", check: "SP=$07, PC=$0201" }

ajmp_page_61:
  code:
    - { from: 0x0300, data: "00" }
  test:
    - { asm: ".DB 61H,00H", check: "SP=$07, PC=$0301" }

ajmp_page_81:
  code:
