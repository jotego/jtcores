    - { asm: "MOV A,#00H",   check: "A=$00" }
    - { asm: "MOVX A,@R1",   cycles: 2, check: "A=$A5" }

branch_not_taken:
  test:
    - { asm: "MOV A,#01H",      check: "A=$01" }
    - { asm: "JZ target",       cycles: 2, check: "PC=$0005" }
    - { asm: "target: NOP",     check: "" }
    - { asm: "CLR C",           check: "C=0" }
    - { asm: "JC target2",      cycles: 2, check: "PC=$0009" }
    - { asm: "target2: NOP",    check: "" }
    - { asm: "SETB C",          check: "C=1" }
    - { asm: "JNC target3",     cycles: 2, check: "PC=$000D" }
    - { asm: "target3: NOP",    check: "" }
    - { asm: "MOV A,#00H",      check: "A=$00" }
    - { asm: "JNZ target4",     cycles: 2, check: "PC=$0012" }
    - { asm: "target4: NOP",    check: "" }
    - { asm: "MOV 20H,#00H",    check: "IRAM[$20]=$00" }
    - { asm: "JB 00H,target5",  cycles: 2, check: "PC=$0019" }
    - { asm: "target5: NOP",    check: "" }
    - { asm: "SETB 00H",        check: "IRAM[$20]=$01" }
    - { asm: "JNB 00H,target6", cycles: 2, check: "PC=$001F" }
    - { asm: "target6: NOP",    check: "" }

cjne_addressing_forms:
  test:
    - { asm: "MOV R0,#20H",       check: "R0=$20" }
    - { asm: "MOV @R0,#10H",      check: "IRAM[$20]=$10" }
    - { asm: "CJNE @R0,#10H,next", cycles: 2, check: "C=0, PC=$0008" }
    - { asm: "next: MOV R7,#20H", check: "R7=$20" }
    - { asm: "CJNE R7,#20H,done", cycles: 2, check: "C=0, PC=$000D" }
    - { asm: "done: NOP",          check: "" }

carry_complement:
  test:
    - { asm: "CLR C",    check: "C=0" }
    - { asm: "CPL C",    cycles: 1, check: "C=1" }
    - { asm: "CPL C",    cycles: 1, check: "C=0" }

xchd:
