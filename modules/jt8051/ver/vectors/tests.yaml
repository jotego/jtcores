# 8051 instruction vectors.  Keep the instruction and its expected architectural
# state together, as in modules/jt680x/ver/65c02/tests.yaml.  The future vector
# generator assembles each `asm` line with as31 -Fbin and samples `check` on
# jt8051_ctrl.next_instruction.

register_indirect_direct:
  test:
    - { asm: "MOV R0,#20H",  check: "R0=$20" }
    - { asm: "MOV @R0,#0AAH", check: "IRAM[$20]=$AA" }
    - { asm: "MOV A,@R0",    check: "A=$AA" }
    - { asm: "ADD A,#01H",   check: "A=$AB, C=0, AC=0, OV=0" }
    - { asm: "MOV 30H,A",    check: "IRAM[$30]=$AB" }
    - { asm: "MOV A,30H",    check: "A=$AB" }
    - { asm: "MOV P1,A",     check: "P1=$AB" }

stack_and_subroutine:
  code:
    - { from: 0x0080, data: "22" }
  test:
    - { asm: "MOV A,#12H",   check: "A=$12" }
    - { asm: "PUSH ACC",     check: "SP=$08, IRAM[$08]=$12" }
    - { asm: "MOV A,#00H",   check: "A=$00" }
    - { asm: "POP ACC",      check: "A=$12, SP=$07" }
    - { asm: "MOV P2,A",     check: "P2=$12" }
    - { asm: "LCALL 0080H",  check: "SP=$09, PC=$0081" }
    - { asm: "RET",           check: "SP=$07, PC=$000E" }

code_and_external_memory:
  code:
    - { from: 0x0100, data: "00 00 5A" }
  test:
    - { asm: "MOV DPTR,#0100H", check: "DPTR=$0100" }
    - { asm: "MOV A,#02H",      check: "A=$02" }
    - { asm: "MOVC A,@A+DPTR",  check: "A=$5A" }
    - { asm: "MOV P0,A",        check: "P0=$5A" }
    - { asm: "MOV DPTR,#1234H", check: "DPTR=$1234" }
    - { asm: "MOV A,#66H",      check: "A=$66" }
    - { asm: "MOVX @DPTR,A",    check: "XRAM[$1234]=$66" }
    - { asm: "MOV A,#00H",      check: "A=$00" }
    - { asm: "MOVX A,@DPTR",    check: "A=$66" }
    - { asm: "MOV P3,A",        check: "P3=$66" }

movc_pc:
  code:
    - { from: 0x0005, data: "5A" }
  test:
    - { asm: "MOV A,#02H",   check: "A=$02" }
    - { asm: "MOVC A,@A+PC", check: "A=$5A" }

movx_ri:
  test:
    - { asm: "MOV P2,#12H",  check: "P2=$12" }
    - { asm: "MOV R0,#34H",  check: "R0=$34" }
    - { asm: "MOV A,#56H",   check: "A=$56" }
    - { asm: "MOVX @R0,A",   check: "XRAM[$1234]=$56" }
    - { asm: "MOV A,#00H",   check: "A=$00" }
    - { asm: "MOVX A,@R0",   check: "A=$56" }

port_latch_rmw:
  test:
    - { asm: "MOV P1,#00H", check: "P1=$00" }
    - { asm: "MOV A,P1",    check: "A=$00" }
    - { asm: "INC P1",      check: "P1=$01" }
    - { asm: "MOV A,P1",    check: "A=$01" }
    - { asm: "MOV P1,#00H", check: "P1=$00" }
    - { asm: "SETB 90H",    check: "P1=$01" }

djnz_port_latch:
  test:
    - { asm: "MOV P1,#00H",   check: "P1=$00" }
    - { asm: "DJNZ P1,target", check: "P1=$FF, PC=$0008" }
    - { asm: "NOP",             check: "" }
    - { asm: "target: NOP",     check: "" }

register_moves_and_bcd:
  test:
    - { asm: "MOV R0,#55H",  check: "R0=$55" }
    - { asm: "MOV A,#3CH",   check: "A=$3C" }
    - { asm: "MOV R0,A",     check: "R0=$3C" }
    - { asm: "MOV A,#00H",   check: "A=$00" }
    - { asm: "MOV A,R0",     check: "A=$3C" }
    - { asm: "MOV 31H,A",    check: "IRAM[$31]=$3C" }
    - { asm: "MOV A,#09H",   check: "A=$09" }
    - { asm: "ADD A,#01H",   check: "A=$0A" }
    - { asm: "DA A",         check: "A=$10" }
    - { asm: "MOV 32H,A",    check: "IRAM[$32]=$10" }

move_matrix:
  test:
    - { asm: "MOV 20H,#0A5H", check: "IRAM[$20]=$A5" }
    - { asm: "MOV 21H,20H",   check: "IRAM[$21]=$A5" }
    - { asm: "MOV R1,20H",    check: "R1=$A5" }
    - { asm: "MOV 22H,R1",    check: "IRAM[$22]=$A5" }
    - { asm: "MOV R0,#23H",   check: "R0=$23" }
    - { asm: "MOV @R0,22H",   check: "IRAM[$23]=$A5" }
    - { asm: "MOV 24H,@R0",   check: "IRAM[$24]=$A5" }
    - { asm: "MOV A,24H",     check: "A=$A5" }
    - { asm: "MOV R2,A",      check: "R2=$A5" }
    - { asm: "MOV A,R2",      check: "A=$A5" }

arithmetic_flags:
  test:
    - { asm: "MOV A,#7FH",    check: "A=$7F" }
    - { asm: "ADD A,#01H",    check: "A=$80, C=0, AC=1, OV=1" }
    - { asm: "SETB C",        check: "C=1" }
    - { asm: "ADDC A,#7FH",   check: "A=$00, C=1, AC=1, OV=0" }
    - { asm: "CLR C",         check: "C=0" }
    - { asm: "MOV A,#00H",    check: "A=$00" }
    - { asm: "SUBB A,#01H",   check: "A=$FF, C=1, AC=1, OV=0" }
    - { asm: "MOV A,#80H",    check: "A=$80" }
    - { asm: "CLR C",         check: "C=0" }
    - { asm: "SUBB A,#01H",   check: "A=$7F, C=0, AC=1, OV=1" }

# All eight C/AC/OV results of ADD, with P checked from the resulting A.
add_flag_matrix:
  test:
    - { asm: "MOV A,#00H", check: "" }
    - { asm: "ADD A,#00H", check: "A=$00, C=0, AC=0, OV=0, P=0" }
    - { asm: "MOV A,#10H", check: "" }
    - { asm: "ADD A,#70H", check: "A=$80, C=0, AC=0, OV=1, P=1" }
    - { asm: "MOV A,#01H", check: "" }
    - { asm: "ADD A,#0FH", check: "A=$10, C=0, AC=1, OV=0, P=1" }
    - { asm: "MOV A,#01H", check: "" }
    - { asm: "ADD A,#7FH", check: "A=$80, C=0, AC=1, OV=1, P=1" }
    - { asm: "MOV A,#10H", check: "" }
    - { asm: "ADD A,#0F0H",check: "A=$00, C=1, AC=0, OV=0, P=0" }
    - { asm: "MOV A,#80H", check: "" }
    - { asm: "ADD A,#80H", check: "A=$00, C=1, AC=0, OV=1, P=0" }
    - { asm: "MOV A,#01H", check: "" }
    - { asm: "ADD A,#0FFH",check: "A=$00, C=1, AC=1, OV=0, P=0" }
    - { asm: "MOV A,#81H", check: "" }
    - { asm: "ADD A,#8FH", check: "A=$10, C=1, AC=1, OV=1, P=1" }

# ADDC needs both carry inputs; each input gets all eight C/AC/OV outcomes.
addc_flag_inputs:
  test:
    - { asm: "CLR C",         check: "" }
    - { asm: "MOV A,#00H",   check: "" }
    - { asm: "ADDC A,#00H",  check: "A=$00, C=0, AC=0, OV=0, P=0" }
    - { asm: "CLR C",         check: "" }
    - { asm: "MOV A,#10H",   check: "" }
    - { asm: "ADDC A,#70H",  check: "A=$80, C=0, AC=0, OV=1, P=1" }
    - { asm: "CLR C",         check: "" }
    - { asm: "MOV A,#01H",   check: "" }
    - { asm: "ADDC A,#0FH",  check: "A=$10, C=0, AC=1, OV=0, P=1" }
    - { asm: "CLR C",         check: "" }
    - { asm: "MOV A,#01H",   check: "" }
    - { asm: "ADDC A,#7FH",  check: "A=$80, C=0, AC=1, OV=1, P=1" }
    - { asm: "CLR C",         check: "" }
    - { asm: "MOV A,#10H",   check: "" }
    - { asm: "ADDC A,#0F0H", check: "A=$00, C=1, AC=0, OV=0, P=0" }
    - { asm: "CLR C",         check: "" }
    - { asm: "MOV A,#80H",   check: "" }
    - { asm: "ADDC A,#80H",  check: "A=$00, C=1, AC=0, OV=1, P=0" }
    - { asm: "CLR C",         check: "" }
    - { asm: "MOV A,#01H",   check: "" }
    - { asm: "ADDC A,#0FFH", check: "A=$00, C=1, AC=1, OV=0, P=0" }
    - { asm: "CLR C",         check: "" }
    - { asm: "MOV A,#81H",   check: "" }
    - { asm: "ADDC A,#8FH",  check: "A=$10, C=1, AC=1, OV=1, P=1" }
    - { asm: "SETB C",        check: "" }
    - { asm: "MOV A,#00H",   check: "" }
    - { asm: "ADDC A,#00H",  check: "A=$01, C=0, AC=0, OV=0, P=1" }
    - { asm: "SETB C",        check: "" }
    - { asm: "MOV A,#10H",   check: "" }
    - { asm: "ADDC A,#70H",  check: "A=$81, C=0, AC=0, OV=1, P=0" }
    - { asm: "SETB C",        check: "" }
    - { asm: "MOV A,#00H",   check: "" }
    - { asm: "ADDC A,#0FH",  check: "A=$10, C=0, AC=1, OV=0, P=1" }
    - { asm: "SETB C",        check: "" }
    - { asm: "MOV A,#00H",   check: "" }
    - { asm: "ADDC A,#7FH",  check: "A=$80, C=0, AC=1, OV=1, P=1" }
    - { asm: "SETB C",        check: "" }
    - { asm: "MOV A,#10H",   check: "" }
    - { asm: "ADDC A,#0F0H", check: "A=$01, C=1, AC=0, OV=0, P=1" }
    - { asm: "SETB C",        check: "" }
    - { asm: "MOV A,#80H",   check: "" }
    - { asm: "ADDC A,#80H",  check: "A=$01, C=1, AC=0, OV=1, P=1" }
    - { asm: "SETB C",        check: "" }
    - { asm: "MOV A,#00H",   check: "" }
    - { asm: "ADDC A,#0FFH", check: "A=$00, C=1, AC=1, OV=0, P=0" }
    - { asm: "SETB C",        check: "" }
    - { asm: "MOV A,#80H",   check: "" }
    - { asm: "ADDC A,#8FH",  check: "A=$10, C=1, AC=1, OV=1, P=1" }

# SUBB likewise covers each C/AC/OV output for both borrow inputs.
subb_flag_matrix:
  test:
    - { asm: "CLR C",         check: "" }
    - { asm: "MOV A,#00H",   check: "" }
    - { asm: "SUBB A,#00H",  check: "A=$00, C=0, AC=0, OV=0, P=0" }
    - { asm: "CLR C",         check: "" }
    - { asm: "MOV A,#80H",   check: "" }
    - { asm: "SUBB A,#10H",  check: "A=$70, C=0, AC=0, OV=1, P=1" }
    - { asm: "CLR C",         check: "" }
    - { asm: "MOV A,#10H",   check: "" }
    - { asm: "SUBB A,#01H",  check: "A=$0F, C=0, AC=1, OV=0, P=0" }
    - { asm: "CLR C",         check: "" }
    - { asm: "MOV A,#80H",   check: "" }
    - { asm: "SUBB A,#01H",  check: "A=$7F, C=0, AC=1, OV=1, P=1" }
    - { asm: "CLR C",         check: "" }
    - { asm: "MOV A,#00H",   check: "" }
    - { asm: "SUBB A,#10H",  check: "A=$F0, C=1, AC=0, OV=0, P=0" }
    - { asm: "CLR C",         check: "" }
    - { asm: "MOV A,#00H",   check: "" }
    - { asm: "SUBB A,#80H",  check: "A=$80, C=1, AC=0, OV=1, P=1" }
    - { asm: "CLR C",         check: "" }
    - { asm: "MOV A,#00H",   check: "" }
    - { asm: "SUBB A,#01H",  check: "A=$FF, C=1, AC=1, OV=0, P=0" }
    - { asm: "CLR C",         check: "" }
    - { asm: "MOV A,#10H",   check: "" }
    - { asm: "SUBB A,#81H",  check: "A=$8F, C=1, AC=1, OV=1, P=1" }
    - { asm: "SETB C",        check: "" }
    - { asm: "MOV A,#01H",   check: "" }
    - { asm: "SUBB A,#00H",  check: "A=$00, C=0, AC=0, OV=0, P=0" }
    - { asm: "SETB C",        check: "" }
    - { asm: "MOV A,#81H",   check: "" }
    - { asm: "SUBB A,#10H",  check: "A=$70, C=0, AC=0, OV=1, P=1" }
    - { asm: "SETB C",        check: "" }
    - { asm: "MOV A,#10H",   check: "" }
    - { asm: "SUBB A,#00H",  check: "A=$0F, C=0, AC=1, OV=0, P=0" }
    - { asm: "SETB C",        check: "" }
    - { asm: "MOV A,#80H",   check: "" }
    - { asm: "SUBB A,#00H",  check: "A=$7F, C=0, AC=1, OV=1, P=1" }
    - { asm: "SETB C",        check: "" }
    - { asm: "MOV A,#01H",   check: "" }
    - { asm: "SUBB A,#10H",  check: "A=$F0, C=1, AC=0, OV=0, P=0" }
    - { asm: "SETB C",        check: "" }
    - { asm: "MOV A,#01H",   check: "" }
    - { asm: "SUBB A,#80H",  check: "A=$80, C=1, AC=0, OV=1, P=1" }
    - { asm: "SETB C",        check: "" }
    - { asm: "MOV A,#00H",   check: "" }
    - { asm: "SUBB A,#00H",  check: "A=$FF, C=1, AC=1, OV=0, P=0" }
    - { asm: "SETB C",        check: "" }
    - { asm: "MOV A,#10H",   check: "" }
    - { asm: "SUBB A,#80H",  check: "A=$8F, C=1, AC=1, OV=1, P=1" }

decimal_adjust:
  test:
    - { asm: "MOV A,#15H",   check: "A=$15" }
    - { asm: "SETB C",        check: "C=1" }
    - { asm: "DA A",          check: "A=$75, C=1, P=1" }
    - { asm: "CLR C",         check: "C=0" }
    - { asm: "MOV A,#0FAH",  check: "A=$FA" }
    - { asm: "DA A",          check: "A=$60, C=1, P=0" }
    - { asm: "MOV A,#09H",   check: "A=$09" }
    - { asm: "MOV PSW,#40H", check: "AC=1, C=0" }
    - { asm: "DA A",          check: "A=$0F, C=0, P=0" }
    - { asm: "MOV A,#09H",   check: "" }
    - { asm: "MOV PSW,#0C4H", check: "C=1, AC=1, OV=1" }
    - { asm: "DA A",          check: "A=$6F, C=1, AC=1, OV=1, P=0" }

divide:
  test:
    - { asm: "MOV A,#17H",   check: "A=$17" }
    - { asm: "MOV B,#05H",   check: "B=$05" }
    - { asm: "DIV AB",        check: "A=$04, B=$03, C=0, OV=0, P=1" }
    - { asm: "MOV 33H,A",    check: "IRAM[$33]=$04" }
    - { asm: "MOV A,B",      check: "A=$03" }
    - { asm: "MOV 34H,A",    check: "IRAM[$34]=$03" }
    - { asm: "SETB C",        check: "C=1" }
    - { asm: "MOV A,#55H",   check: "A=$55" }
    - { asm: "MOV B,#00H",   check: "B=$00" }
    - { asm: "DIV AB",        check: "A=$55, B=$00, C=0, OV=1, P=0" }

multiply:
  test:
    - { asm: "MOV A,#10H", check: "A=$10" }
    - { asm: "MOV B,#10H", check: "B=$10" }
    - { asm: "MUL AB",      check: "A=$00, B=$01, C=0, OV=1, P=0" }
    - { asm: "SETB C",      check: "C=1" }
    - { asm: "MOV A,#02H", check: "A=$02" }
    - { asm: "MOV B,#03H", check: "B=$03" }
    - { asm: "MUL AB",      check: "A=$06, B=$00, C=0, OV=0, P=0" }

bit_operations:
  test:
    - { asm: "MOV 20H,#00H", check: "IRAM[$20]=$00" }
    - { asm: "SETB 00H",     check: "IRAM[$20]=$01" }
    - { asm: "SETB 01H",     check: "IRAM[$20]=$03" }
    - { asm: "CLR 00H",      check: "IRAM[$20]=$02" }
    - { asm: "CPL 01H",      check: "IRAM[$20]=$00" }
    - { asm: "SETB C",       check: "C=1" }
    - { asm: "MOV 02H,C",    check: "IRAM[$20]=$04" }
    - { asm: "MOV C,02H",    check: "C=1" }

logic_direct:
  test:
    - { asm: "MOV 20H,#0FH", check: "IRAM[$20]=$0F" }
    - { asm: "ORL 20H,#0F0H",check: "IRAM[$20]=$FF" }
    - { asm: "ANL 20H,#3FH", check: "IRAM[$20]=$3F" }
    - { asm: "XRL 20H,#0FH", check: "IRAM[$20]=$30" }
    - { asm: "MOV A,#81H",   check: "A=$81" }
    - { asm: "ORL A,20H",    check: "A=$B1" }
    - { asm: "ANL A,#0F0H",  check: "A=$B0" }
    - { asm: "XRL A,#0FFH",  check: "A=$4F" }

rotates:
  test:
    - { asm: "MOV A,#81H", check: "A=$81, C=0" }
    - { asm: "RR A",       check: "A=$C0, C=0" }
    - { asm: "RL A",       check: "A=$81, C=0" }
    - { asm: "SETB C",     check: "C=1" }
    - { asm: "RRC A",      check: "A=$C0, C=1" }
    - { asm: "RLC A",      check: "A=$81, C=1" }
    - { asm: "CLR C",      check: "C=0" }
    - { asm: "MOV A,#02H", check: "A=$02" }
    - { asm: "RRC A",      check: "A=$01, C=0, P=1" }
    - { asm: "RLC A",      check: "A=$02, C=0, P=1" }
    - { asm: "SETB C",     check: "C=1" }
    - { asm: "RR A",       check: "A=$01, C=1, P=1" }
    - { asm: "RL A",       check: "A=$02, C=1, P=1" }

branch_taken:
  test:
    - { asm: "MOV A,#00H", check: "A=$00" }
    - { asm: "JZ branch",  check: "PC=$0005" }
    - { asm: "branch: NOP", check: "" }

bit_branch:
  test:
    - { asm: "MOV 20H,#00H", check: "IRAM[$20]=$00" }
    - { asm: "SETB 00H",     check: "IRAM[$20]=$01" }
    - { asm: "JBC 00H,target", check: "IRAM[$20]=$00, PC=$000A" }
    - { asm: "NOP",            check: "" }
    - { asm: "target: NOP",   check: "" }

bit_logic:
  test:
    - { asm: "MOV 20H,#01H", check: "IRAM[$20]=$01" }
    - { asm: "CLR C",         check: "C=0" }
    - { asm: "ORL C,/00H",    check: "C=0" }
    - { asm: "SETB C",        check: "C=1" }
    - { asm: "ANL C,/00H",    check: "C=0" }
    - { asm: "ORL C,00H",     check: "C=1" }
    - { asm: "ANL C,00H",     check: "C=1" }

jnb_taken:
  test:
    - { asm: "MOV 20H,#00H",  check: "IRAM[$20]=$00" }
    - { asm: "JNB 00H,target", check: "PC=$0008" }
    - { asm: "NOP",            check: "" }
    - { asm: "target: NOP",    check: "" }

djnz_taken:
  test:
    - { asm: "MOV 20H,#02H",   check: "IRAM[$20]=$02" }
    - { asm: "DJNZ 20H,target", check: "IRAM[$20]=$01, PC=$0008" }
    - { asm: "NOP",             check: "" }
    - { asm: "target: NOP",     check: "" }

djnz_not_taken:
  test:
    - { asm: "MOV R0,#01H",     check: "R0=$01" }
    - { asm: "DJNZ R0,target",  check: "R0=$00, PC=$0005" }
    - { asm: "NOP",             check: "" }
    - { asm: "target: NOP",     check: "" }

cjne_taken:
  test:
    - { asm: "MOV A,#01H",       check: "A=$01" }
    - { asm: "CJNE A,#02H,target", check: "C=1, PC=$0007" }
    - { asm: "NOP",               check: "" }
    - { asm: "target: NOP",       check: "" }

cjne_direct:
  test:
    - { asm: "MOV A,#01H",         check: "A=$01" }
    - { asm: "MOV 20H,#00H",       check: "IRAM[$20]=$00" }
    - { asm: "CJNE A,20H,target",  check: "C=0, PC=$000A" }
    - { asm: "NOP",                 check: "" }
    - { asm: "target: NOP",         check: "" }

alu_addressing_forms:
  test:
    - { asm: "MOV A,#10H",    check: "A=$10" }
    - { asm: "MOV 20H,#01H",  check: "IRAM[$20]=$01" }
    - { asm: "MOV R0,#21H",   check: "R0=$21" }
    - { asm: "MOV @R0,#02H",  check: "IRAM[$21]=$02" }
    - { asm: "MOV R7,#03H",   check: "R7=$03" }
    - { asm: "ADD A,20H",     cycles: 1, check: "A=$11" }
    - { asm: "ADD A,@R0",     cycles: 1, check: "A=$13" }
    - { asm: "ADD A,R7",      cycles: 1, check: "A=$16" }
    - { asm: "CLR C",         check: "C=0" }
