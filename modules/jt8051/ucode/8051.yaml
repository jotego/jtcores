  - name: isr
    cycles: 2
    seq:
      # The next opcode has already been fetched at this boundary.  Save its
      # address so RETI re-executes it instead of skipping it.
      - stackp_addr, isrpclo_src, wr, sp_inc
      - stackp_addr, isrpchi_src, wr, sp_inc
      - irq_pc
      # The wrapper program ROM is synchronous.  Let the vector address
      # reach it before the shared fetch procedure captures the opcode.
      -
      -
      - isrfetch_jsr
      - ni
  - mnemo: [NOP, RESERVED]
    seq:
      - fetch_jsr
      - ni
  - mnemo: [MOV]
    seq:
      - ${pre}_jsr
      - ${src}_src, ${dst}_dst
      - fetch_jsr
      - ni
