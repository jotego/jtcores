#
# The control word is generated from the sequences below. `ops` deliberately
# lists every opcode: it is the only opcode decoder in JT8051.
config:
  entry_len: 64
  entries: 512
  cycle_factor: 12
  auto: { min: 256, max: 510 }

ops:
  - { name: NOP,  op: 0x00, cycles: 1 }
  - { name: AJMP, op: 0x01, cycles: 2, ctl: { pre: ajmp } }
  - { name: LJMP, op: 0x02, cycles: 2, ctl: { pre: abs } }
  - { name: RR,   op: 0x03, cycles: 1, ctl: { alu: rr,  flag: "" } }
  - { name: INC,  op: 0x04, cycles: 1, ctl: { pre: none, src: a,  dst: a,      alu: inc } }
  - { name: INC,  op: 0x05, cycles: 1, ctl: { pre: directl, src: md, dst: direct, alu: inc } }
  - { name: INC,  op: 0x06, cycles: 1, ctl: { pre: ri, src: md, dst: ri,     alu: inc } }
  - { name: INC,  op: 0x07, cycles: 1, ctl: { pre: ri, src: md, dst: ri,     alu: inc } }
