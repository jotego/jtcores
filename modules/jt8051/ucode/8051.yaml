      - stack_addr
      - ram_src, op1_dst, sp_dec
      - stack_addr
      - stack_addr
      - ram_src, op2_dst, sp_dec
      - ret_pc
      - fetch_jsr
      - ni
  - mnemo: [RETI]
    seq:
      - stack_addr
      - stack_addr
      - ram_src, op1_dst, sp_dec
      - stack_addr
      - stack_addr
      - ram_src, op2_dst, sp_dec
      - ret_pc, reti
      - fetch_jsr
      - ni
  - mnemo: [DIV, MUL]
    seq:
      - a_src, lhs_dst
      - b_src, rhs_dst
      - ${alu}_alu, alu_src, a_dst, mul_flag
      - ${alu}_alu, aux_src, b_dst
      - fetch_jsr
      - ni
  - mnemo: [MOVX]
    seq:
      - ${pre}_jsr
      - ${x}_x, x_acc, ${xwr}_xwr
      # The shared bus returns a byte one enabled edge after the request.  A
      # two-stage wrapper synchroniser presents that byte to the core on the
      # third following edge, so retain three wait microsteps.  Only the
      # first slot asserts the request; mapper interfaces treat it as an
      # edge.
      - ${x}_x
      - ${x}_x
      - ${x}_x
      - ${x}_x, ${src}_src, ${dst}_dst
      - fetch_jsr
      - ni
  - mnemo: [MOVC]
    seq:
      - ${pre}_jsr
      - ${code}_code, code_src, a_dst
      - fetch_jsr
      - ni
  - mnemo: [CLR]
    seq:
      - ${pre}_jsr
      - zero_src, ${dst}_dst
      - fetch_jsr
      - ni
  - mnemo: [CPL]
    seq:
      - ${pre}_jsr
      - ${src}_src, lhs_dst
      - cpl_alu, alu_src, ${dst}_dst
      - fetch_jsr
      - ni
  - mnemo: [SETB]
    seq:
      - ${pre}_jsr
      - one_src, ${dst}_dst
      - fetch_jsr
      - ni
  - mnemo: [DA]
    seq:
      - a_src, lhs_dst
      - da_alu, alu_src, a_dst, cya_flag
      - fetch_jsr
      - ni
  - mnemo: [SWAP]
    seq:
      - a_src, lhs_dst
      - swap_alu, alu_src, a_dst
      - fetch_jsr
      - ni
  - mnemo: [LCALL]
    seq:
      - ${pre}_jsr
      - stackp_addr, pclo_src, wr, sp_inc
      - stackp_addr, pchi_src, wr, sp_inc
      - abs16_pc
      - fetch_jsr
      - ni
  - mnemo: [ACALL]
    seq:
      - ${pre}_jsr
      - stackp_addr, pclo_src, wr, sp_inc
      - stackp_addr, pchi_src, wr, sp_inc
      - abs11_pc
      - fetch_jsr
      - ni
  - mnemo: [JMP]
    seq:
      - dptra_pc
      - fetch_jsr
      - ni
  - mnemo: [CJNE]
    seq:
      - ${pre}_jsr
      - ${src}_src, lhs_dst
      - ${rhs}_src, rhs_dst
      - cmp_alu, alu_src, cmp_flag, neq_cond, rel2c_pc
      - fetch_jsr
      - ni
  - mnemo: [PUSH]
    seq:
      - ${pre}_jsr
      - stackp_addr, ${src}_src, wr, sp_inc
      - fetch_jsr
      - ni
  - mnemo: [POP]
    seq:
      - ${pre}_jsr
      - stack_addr
      - stack_addr
      - ram_src, md_dst, sp_dec
      - md_src, ${dst}_dst
      - fetch_jsr
      - ni
  - mnemo: [XCH]
    seq:
      - ${pre}_jsr
      - a_src, ${dst}_dst
      - ${src}_src, a_dst
      - fetch_jsr
      - ni
  - mnemo: [XCHD]
    seq:
      - ${pre}_jsr
      - a_src, lhs_dst
      - ${src}_src, rhs_dst
      - xchd_alu, alu_src, ${dst}_dst
      - xchd_alu, aux_src, a_dst, fetch_jsr
      - ni
  - mnemo: [DJNZ]
    seq:
