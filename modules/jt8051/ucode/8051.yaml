    seq:
      - ${pre}_jsr
      - ${lhs}_src, lhs_dst
      - ${src}_src, rhs_dst
      - ${alu}_alu, alu_src, ${dst}_dst, ${flag}_flag
      - fetch_jsr
      - ni
  - mnemo: [RR, RL, RRC, RLC]
    seq:
