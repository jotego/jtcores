[global]
author=["jotego","niknak"]

[parse]
sourcefile=[ "segahang.cpp" ]
main_setnames=["sharrier"]
skip.bootlegs=true
# Hang-On's sprite ROMs do not group into 32-bit words, so its sprite format is
# not implemented. Enduro Racer needs jts16_fd1089 and the YM2151 path, neither
# wired yet. Both are skipped until the HDL can run them; matching is by
# substring, so "Enduro Racer" covers all eight sets.
skip.descriptions=["Hang-On","Enduro Racer"]

[audio]
volume = [ { machine="sharrier", value = 160 } ]

[buttons]
Names = [
    { machine="sharrier", names="Fire,Fire 2,Fire 3" },
]

[dipsw]
delete=[{names=["Unused","Unknown"]}]

rename=[ {name   = "Bonus Life", values = ["7M", "5M"] } ]

# 31 so the option bits 28-30 are inside the emitted window. A bit above bitcnt
# powers up to 0 on hardware while sim forces all-ones and hides it. Real SWA/SWB
# are bits 0-15.
bitcnt = 31

extra=[
# Stick Direction: the cabinet stick is an aircraft stick, push forward and
# Harrier goes DOWN. Arcade (=1) is that inversion.
{ machine = "sharrier", name    = "Stick Direction", bits    = "28", options = "Normal,Arcade" },
# D-Pad Control, for d-pad users only. Arcade (=1) is the sprung cabinet stick,
# springing back to centre; Console (=0) holds where released.
{ machine = "sharrier", name    = "D-Pad Control", bits    = "29", options = "Console,Arcade" },
# V Glyph Fix: 'V' in EPR-7196/7197/7198 has its rows rotated down by one and the
# fix reads row (n+1)%8 for tile 0x56. It is an original-game bug, so correcting
# it DEVIATES from the PCB and must default off -- hence the "On,Off" order, which
# puts Off on the 1 the extra dips default to. Reversing it ships the deviation.
{ machine = "sharrier", name    = "V Glyph Fix", bits    = "30", options = "On,Off" }
]

[ROM]
regions = [
    { name="maincpu",      width=16, reverse=true },
    { name="subcpu",       start="JTFRAME_BA1_START", width=16, reverse=true },
    { name="soundcpu",     start="SND_START" },
    { name="pcm",          start="PCM_START", no_offset=true },
    { name="gfx1",         start="JTFRAME_BA2_START", width=32, sequence=[0,1,2,2] },
    { name="sprites",      start="JTFRAME_BA3_START", width=32, no_offset=true },
    { name="segaic16road", start="ROAD_START", width=16, no_offset=true, singleton=true },
    { name="sprites:zoom", start="ZOOM_START", len=0x2000 },
    { name="mcu",          start="MCU_START", len=0x1000 },
    { name="maincpu:key",  start="MAINKEY_START", len=0x2000 },
    { name="plds",           skip=true },
    { name="soundboard_plds", skip=true },
    { name="romboard_plds",   skip=true },
]

order = [
    "maincpu", "subcpu", "soundcpu", "pcm", "gfx1",
    "sprites", "segaic16road", "sprites:zoom", "mcu", "maincpu:key"
]

