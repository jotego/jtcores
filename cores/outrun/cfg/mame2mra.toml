[global]
author=["jotego"]

[parse]
sourcefile=[ "segaorun.cpp" ]
skip.machines=["shangon"]
skip.bootlegs=true

[buttons]
Names = [
    { machine="outrun",  names="Accelerate,Brake,Gear (Low / High)"},
    { machine="toutrun", names="Accelerate,Brake,Gear (Low / High),Nitro"},
    { machine="shangon", names="Accelerate,Brake,-,Supercharger"},
]

[Audio]
volume = [
    { machine="outrun", value=0xEC },
    { machine="toutrun", value=0xA9 },
]

[dipsw]
delete=[{names=["Unused","Unknown","Credits"]}]
bitcnt = 18

extra=[
{ name="Gear Button",    bits="16", options="Toggle,Hold for Low" },
{ name="Gear Indicator", bits="17", options="On,Off", setnames=[
    "outrun","outrunra","outrundx","outrundxa","outrundxj","outruneh","outruneha","outrundxeh","outrundxeha",
    "toutrun","toutrunj","toutrun1","toutrun2","toutrun3","toutrunj1" ] },
]

[header]
fill=0
data = [
    { dev="fd1089a",     offset=0, data="02" },
    { dev="fd1089b",     offset=0, data="03" },
    { dev="fd1094",      offset=0, data="04" },
    { machine="shangon", offset=1, data="01" },
    { machine="toutrun", offset=1, data="02" }
]


[ROM]
regions = [
    { name="maincpu",     width=16, reverse=true },
    { name="subcpu",      start="JTFRAME_BA1_START", width=16, reverse=true },
    # OutRunm's single 0x20000 Z80 image has no known bank-switching support.
    # Keep only its visible first 64 KiB; sequence is required for Rom_len to
    # emit a truncated MRA part rather than the complete input file.
    { name="soundcpu",    start="SND_START", sequence=[0], Rom_len=0x10000 },
    { name="pcm",         start="PCM_START", No_offset=true, Rom_len=0x10000 },
    { name="gfx1",        start="JTFRAME_BA2_START", width=32, sequence=[0,2,4,4, 1,3,5,5 ] },
    { name="gfx1",        start="JTFRAME_BA2_START", width=32, sequence=[0,1,2,2 ], No_offset=true, machine="toutrun" },
    { name="sprites",     start="JTFRAME_BA3_START", width=32, No_offset=true },
    { machine="shangon",  name="sprites",     start="JTFRAME_BA3_START", width=16, reverse=true }, # S16B sprites
    { name="segaic16road",start="ROAD_START", width=16, No_offset=true, singleton=true },
    { name="maincpu:key", start="JTFRAME_PROM_START", len=0x2000 },
    { name="fd1089",      start="FD1089_START" },
]

order = [
    "maincpu", "subcpu", "soundcpu", "pcm", "gfx1",
    "sprites", "segaic16road", "maincpu:key"
]

patches = [
    # Gear indicator hooks
    { setname="outrun", offset=0xBA38, data="B9 4E 03 00 00 DA 71 4E 71 4E" },
    { setname="outrunra", offset=0xB99A, data="B9 4E 03 00 00 DA 71 4E 71 4E" },
    { setnames=["outrundx","outrundxa"], offset=0xB834, data="B9 4E 03 00 00 DA 71 4E 71 4E" },
    { setnames=["outruneh","outruneha"], offset=0xBA38, data="B9 4E 03 00 00 F0 71 4E 71 4E" },
    { setnames=["outrundxeh","outrundxeha"], offset=0xB834, data="B9 4E 03 00 00 F0 71 4E 71 4E" },
    { setname="outrundxj", offset=0xB834, data="F9 22 4B 94 08 2E 39 3E 79 62" },
    { setname="toutrun", offset=0x14174, data="B9 0E CC B9 12 C8 71 0E 71 0E" },
    { setname="toutrunj", offset=0x14174, data="B9 0E CC B9 36 76 71 0E 71 0E" },
