params: []

clocks:
  clk48:
    - mul: 1
      div: 24
      outputs: [cpu]
    - mul: 1
      div: 1024
      outputs: [audio]

audio:
  rc: { r: 0, c: 0 }
  channels:
    - name: sound
      data_width: 16
      rsum: 100k
      rout: 100k
      rc:
        - { r: 10000para, c: 1n } # C84 sees R49 in parallel with the cabinet volume pot.

sdram:
  banks:
    - buses: []

bram:
  - name: maincpu
    addr_width: 12
    data_width: 8
    prom: true
  - name: gfx1
    addr_width: 11
    data_width: 8
    prom: true
  - name: vram
    addr_width: 10
    data_width: 8
    rw: true
    simfile: {}
    dual_port:
      name: vram_video
      addr: vram_video_addr
      dout: vram_video_data
  - name: workram
    addr_width: 8
    data_width: 8
    rw: true
