	{ setname="redearthnr1", data="01 01 00 00 00 00 01 00 02 00 00 01 00 00 01 02 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 01 01 01 07 00 01 01 00 08 23 05 95 20 44 32 53 01 01 00 00 00 00 01 00 02 00 00 01 00 00 01 02 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 01 01 01 07 00 01 01 00 08 23 05 95 20 44 32 53 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00" },
