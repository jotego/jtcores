# Toobin' (Atari, 68010→fx68k). CPU-spine bring-up: main + stubs.
# Video / sound modules get added as those subsystems land.
toobin:
  - get: [ "*.v" ]          # jttoobin_{game,main}.v (+ video/snd later)
jtframe:
  - get:
      - jtframe_ff.v
      - jtframe_8bit_reg.v
      - jtframe_edge.v
  - from: ram
    get:
      - jtframe_ram.v
      - jtframe_dual_ram.v
      - jtframe_dual_ram16.v
      - jtframe_prom.v
  - from: video
    get:
      - jtframe_vtimer.v
  - from: cpu
    get:
      - jtframe_m68k.yaml      # fx68k (68000) — opcode-compatible with the board's 68010
