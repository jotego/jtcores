cninja:
  - get: [ "*.v" ]

jtframe:
  - get:
      - jtframe_ff.v
  - from: debug
    get:
      - jtframe_simdumper.v
  - from: sdram
    get:
      - jtframe_dwnld.v
  - from: ram
    get:
      - jtframe_dual_ram16.v
      - jtframe_dual_ram.v
      - jtframe_ram.v
      - jtframe_obj_buffer.v
      - jtframe_bram_dma.v
  - from: video
    get:
      - jtframe_vtimer.v
      - jtframe_blank.v
      - jtframe_linebuf.v
  - from: cpu
    unless: [NOMAIN]
    get:
      - jtframe_m68k.yaml
  - from: ver
    get:
      - jtframe_simwr_68k.v
  - from: ver
    when: [SIMULATION]
    get:
      - jtframe_sim_sndcmd.v

# Sound CPU: Hudson HuC6280 (H6280)
HUC6280:
# Sound chips
jt12:
  - get: [ jt03.yaml ]   # YM2203 (OPN + PSG)
ikaopm:                   # YM2151 (OPM), gate-accurate
jt6295:                   # MSM6295 x2
