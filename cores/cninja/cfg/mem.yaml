# SDRAM map. Bank offsets below are 16-bit-WORD units (jtframe_romrq does
# sdram_addr = offset + word_addr) -> >>1, even for the dw32 buses.
#
#   BA0  0x000000  sprite gfx, chunky dw32 (2MB)   objrom
#        0x200000  HuC6280 sound program (64kB)    snd
#   BA1  0x000000  tiles2 copy 1 (1MB)             scr2
#   BA2  0x000000  68k program                     main
#        0x0D0000  OKI #1 samples                  oki1
#        0x110000  OKI #2 samples                  oki2
#        0x190000  tiles2 copy 2 (1MB)             scr3
#   BA3  0x000000  chars (128kB)                   char
#        0x020000  tiles1 (512kB)                  scr1
#
# tiles2 is duplicated (BA1 + BA2) so the two deco16ic playfields fetch in
# parallel instead of serialising on a single bank.
params:
  - { name: SND_OFFSET,   value: "(`SND_START                       )>>1" }
  - { name: PCM_OFFSET,   value: "(`PCM_START     -`JTFRAME_BA2_START)>>1" }
  - { name: PCM2_OFFSET,  value: "(`PCM2_START    -`JTFRAME_BA2_START)>>1" }
  - { name: GFX3B_OFFSET, value: "(`GFX3_BA2_START-`JTFRAME_BA2_START)>>1" }
  - { name: GFX3_OFFSET,  value: "(`GFX3_START    -`JTFRAME_BA1_START)>>1" }
  - { name: GFX2_OFFSET,  value: "(`GFX2_START    -`JTFRAME_BA3_START)>>1" }
# Sound domain. Everything is one crystal: 32.220 MHz = 48 MHz * 537/800.
# 48 MHz is not an integer multiple of it, so the base cen has to be that
# fraction - but every chip below is then an exact integer division of the
# crystal, and the ones that fall on a /2 sequence share a single cen chain
# (outputs[0] is the base, each following output is another /2).
# Divisions read off the MAME MACHINE_CONFIGs:
#   cninja.cpp:779,839,841,847,849 | darkseal.cpp:325,374,376,381,383
#   cbuster.cpp:415,467,469,473,475 | vaportra.cpp:384,438,440,445,447
#     H6280 (Deco 45)  /8 = 4.0275 MHz    (darkseal /4; cbuster+vaportra 24MHz/4)
#     YM2203           /8 = 4.0275 MHz    (cbuster writes /24*3 = the same number)
#     YM2151           /9 = 3.5800 MHz
#     MSM6295 #2      /16 = 2.01375 MHz
#     MSM6295 #1      /32 = 1.006875 MHz
clocks:
  clk:
    # HuC6280 CLK input. The HUC6280 core divides CLK by 6 in high-speed mode
    # (cpu_clk_cnt wraps at 5, see HUC6280.v), so this is 6x the CPU rate:
    # 24 MHz -> 4.000 MHz vs MAME's 4.0275. The exact 24.165 MHz is above clk/2
    # and cannot be produced by a cen. NOT gated on `snd`: at clk/2 the cen is
    # already at its maximum rate, so jtframe_gated_cen has no spare cycles to
    # recover a stall and the CPU would just run slow. The snd ROM wait goes
    # through the HuC6280's own WAIT_N instead.
    - { freq: 24000000, outputs: [ cen_snd ] }
    - { freq:  4027500, outputs: [ cen_opn ] }   # xtal/8
    - { freq:  3580000, outputs: [ cen_opm ] }   # xtal/9
    # both OKIs on one /2 sequence: xtal/16 then xtal/32
    - { freq:  2013750, gate: [ oki1, oki2 ], outputs: [ cen_oki2, cen_oki1 ] }
download:
  post_addr: true
  post_data: true
audio:
  rsum: 20k
  channels:
    # Levels follow the MAME add_route ratios (YM2203 0.60, YM2151 0.45,
    # OKI1 0.75, OKI2 0.60). rsum is inversely proportional to level.
    - { name: opn,  module: jt03_fm,  rsum: 25k }                         # YM2203 FM
    - { name: psg,  module: jt03_psg, rsum: 30k, vpp: 0.45 }              # YM2203 PSG
    - { name: opm,  module: jt51,     rsum: 33k }                         # YM2151
    - { name: pcm1, module: jt6295,   rsum: 20k, fir: fir_192k_4k.csv }   # MSM6295 #1
    - { name: pcm2, module: jt6295,   rsum: 25k, fir: fir_192k_4k.csv }   # MSM6295 #2
sdram:
  banks:
    # ---- BA0 : sprite gfx + sound program ----
    # The download packs the RGN_FRAC(1,2) plane pairs into 32-bit chunky
    # {pl3,pl2,pl1,pl0} words, so 8px come out of ONE dw32 read.
    # objrom != obj_addr to avoid clashing with the engine wire in game.v.
    - buses:
      - name: objrom
        addr_width: 21        # 2MB span (dw32 -> port [20:2])
        data_width: 32
      - name: snd             # HuC6280 program: low bandwidth, rides above the sprites
        addr_width: 16        # 64kB
        data_width: 8
        offset: SND_OFFSET
    # ---- BA1 : tiles2 copy 1 - scr2 (tilegen0 pf2) reads here, alone ----
    - buses:
      - name: scr2
        addr_width: 20        # 1MB
        data_width: 32
        offset: GFX3_OFFSET
    # ---- BA2 : 68k program + OKI samples + tiles2 copy 2 ----
    # main/oki are low bandwidth, so scr3 (tilegen1 pf1) effectively owns BA2
    # and runs in parallel with scr2 in BA1.
    - buses:
      - name: main
        addr_width: 20
        data_width: 16
        din: main_dout
      - name: oki1
        addr_width: 18
        data_width: 8
        offset: PCM_OFFSET
      - name: oki2
        addr_width: 19
        data_width: 8
        offset: PCM2_OFFSET
      - name: scr3
        addr_width: 20        # 1MB
        data_width: 32
        offset: GFX3B_OFFSET
    # ---- BA3 : chars + tiles1 ----
    - buses:
      - name: char
        addr_width: 17        # 128kB
        data_width: 32
      - name: scr1
        addr_width: 19        # 512kB
        data_width: 32
        offset: GFX2_OFFSET
# Palette RAM 0x19c000-0x19dfff, 4096 x 16 (xBGR_888, 2 words/colour). Board
# SRAM: cninja.cpp maps it .ram().w(palette,write16).share("palette"). Port 0
# is the colour mixer's read port; the dual port is the CPU side (byte lanes
# + read-back). big_endian matches the m68k byte order of the scene dumps.
bram:
  - name: pal
    addr_width: 13        # bytes -> 16-bit AW=12
    data_width: 16
    simfile: { big_endian: true }
    dual_port:
      name: palrw
      din:  main_dout
      dout: palrw_dout
      rw:   true
  # Sprite RAM 0x1a4000-0x1a47ff (0x400 words), .ram().share("spriteram1").
  # objram is the CPU-visible copy; oram is the display buffer the engine scans
  # (MAME's buffered_spriteram16), refreshed by the DMA-flag write at 0x1b4000.
  # Same split karnov uses. oram carries the simfile so scene replay - which
  # never strobes the DMA - still preloads the engine-visible RAM.
  - name: objram
    data_width: 16
    addr_width: 11        # bytes -> AW=10
    addr: dma_addr
    dual_port: { name: objcpu, din: main_dout, dout: obj_dout, we: objcpu_we, rw: true }
  - name: oram
    data_width: 16
    addr_width: 11
    simfile: { big_endian: true }
    dual_port: { name: dma, din: objram_dout, we: dma_we, rw: true }
