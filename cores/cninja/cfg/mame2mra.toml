[global]
author=["jotego"]

[parse]
sourcefile=[ "cninja.cpp", "darkseal.cpp", "cbuster.cpp", "vaportra.cpp" ]
skip.bootlegs=true
# vaportra3 splits tiles1 into 4 LOAD16_BYTE ROMs instead of the single vtmaa00
# mask the other sets share, so it needs its own gfx rule.
skip.setnames=["vaportra3"]
mustbe.machines=[
    "cninja",
    "darkseal",
    "cbuster",
    "vaportra",
]

[header]
info="""Caveman Ninja Hardware family header (decoded in jtcninja_game.v).
        byte 0 = game_id  (0=cninja/joemac, 1=cbuster, 2=darkseal/gatedoom)
        byte 1 = gfx char-region end   (BA3 word offset >> 16, i.e. 64kB-word units)
        byte 2 = gfx tiles1-region end
        byte 3 = gfx tiles2-region end
        byte 4 bit0 = tiles2 has ROM_CONTINUE (1MB cninja) vs single ROM (darkseal)
        These let the gfx download remap use each game's real region sizes, so a
        smaller region's trailing blob padding can't fold onto and overwrite the
        real data. Bytes 5..15 reserved. See doc/HW_FAMILY.md."""
data=[
    # game_id  t1   t2   end  romcont
    { setnames=["cninja","cninja1","cninjau","joemac"],                      data="00 01 05 0D 01" },
    { setnames=["darkseal","darkseal1","darksealj","gatedoom","gatedoom1"],  data="02 01 05 09 00" },
    { setnames=["cbuster","cbusterw","cbusterj","twocrude","twocrudea"],     data="01 01 05 09 00" },
    # gfx_t2=05 = tiles1 END (0x10000+0x40000). 04 truncated it, so the last
    # 128kB missed the plane-pair rotate and codes >=3072 fetched garbage.
    { setnames=["vaportra","vaportrau","kuhga"],                             data="03 01 05 05 00" },
]

[Audio]
volume = [
    { machine="cninja", value=0xFF },
]

[buttons]
Names = [
    { machine="cninja", names="Attack,Jump"},
    { setnames=["cbuster","cbusterw","cbusterj","twocrude","twocrudea"], names="Attack,Jump,Special"},
]

[dipsw]
bitcnt = 16
base = 16
delete=[{names=["Unused","Unknown"]}]

[ROM]
# The gfx are packed here into the chunky {p3,p2,p1,p0} 32-bit words the engines
# read, so the download remap stays identity. Map digits are byte-checked against
# the raw ROMs, never hand-derived. The one exception is vaportra tiles1, still
# rotated in jtcninja_game.v.
regions = [
    # Sprites: RGN_FRAC(1,2), planes 3,2 in fraction 1 and 1,0 in fraction 2.
    { name="sprites1", machines=["cninja","cninja1","cninjau","joemac"], No_offset=true, width=32, parts=[
        { name="mag-05.12y", crc="56a53254", map="0021" },
        { name="mag-03.9y",  crc="2220eb9f", map="2100" },
        { name="mag-06.12z", crc="82d44749", map="0021" },
        { name="mag-04.9z",  crc="144b94cc", map="2100" },
    ] },
    { name="sprites", machines=["darkseal","darkseal1","darksealj","gatedoom","gatedoom1"], rename="sprites1", No_offset=true, width=32, parts=[
        { name="mac-00.b1", crc="52acf1d6", map="0021" },
        { name="mac-01.b3", crc="b28f7584", map="2100" },
    ] },
    # cbuster sprites are chunky RGN_FRAC(1,1) loaded by ROM_LOAD32, so the byte
    # lanes come from the ROM offsets rather than a fraction split.
    { name="sprites", machines=["cbuster","cbusterw","cbusterj","twocrude","twocrudea"], rename="sprites1", No_offset=true, width=32, parts=[
        { name="mab-02.10a", crc="58b7231d", map="0021" },
        { name="mab-03.11a", crc="76053b9d", map="2100" },
    ] },
    # High-code sprite tiles (top 2048). mab-02/03 only fill the low 1MB; without
    # these every high-code sprite reads the 0xFF padding. Synthetic region name,
    # so `files` has to supply the ROM metadata that `parts` resolves against.
    { name="sprites1hi", start="SPR2_START", No_offset=true, machines=["cbuster","cbusterw","cbusterj","twocrude","twocrudea"], width=32, files=[ { name="fu07-.4a", crc="ca8d0bb3", size=0x10000 }, { name="fu08-.5a", crc="c6afc5c8", size=0x10000 }, { name="fu09-.7a", crc="526809ca", size=0x10000 }, { name="fu10-.8a", crc="6be6d50e", size=0x10000 } ], parts=[
        { name="fu07-.4a", crc="ca8d0bb3", map="0001" },
        { name="fu08-.5a", crc="c6afc5c8", map="0010" },
        { name="fu09-.7a", crc="526809ca", map="0100" },
        { name="fu10-.8a", crc="6be6d50e", map="1000" } ] },
    { name="sprites", machines=["vaportra","vaportrau","kuhga"], rename="sprites1", No_offset=true, width=32, parts=[
        { name="vtmaa03.bin", crc="1a30bf81", map="0021" },
        { name="vtmaa04.bin", crc="b713e9cc", map="2100" },
    ] },

    { name="maincpu",  start="JTFRAME_BA2_START", width=16, reverse=true, No_offset=true },
    { name="audiocpu", start="SND_START", No_offset=true },
    { name="oki1",     start="PCM_START",  No_offset=true },
    { name="oki2",     start="PCM2_START", No_offset=true },

    # Chars: ROM_LOAD16_BYTE pair crossed with RGN_FRAC(1,2) gives four
    # sub-streams, one byte each. The first ROM listed is the odd byte.
    { name="chars", start="GFX1_START", No_offset=true, width=32, machines=["cninja","cninja1","cninjau","joemac"], parts=[
        { name="gl-08.6y", crc="33a2b400", offset=0x0000, length=0x8000, map="0010" },
        { name="gl-09.6z", crc="5a2d4752", offset=0x0000, length=0x8000, map="0001" },
        { name="gl-08.6y", crc="33a2b400", offset=0x8000, length=0x8000, map="1000" },
        { name="gl-09.6z", crc="5a2d4752", offset=0x8000, length=0x8000, map="0100" },
    ] },
    { name="chars", start="GFX1_START", No_offset=true, width=32, machines=["darkseal","darkseal1","darksealj","gatedoom","gatedoom1"], parts=[
        { name="fz_02.j1", crc="3c9c3012", offset=0x0000, length=0x8000, map="0010" },
        { name="fz_03.j2", crc="264b90ed", offset=0x0000, length=0x8000, map="0001" },
        { name="fz_02.j1", crc="3c9c3012", offset=0x8000, length=0x8000, map="1000" },
        { name="fz_03.j2", crc="264b90ed", offset=0x8000, length=0x8000, map="0100" },
    ] },
    # vaportra has no chars ROM: the 8x8 fg tiles live inside tiles1, as the first
    # 64kB of each RGN_FRAC half (12-bit code = 4096 chars).
    { name="chars", start="GFX1_START", No_offset=true, width=32, machines=["vaportra","vaportrau","kuhga"], files=[ { name="vtmaa00.bin", crc="0330e13b", size=0x80000 } ], parts=[
        { name="vtmaa00.bin", crc="0330e13b", offset=0x00000, length=0x10000, map="0021" },
        { name="vtmaa00.bin", crc="0330e13b", offset=0x40000, length=0x10000, map="2100" },
    ] },

    { name="tiles1", start="GFX2_START", No_offset=true, width=32, machines=["cninja","cninja1","cninjau","joemac"], parts=[
        { name="mag-02.4z", crc="de89c69a", offset=0x00000, length=0x40000, map="0021" },
        { name="mag-02.4z", crc="de89c69a", offset=0x40000, length=0x40000, map="2100" },
    ] },
    { name="tiles1", start="GFX2_START", No_offset=true, width=32, machines=["darkseal","darkseal1","darksealj","gatedoom","gatedoom1"], parts=[
        { name="mac-03.h3", crc="9996f3dc", offset=0x00000, length=0x40000, map="0021" },
        { name="mac-03.h3", crc="9996f3dc", offset=0x40000, length=0x40000, map="2100" },
    ] },
    # Loaded raw: the MRA form that reproduces the rotate byte-for-byte has not
    # been found yet, so jtcninja_game.v still moves the frac bit (17).
    { name="tiles1", machines=["vaportra","vaportrau","kuhga"], start="GFX2_START", No_offset=true },
    # cbuster tiles are RGN_FRAC(1,1) byte-per-plane, already chunky, so they load
    # raw. MAME's tiles1 region holds mab-00 plus the fu05/fu06 8x8 chars, and the
    # rename below moves the WHOLE region - so mab-00 is pulled in by file here to
    # keep it in the tiles1 slot.
    { name="tiles1", machines=["cbuster","cbusterw","cbusterj","twocrude","twocrudea"], start="GFX2_START", No_offset=true, files=[ { name="mab-00.4c", crc="660eaabd", size=0x80000 } ] },
    { name="tiles1", machines=["cbuster","cbusterw","cbusterj","twocrude","twocrudea"], rename="chars", start="GFX1_START", width=16, sequence=[1,2], No_offset=true },

    # cninja tiles2 is a 1MB ROM_CONTINUE pair, which mame2mra does not replicate,
    # so it is sliced into the four 256K blocks the real region order produces.
    { name="tiles2", start="GFX3_START", No_offset=true, width=32, machines=["cninja","cninja1","cninjau","joemac"], parts=[
        { name="mag-00.1y", crc="a8f05d33", offset=0x00000, length=0x40000, map="0021" },
        { name="mag-00.1y", crc="a8f05d33", offset=0x40000, length=0x40000, map="2100" },
        { name="mag-01.1z", crc="5b399eed", offset=0x00000, length=0x40000, map="0021" },
        { name="mag-01.1z", crc="5b399eed", offset=0x40000, length=0x40000, map="2100" },
    ] },
    { name="tiles2", start="GFX3_START", No_offset=true, width=32, machines=["darkseal","darkseal1","darksealj","gatedoom","gatedoom1"], parts=[
        { name="mac-02.e20", crc="49504e89", offset=0x00000, length=0x40000, map="0021" },
        { name="mac-02.e20", crc="49504e89", offset=0x40000, length=0x40000, map="2100" },
    ] },
    { name="tiles2", machines=["vaportra","vaportrau","kuhga"], start="GFX3_START", No_offset=true, width=32, parts=[
        { name="vtmaa02.bin", crc="091ff98e", map="0021" },
        { name="vtmaa01.bin", crc="c217a31b", map="2100" },
    ] },
    { name="tiles2", machines=["cbuster","cbusterw","cbusterj","twocrude","twocrudea"], start="GFX3_START", No_offset=true },

    # The colour mixer builds the palette in HDL, so the PROMs are not assembled.
    { name="proms",    skip=true },
    { name="plds",     skip=true }
]

# Must follow the SDRAM map in cfg/macros.def:
#   BA0 sprites1 sprites1hi audiocpu | BA1 tiles2 | BA2 maincpu oki1 oki2
#   BA3 chars tiles1
order = [
    "sprites1", "sprites1hi", "audiocpu",
    "tiles2",
    "maincpu", "oki1", "oki2",
    "chars", "tiles1"
]
