params:
  - { name: BG_OFFSET,  value: "(`BG_START-`JTFRAME_BA2_START)>>1" }
  - { name: FG_OFFSET,  value: "(`FG_START-`JTFRAME_BA2_START)>>1" }
clocks:
  clk48:
    - freq: 6M
      outputs:
        - cen6
    - freq: 14M
      outputs:
        - cen14           # TMS320C10
        - cen7            # pixel clock
        - cen3p5          # audio Z80, YM3812, HD6845S
audio:
  rsum: 10k
  rc: { r: 1.3k, c: 10n }
  channels:
    - { name: fm, module: jtopl, rsum: 6.2k, rc: [{ r: 1rout, c: 1n }] }
sdram:
  banks:
    - buses:
        - name: main
          addr_width: 18
          data_width: 8
    - buses:
        - name: snd
          addr_width: 15
          data_width: 8
    - buses:
        - name: char
          addr_width: 16        # 16384 rows of 32 bits
          data_width: 32
        - name: bg
          addr_width: 17        # 32768 rows
          data_width: 32
          offset: BG_OFFSET
        - name: fg
          addr_width: 17
          data_width: 32
          offset: FG_OFFSET
    - buses:
        - name: obj
          addr_width: 18        # 65536 rows, 16x16 sprites are two per row
          data_width: 32
bram:
  - name: work
    addr_width: 12
    data_width: 16
    rw: true
    addr: sh_addr
    din: sh_din
    dout: work_dout
    we: work_bwe
  - name: objram
    addr_width: 12
    data_width: 16
    rw: true
    addr: sh_addr
    din: sh_din
    dout: objram_dout
    we: obj_bwe
    dual_port: { name: objvid, addr: obj_vaddr, dout: obj_vq }
  - name: objbuf
    addr_width: 12
    data_width: 16
    rw: true
    addr: objcpy_addr
    din: obj_vq
    dout: objbuf_dout
    we: objcpy_we
    dual_port: { name: objscan, addr: objscan_addr, dout: objscan_q }
  - name: pal
    addr_width: 12
    data_width: 16
    rw: true
    addr: sh_addr
    din: sh_din
    dout: pal_dout
    we: pal_bwe
    dual_port: { name: palvid, addr: pal_vaddr, dout: pal_vq }
  - name: shared
    addr_width: 11
    data_width: 8
    rw: true
    addr: mshr_addr
    din: cpu_dout
    dout: shared_dout
    we: mshr_we
    dual_port: { name: sndshr, addr: shr_addr, din: shr_dout, dout: shr_din, we: shr_we, rw: true }
  - name: sndram
    addr_width: 7
    data_width: 8
    rw: true
    addr: sndram_addr
    din: shr_dout
    dout: sndram_dout
    we: sndram_we
  - name: sndwram
    addr_width: 11
    data_width: 8
    rw: true
    addr: sndwram_addr
    din: shr_dout
    dout: sndwram_dout
    we: sndwram_we
  - name: txram
    addr_width: 12
    data_width: 16
    rw: true
    addr: tx_a
    din: cpu16
    dout: txram_dout
    we: tx_bwe
    dual_port: { name: txvid, addr: tx_vaddr, dout: tx_vq }
  - name: bgram
    addr_width: 14
    data_width: 16
    rw: true
    addr: bg_a
    din: cpu16
    dout: bgram_dout
    we: bg_bwe
    dual_port: { name: bgvid, addr: bg_vaddr, dout: bg_vq }
  - name: fgram
    addr_width: 13
    data_width: 16
    rw: true
    addr: fg_a
    din: cpu16
    dout: fgram_dout
    we: fg_bwe
    dual_port: { name: fgvid, addr: fg_vaddr, dout: fg_vq }
  - name: dsprom
    addr_width: 12          # 0x1000 bytes = 2048 words
    data_width: 16
    rom:
      offset: "((`DSP_START-`JTFRAME_BA1_START)>>1)|24'h400000"
