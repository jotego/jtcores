params:
  - { name: PCM_OFFSET, value: "(`PCM_START-`JTFRAME_BA1_START)>>1" }

clocks:
  clk:
    - freq: 8 MHz
      outputs:
        - cen8
        - cen4
    - freq: 4 MHz
      gate: [ snd ]
      outputs:
        - snd_cen

audio:
  rsum: 10k
  channels:
    - { name: fm, module: jt12, rsum: 10k }

sdram:
  banks:
    - buses:
      - name: main
        addr_width: 19
        data_width: 16
    - buses:
      - name: snd
        addr_width: 16
        data_width: 8
      - name: adpcma
        addr_width: 19
        data_width: 8
        offset: PCM_OFFSET
    - buses:
      - name: scr
        addr_width: 21
        data_width: 32
      - name: obj
        addr_width: 21
        data_width: 32
    - buses:
      - name: adpcmb
        addr_width: 19
        data_width: 8

bram:
  # 68000 work RAM, f00000-f03fff
  - name: ram
    addr_width: 14
    data_width: 16
    addr: main_addr[13:1]
    din: cpu_dout
    rw: true

  # Palette RAM behind the X1-006, b00000-b00fff.
  # 2048 entries = 128 palettes x 16 pens, matching
  # GFXDECODE_ENTRY("gfx1", 0, tilelayout, 0, 128). Format is xRGB-555
  # (palette_device::xRGB_555), NOT the xBGR-555 used by most jt cores.
  - name: pal
    addr_width: 12
    data_width: 16
    addr: main_addr[11:1]
    din: cpu_dout
    rw: true
    ioctl:
      save: true
      order: 0
      unless: [ JTFRAME_RELEASE ]
    dual_port:
      name: palrd
      dout: pal_data

  # X1-001 internal RAM, d00000-d005ff, one byte per 68000 word:
  #   0x000-0x1ff sprite Y, 0x200-0x2ff BG column scroll
  # (seta001.cpp allocates 0x300 bytes for m_spriteylow).
  # d00600-d00607 are the four spritectrl words — registers in the X1-002,
  # so they stay in HDL, not here.
  - name: yram
    addr_width: 10
    data_width: 8
    addr: main_addr[10:1]
    din: cpu_dout[7:0]
    rw: true
    ioctl:
      save: true
      order: 1
      unless: [ JTFRAME_RELEASE ]
    dual_port:
      name: col
      dout: col_data

  # X1-001 external OBJ RAM: the two 4364 SRAMs on schematic sheet 3,
  # 8K x 16 = 16 kB at e00000-e03fff. taito_x calls draw_sprites with
  # bank_size 0x1000, i.e. the metafox/arbalest "setac" case, so
  # jtkiwi_gfx/jtkiwi_obj are instantiated with OBJAW=13.
  # Addresses and write strobes come from jtkiwi_gfx, which also muxes the
  # CPU side, so no explicit bindings here.
  - name: dma
    addr_width: 14
    data_width: 16
    rw: true
    ioctl:
      save: true
      order: 2
      unless: [ JTFRAME_RELEASE ]
    dual_port:
      name: code
      dout: code_dout

  - { name: cchip_mask,  addr_width: 12, data_width: 8, prom: true }
  - { name: cchip_eprom, addr_width: 13, data_width: 8, prom: true }
