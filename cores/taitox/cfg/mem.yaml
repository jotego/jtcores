# Superman / Taito X System SDRAM map — DRAFT
#
# Bus widths follow the MAME ROM regions:
#   maincpu : 16-bit (68k), 512 KB
#   audiocpu:  8-bit (Z80),  64 KB
#   adpcma  :  8-bit, 512 KB (YM2610 ADPCM-A samples)
#   gfx1    : 32-bit interleaved, 2 MB (Seta X1-001A obj+tile graphics ROMs)
#   cchip   :  8-bit, 2 KB  (Taito C-chip internal EPROM; Superman only)
#
# Bus ordering rule (rastan/gaiden pattern): rw buses come first on their bank
# so the auto-generated SDRAM slot connector wires the write enable correctly.
#
# Audio: single YM2610 stream (FM + ADPCM-A). No PSG, no PCM-B on Superman.

params:
  - { name: ADPCMA_OFFSET, value: "(`PCM_START-`JTFRAME_BA1_START)>>1" }
  - { name: OBJ_OFFSET,    value: "0" }    # obj takes full bank 2 from offset 0
  - { name: CCHIP_OFFSET,  value: "0" }

audio:
  rsum: 10k
  channels:
    - { name: fm,  module: jt12, rsum: 10k }   # YM2610 FM, wrapped by jt10

sdram:
  banks:
      # Bank 0 — 68k main ROM (read-only). Work RAM moved to BRAM in
      # jtsuperman_main.v — the memory-test loop at boot needed lower
      # latency than SDRAM could give without careful DTACK pacing, and
      # BRAM is the right model anyway (16 KB fits comfortably).
    - buses:
      - name: main
        addr_width: 19
        data_width: 16

      # Bank 1 — Z80 audio ROM + YM2610 ADPCM-A samples (both read-only)
    - buses:
      - name: snd
        addr_width: 16
        data_width: 8
      - name: adpcma
        addr_width: 19
        data_width: 8
        offset: ADPCMA_OFFSET

      # Bank 2 — Seta X1-001A sprite graphics, 2 MB.
      # addr_width=21 → 2 MB byte range (port becomes [20:2] = 19 bits
      # of 32-bit-word address), enough to cover the full 4-ROM
      # gfx1 region.  Two buses share the bank: `obj` feeds the FG
      # kiwi engine, `bg` feeds the BG-column kiwi engine; the
      # JTFRAME SDRAM controller arbitrates between them.
    - buses:
      - name: obj
        addr_width: 21
        data_width: 32
      - name: bg
        addr_width: 21
        data_width: 32

      # Bank 3 — reserved for C-chip EPROM. Not declared yet so the auto-gen
      # SDRAM controller doesn't expose a dangling cchip_cs port. Re-enable
      # this when jtsuperman_cchip lands:
      # - name: cchip
      #   addr_width: 11
      #   data_width: 8

# BRAM declarations for palette / sprite-Y / object RAM are deferred. They
# will live inside jtsuperman_main.v (cabal-style explicit instantiation)
# once the CPU→video bus is wired. Keeping mem.yaml minimal for now so the
# auto-generated port surface stays tight.
