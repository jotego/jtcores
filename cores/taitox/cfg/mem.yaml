params:
  - { name: PCM_OFFSET, value: "(`PCM_START-`JTFRAME_BA1_START)>>1" }
  - { name: CCROM_OFFSET, value: "(`CCHIP_START-`JTFRAME_BA3_START)>>1" }
  - { name: RAM_OFFSET, value: "(`RAM_START)>>1" }

clocks:
  clk:
    - freq: 8 MHz
      gate: [ adpcma, adpcmb ]
      outputs:
        - cen8
    - freq: 4 MHz
      gate: [ snd ]
      outputs:
        - snd_cen
    # YM2151 on P0-051A: 16/4, plus the half-rate enable jt51 wants
    - freq: 4 MHz
      outputs:
        - fm_cen
        - fm_cenp1

audio:
  rsum: 10k
  channels:
    - { name: fm, module: jt12, rsum: 10k }

sdram:
  banks:
    - buses:
      - name: main
        addr_width: 19
        data_width: 16
    - buses:
      - name: snd
        addr_width: 16
        data_width: 8
      - name: adpcma
        addr_width: 19
        data_width: 8
        offset: PCM_OFFSET
    - buses:
      - name: scr
        addr_width: 21
        data_width: 32
      - name: obj
        addr_width: 21
        data_width: 32
    - buses:
      - name: adpcmb
        addr_width: 19
        data_width: 8
      # C-chip mask ROM + game EPROM. Bank 3 only carries adpcmb, which is one
      # low-rate channel and absent altogether on superman, so the MCU fetches
      # do not contend with anything.
      - name: ccrom
        addr_width: 14
        data_width: 8
        offset: CCROM_OFFSET

bram:
  # 68000 work RAM, f00000-f03fff. Back in BRAM to rule it out of the
  # superman stuck-note investigation. The SDRAM version (bank 0, rw,
  # RAM_OFFSET) is what gets the core onto MiST/SiDi - see doc/TODO.md -
  # and should be restored once the audio question is settled. The bank
  # map is deliberately left untouched so this is a one-variable change:
  # RAM_START/RAM_OFFSET stay defined but unused.
  - name: ram
    addr_width: 14
    data_width: 16
    addr: main_addr[13:1]
    din: cpu_dout
    rw: true

  # Palette RAM behind the X1-006. The chip only receives 68k A9..A1
  # (sheet 4, block 55 pins 35-43)
  - name: pal
    addr_width: 10
    data_width: 16
    addr: main_addr[9:1]
    din: cpu_dout
    rw: true
    ioctl:
      save: true
      order: 0
      unless: [ JTFRAME_RELEASE ]
    dual_port:
      name: palrd
      dout: pal_data

  # X1-001 internal RAM
  - name: yram
    addr_width: 10
    data_width: 8
    addr: main_addr[10:1]
    din: cpu_dout[7:0]
    rw: true
    ioctl:
      save: true
      order: 1
      unless: [ JTFRAME_RELEASE ]
    dual_port:
      name: col
      dout: col_data

  # X1-001 external OBJ RAM: the two 4364 SRAMs on schematic sheet 3,
  # 8K x 16 = 16 kB at e00000-e03fff.
  - name: dma
    addr_width: 14
    data_width: 16
    rw: true
    ioctl:
      save: true
      order: 2
      unless: [ JTFRAME_RELEASE ]
    dual_port:
      name: code
      dout: code_dout

