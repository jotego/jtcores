[global]
author=["jotego","Andrea Bogazzi"]
zip.alt="cchip.zip"

[parse]
sourcefile=[ "taito_x.cpp" ]

[parse.skip]
setnames=[ "daisenpu", "twinhawk", "twinhawku" ]

[buttons]
names=[
    # Superman: schematic-verified on the PCB — PA4 = Punch, PA5 = Kick
    { machines=["superman","supermanu","supermanj"], names="Punch,Kick" },
    { machines=["gigandes","gigandesa"],             names="Shot,Bomb" },
    { machines=["ballbros"],                         names="Action,-" },
    { machines=["kyustrkr"],                         names="Short Pass,Long Pass,Shoot" },
]

[dipsw]
delete=[{names=["Unused","Unknown"]}]
rename=[
    {name="Price to Continue", to="Continue" },
]

# The family partitions three ways by who built the board (driver table
# lines 18-24), and that one fact carries almost everything:
#
#   cchip      Taito P0-039A      superman x3
#   opm        Taito P0-051A      daisenpu, twinhawk x2
#   neither    East Tech P0-057A  gigandes x2, ballbros, kyustrkr
#
# Disjoint and complete over all ten sets, so anything following the board
# split needs no bit of its own. Derived in the HDL instead of carried here:
#   direct_in = ~cchip                        taitox_state reads IN0/1/2 at 900000
#   irq2      = ~cchip                        only the cchip class installs the L6 ISR
#   fg_yoff   = ~cchip & ~opm ? -0x0a : -0x12 East Tech vs Taito
# kyustrkr is the one set whose quirks do not follow the board split.
[header]
registers=[
    { name="cchip",    pos="0[0]", desc="Taito P0-039A: TC0030CMD C-chip", values=[{ setnames=["superman","supermanu","supermanj"], value=1 }] },
    { name="opm",      pos="0[1]", desc="Taito P0-051A: PC060HA + YM2151", values=[{ setnames=["daisenpu","twinhawk","twinhawku"], value=1 }] },
    { name="kyustrkr", pos="0[2]", desc="Last Striker quirks: coin lockout, ROT180", values=[{ setname="kyustrkr", value=1 }] },
]

[ROM]
regions = [
    { name="maincpu",      width=16, reverse=true, no_offset=true },
    { name="audiocpu",     start="JTFRAME_BA1_START" },
    { name="ymsnd:adpcma", rename="adpcma", start="PCM_START" },
    { setnames=["ballbros","kyustrkr"], name="gfx1", start="JTFRAME_BA2_START", width=32, no_offset=true },
    { name="gfx1",         start="JTFRAME_BA2_START", width=16, no_offset=true },
    { name="ymsnd:adpcmb", rename="adpcmb", start="JTFRAME_BA3_START" },
    { name="cchip_bios", setnames=["superman","supermanu","supermanj"], start="JTFRAME_PROM_START", rom_len=0x1000, files=[ { name="cchip_upd78c11.bin", crc="43021521", size=0x1000 } ] },
    { name="cchip:cchip_eprom", rename="cchip_eprom", rom_len=0x2000 },
]

order = [
    "maincpu", "audiocpu", "adpcma", "gfx1", "adpcmb",
    "cchip_bios", "cchip_eprom"
]
