taitox:
  - get: [ "*.v" ]

# X1-001 / X1-002 sprite controller + BG-column renderer.
# These are the Seta chips already implemented for TNZS (kiwi) and reused by
# calibr50 and metafox/arbalest. The arbalest branch parametrized them with
# OBJAW (12 = 8 kB sprite RAM, 13 = 16 kB + the "setac" bank word at 0x1000).
# Taito X is the 16 kB / setac case, so it instantiates them with OBJAW=13
# and needs no further change to the shared modules.
kiwi:
  - get:
    - jtkiwi_gfx.v
    - jtkiwi_obj.v
    - jtkiwi_draw.v
    - jtkiwi_tilemap.v

# Taito sound-comm chip. MAME's pc060ha_device DERIVES from
# tc0140syt_device — one protocol, two package names — so jtrastan_pc060.v
# covers the TC0140SYT on superman/gigandes/ballbros/kyustrkr and the
# PC060HA on daisenpu/twinhawk. It is in-tree GPL-3 JTCORES code already
# proven in rastan, opwolf and volfied; the Taito F2 MiSTer tc0140syt.sv is
# kept in doc/ as a read-only cross-check only.
rastan:
  - get:
    - jtrastan_pc060.v

# TC0030CMD C-chip (Superman). See jtvlfied_cchip.v / jtrastan_cchip.v for
# the wrapper pattern: map the cabinet inputs onto the MCU ports and let this
# module do the rest.
jttc0030cmd:

jtframe:
  - get:
      - jtframe_ff.v
      - jtframe_8bit_reg.v
      - jtframe_edge.v
  - from: ram
    get:
      - jtframe_ram.v
      - jtframe_dual_ram.v
      - jtframe_dual_ram16.v
      - jtframe_obj_buffer.v
      - jtframe_prom.v
  - from: clocking
    get:
      - jtframe_sync.v
  - from: video
    get:
      - jtframe_vtimer.v
      - jtframe_blank.v
      - jtframe_scroll.yaml
  - from: cpu
    get:
      - jtframe_z80.yaml
      - jtframe_m68k.yaml

# YM2610 — jt10 ships inside the jt12 module
jt12:

