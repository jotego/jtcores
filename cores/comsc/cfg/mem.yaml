include:
  - core: contra
game: "contra"
audio:
  rsum: 2.7k
  rsum_feedback_res: true
  gain: 1.9
  channels:
    - { name: fm,   module: jt03_fm, rsum: 5.9k, rc: [{ r: 830,  c: 33n }] }
    # equivalent pole. PCM gain may be incorrect. The schematics shows a -6dB gain
    # but I am not sure of the vpp of 007759. It may be understated in audio_mod.yaml
    - { name: pcm,  module: jt7759,  rsum: 10k,  fir: fir_192k_4k.csv,      pre: 2.0 }
    - { name: psga, data_width: 8,   rsum: 4.4k, rc: [{ r: 762,  c: 22n }], pre: 0.23, rc_en: true, unsigned: true }  # 1 kOhm load resistor
    - { name: psgb, data_width: 8,   rsum: 4.4k, rc: [{ r: 762,  c: 22n }], pre: 0.23, rc_en: true, unsigned: true }  # 1 kOhm load resistor
    - { name: psgc, data_width: 8,   rsum: 4.4k, rc: [{ r: 762,  c: 22n }], pre: 0.23, rc_en: true, unsigned: true }  # 1 kOhm load resistor
  
