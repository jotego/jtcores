[parse]
sourcefile=[ "pacland.cpp", "skykid.cpp" ]

[buttons]
names=[
	{ machine="pacland",  names="Jump" },
	{ machine="drgnbstr", names="Attack,Jump" },
	{ machine="skykid",   names="Shot,Loop" },
]

[header]
registers = [
	{ name="skykid", pos="1[0]", values=[{machines=["drgnbstr","skykid"], value=1}], desc="Dragon Buster/Sky Kid board" },
	{ name="rot180", pos="1[1]", values=[{machines=["skykid"], value=1}], desc="Rotate the output 180 degrees" },
]

[dipsw]
rename=[ {name="Bonus Life", to="Bonus" }, ]
offset=[
	{ name="DSWA",    value=0  },
	{ name="DSWB",    value=8  },
	{ name="BUTTON2", value=16 },
]
defaults=[
	{ machine="skykid", value="ff,ff,ff" },
]

[ROM]
regions = [
	{ name="maincpu"                             },
	{ name="mcusub",   start="JTFRAME_BA1_START" },
	{ name="fg_chars", start="JTFRAME_BA2_START" },
	{ name="bg_chars", start="BG_START"          },
	{ name="chars",    start="JTFRAME_BA2_START" },
	{ name="tiles",    start="BG_START"          },
	{ name="sprites",  start="JTFRAME_BA3_START", width=16, sequence=[0,2,1,3] },
	{ name="sprites",  start="JTFRAME_BA3_START", width=16, sequence=[0,1,2,1,3,1,3,1], rom_len=0x2000, machine="drgnbstr" },
	{ name="sprites",  start="JTFRAME_BA3_START", width=16, sequence=[0,1,2,1,3,1,3,1], rom_len=0x2000, machine="skykid"   },
	{ name="mcu",      start="JTFRAME_PROM_START"},
	{ name="proms" },
	{ name="proms",    rom_len=0x400, machine="drgnbstr" },
	{ name="proms",    rom_len=0x400, machine="skykid"   },
]

order=["maincpu", "mcusub",
	"fg_chars","chars","bg_chars","tiles","sprites",
       "mcu","proms"
]
