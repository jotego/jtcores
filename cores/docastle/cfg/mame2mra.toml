[ROM]
# 7 romsets.json regions, region order/naming/start macros matching
# cfg/mem.yaml's bank grouping exactly (see PORTING_NOTES.md "ROM-bank
# mapping" table): ba0 groups main+sub+adpcm via SUB_START/ADPCM_START
# offsets; ba1=gfx1 at JTFRAME_BA1_START; ba2=gfx2 at JTFRAME_BA2_START;
# spritecpu+proms(cprom) are the two BRAM regions, anchored at
# JTFRAME_PROM_START / JTFRAME_PROM2_START respectively (see macros.def --
# JTFRAME_PROM2_START was added while writing this file; every non-first
# region needs its own distinct start macro, confirmed against castle's own
# k007121_2/proms pattern in cores/castle/cfg/mame2mra.toml, so a single
# shared JTFRAME_PROM_START for both docastle BRAM regions would have been
# wrong).
#
# "adpcm" is a real MAME ROM_REGION only on idsoccer/asoccer (Soccer profile)
# -- the other 7 sets simply have no such region in their MAME ROM list, so
# no per-machine restriction is written here; regions absent from a given
# machine are expected to be skipped automatically by the parser (same as
# how flstory's "sub"/"user1" regions, restricted with machines=[...], are
# just absent for machines that lack them -- here the restriction is
# implicit instead of explicit since no other machine defines "adpcm" at
# all).
#
# All widths are 8-bit / straight linear byte concatenation -- confirmed
# directly against romsets.json's regionOffset sequences for every set (no
# odd/even interleave anywhere in this ROM layout, unlike flstory's 16-bit
# interleaved tile ROMs), so no width=16/sequence= overrides are needed.
regions = [
	{ name="maincpu" },
	{ name="subcpu",    start="SUB_START" },
	{ name="adpcm",     start="ADPCM_START" },  # idsoccer, asoccer only
	{ name="gfx1",      start="JTFRAME_BA1_START" },
	{ name="gfx2",      start="JTFRAME_BA2_START" },
	{ name="spritecpu", start="JTFRAME_PROM_START" },
	{ name="proms",     start="JTFRAME_PROM2_START" },
]

order = [ "maincpu", "subcpu", "adpcm", "gfx1", "gfx2", "spritecpu", "proms" ]
