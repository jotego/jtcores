docastle:
  - get:
    - "*.v"
    # jt89 (SN76489A PSG) has no modules/jt89 entry in this tree, so it lives
    # core-local under hdl/ and is picked up by the wildcard above. Packaging it
    # as a jtcores submodule is future work.
jtframe:
  - get:
      - jtframe_edge.v
  - from: clocking
    get:
      - jtframe_cendiv.v
      # Reset-release synchronization.
      - jtframe_rst_sync.v
  - from: cpu
    get:
      # jtframe_z80 wrapper; the game module instantiates it three times
      # (main, sub/sound, sprite/protection CPU).
      - jtframe_z80.yaml
  - from: ram
    get:
      # The main CPU stalls on comm_cs accesses until the sub CPU services the
      # comm latch; this is the shared-RAM wait handshake for that.
      - jtframe_wait_on_shared.v
# jt5205 (MSM5205 ADPCM, Soccer profile only). Empty block: the module's own
# files.yaml supplies its file list.
jt5205:
