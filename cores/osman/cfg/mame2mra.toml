# Osman / Cannon Dancer — MAME -> MRA. Data East Simple 156 (dataeast/simpl156.cpp).
# Decryption is at-fetch (deco156 ARM, deco56 tiles) — the MRA only assembles ROMs into SDRAM banks.
# Base pattern: nslasher (ARM width=32 maincpu). gfx packing borrows cninja's deco16/decospr technique.

[global]
author=["jotego"]

[parse]
sourcefile=[ "simpl156.cpp", "deco156.cpp" ]   # deco156.cpp = hvysmsh+wcvol95 in MAME 0.282 (split to hvysmsh.cpp later)
# All simpl156.cpp families enabled. Shared by all: ARM DE156 @28MHz, 93C46, deco16ic
# 2x64x32 w/ bank_cb, DECO52 sprites, 2xOKI (sfx 1MHz + music), 320x240@58Hz, xBGR555;
# oki-music bitswap is common. Per-family deltas live in the [header] registers below.
# joemacr (+2 clones)  DE-0491-1 DECO;   blk @0x10xxxx; tiles 1MB, spr 1MB; music 2MHz
# chainrec             DECO;             blk @0x40xxxx; tiles 1MB, spr 2MB; music 2MHz; 4-way joy
#   magdrop/magdropp   DECO clone maps;  blk @0x38xxxx / @0x68xxxx
# charlien             Mitchell MT5601-0; blk @0x18xxxx; tiles 2MB, spr 2MB; music 1MHz; no eeprom dump
# prtytime (+gangonta) Mitchell, ROT90;  blk @0x18xxxx; tiles 2MB, spr 8MB; music 1MHz
# osman (+candance)    Mitchell;         blk @0x18xxxx; tiles 2MB, spr 8MB; clones differ in EEPROM only
# hvysmsh (+2 clones)  DECO (deco156.cpp); scattered map; tiles 2MB (ROM_CONTINUE), spr 8MB region
#                      (4MB dumped); pal xBGR888 32-bit; sfx OKI 512KB banked; music 2MHz, NO bitswap
# sets without an available dump:
skip.setnames=[
    "joemacrj",   # its own 1MB tile ROM (mbn00, crc 11b2dac7) is not in the collection
]
skip.machines=[
    "wcvol95",    # deco156.cpp but YMZ280B sound + own map: different hardware class
]

[header]
# Per-family differences as VALUE registers, straight into jtosman_header.v (generated
# by jtframe mra). The HDL consumes the values - no game tables in HDL.
# Bytes 0-8: one page register (byte addr [23:16]) per device. simpl156 boards keep the
# 8 pages in a tidy block; hvysmsh scatters them, hence per-device values.
# Byte 9: sprite-region FRAC half bit (word addr) for the download interleave:
#         1MB=18, 2MB=19, 8MB=21.
# Byte 10 flags:
#   [0] tile1mb: 1MB tile region, plain load (plane pairs 0x40000 decwords apart;
#       0 = 2MB mask ROM with the ROM_CONTINUE quarter swap, pairs 0x80000 apart)
#   [1] mus2m:   music OKI at 28/14=2 MHz (0 = Mitchell 28/28=1 MHz)
#   [2] hvio:    hvysmsh io page: 32-bit INPUTS read at +0, eeprom_w at +4, volume at +0
#                and sfx-OKI bank at +0xC on the write side
#   [3] rom1m:   1MB main ROM (0 = 512KB)
#   [4] musraw:  music OKI WITHOUT the init_simpl156 address bitswap
#   [5] sfxbank: sfx OKI 512KB, banked x2 (hvio write +0xC bit0)
#   [6] pal888:  palette is xBGR888, full 32-bit writes (0 = xBGR555 in the low half)
registers=[
    { name="mrampage", pos="0[7:0]", desc="main RAM page", values=[
        { machines=["osman","charlien","prtytime"], value=0x18 },
        { machines=["joemacr","hvysmsh"], value=0x10 },
        { machine="chainrec", value=0x40 },
        { setname="magdrop",  value=0x38 },
        { setname="magdropp", value=0x68 },
    ]},
    { name="orampage", pos="1[7:0]", desc="sprite RAM page", values=[
        { machines=["osman","charlien","prtytime"], value=0x19 },
        { machine="joemacr",  value=0x11 },
        { machine="chainrec", value=0x41 },
        { setname="magdrop",  value=0x39 },
        { setname="magdropp", value=0x69 },
        { machine="hvysmsh",  value=0x1e },
    ]},
    { name="palpage", pos="2[7:0]", desc="palette page", values=[
        { machines=["osman","charlien","prtytime"], value=0x1a },
        { machine="joemacr",  value=0x12 },
        { machine="chainrec", value=0x42 },
        { setname="magdrop",  value=0x3a },
        { setname="magdropp", value=0x6a },
        { machine="hvysmsh",  value=0x1c },
    ]},
    { name="iopage", pos="3[7:0]", desc="IO page", values=[
        { machines=["osman","charlien","prtytime"], value=0x1b },
        { machine="joemacr",  value=0x13 },
        { machine="chainrec", value=0x43 },
        { setname="magdrop",  value=0x3b },
        { setname="magdropp", value=0x6b },
        { machine="hvysmsh",  value=0x12 },
    ]},
    { name="pfctlpage", pos="4[7:0]", desc="pf control page", values=[
        { machines=["osman","charlien","prtytime"], value=0x1c },
        { machine="joemacr",  value=0x14 },
        { machine="chainrec", value=0x44 },
        { setname="magdrop",  value=0x3c },
        { setname="magdropp", value=0x6c },
        { machine="hvysmsh",  value=0x18 },
    ]},
    { name="pframpage", pos="5[7:0]", desc="pf name-table page", values=[
        { machines=["osman","charlien","prtytime"], value=0x1d },
        { machine="joemacr",  value=0x15 },
        { machine="chainrec", value=0x45 },
        { setname="magdrop",  value=0x3d },
        { setname="magdropp", value=0x6d },
        { machine="hvysmsh",  value=0x19 },
    ]},
    { name="rowscrpage", pos="6[7:0]", desc="rowscroll page", values=[
        { machines=["osman","charlien","prtytime"], value=0x1e },
        { machine="joemacr",  value=0x16 },
        { machine="chainrec", value=0x46 },
        { setname="magdrop",  value=0x3e },
        { setname="magdropp", value=0x6e },
        { machine="hvysmsh",  value=0x1a },
    ]},
    { name="sfxpage", pos="7[7:0]", desc="OKI sfx page", values=[
        { machines=["osman","charlien","prtytime"], value=0x10 },
        { machine="joemacr",  value=0x18 },
        { machine="chainrec", value=0x48 },
        { setname="magdrop",  value=0x40 },
        { setname="magdropp", value=0x78 },
        { machine="hvysmsh",  value=0x14 },
    ]},
    { name="muspage", pos="8[7:0]", desc="OKI music page", values=[
        { machines=["osman","charlien","prtytime"], value=0x14 },
        { machine="joemacr",  value=0x1c },
        { machine="chainrec", value=0x3c },
        { setname="magdrop",  value=0x34 },
        { setname="magdropp", value=0x4c },
        { machine="hvysmsh",  value=0x16 },
    ]},
    { name="sprbit", pos="9[4:0]", desc="sprite FRAC bit", values=[
        { machines=["osman","prtytime","hvysmsh"], value=21 },
        { machines=["charlien","chainrec"], value=19 },
        { machine="joemacr", value=18 },
    ]},
    { name="tile1mb", pos="10[0]", desc="1MB plain tile region", values=[
        { machines=["joemacr","chainrec"], value=1 },
    ]},
    { name="mus2m", pos="10[1]", desc="music OKI at 2 MHz", values=[
        { machines=["joemacr","chainrec","hvysmsh"], value=1 },
    ]},
    { name="hvio", pos="10[2]", desc="hvysmsh io page layout", values=[
        { machine="hvysmsh", value=1 },
    ]},
    { name="rom1m", pos="10[3]", desc="1MB main ROM", values=[
        { machine="hvysmsh", value=1 },
    ]},
    { name="musraw", pos="10[4]", desc="music OKI without bitswap", values=[
        { machine="hvysmsh", value=1 },
    ]},
    { name="sfxbank", pos="10[5]", desc="banked 512KB sfx OKI", values=[
        { machine="hvysmsh", value=1 },
    ]},
    { name="pal888", pos="10[6]", desc="xBGR888 32-bit palette", values=[
        { machine="hvysmsh", value=1 },
    ]},
]

[buttons]
# osman is a Strider-like action game, 3 buttons (EEPROM is fixed to 3-button). TODO confirm names.
Names = [ { machine="osman", names="Attack,Jump,Special" },
          { machine="hvysmsh", names="Shot,Jump,Special" } ]

[ROM]
regions = [
    { name="maincpu",  width=32, reverse=true },                         # ARM DE156, deco156-encrypted
    # ---- tiles (deco56-encrypted, decrypt-at-fetch). RAW load for now — boot doesn't fetch gfx.
    # TODO(video step): ROM_CONTINUE reorder (blk0->0,blk1->0x100000,blk2->0x080000,blk3->0x180000)
    # + 4bpp RGN_FRAC(1,2) plane split, byte-checked (never hand-derive).
    { name="tiles",    start="JTFRAME_BA1_START", No_offset=true },
    # ---- sprites (8 MB, 4bpp RGN_FRAC(1,2), NOT encrypted). MAME loads mcf-01..04 reversed
    # (@0x600000/0x400000/0x200000/0x000000). Plane-pair pack for jtframe_decospr = TODO byte-check
    # (cninja darkseal/supbtime pattern: load straight + game.v plane-pair rotate, OR width=32 parts).
    { name="sprites",  start="JTFRAME_BA3_START", No_offset=true },
    { name="okisfx",   rename="oki1", start="PCM1_START", No_offset=true },   # OKI #1 SFX 256 KB (512 KB slot)
    { name="okimusic", rename="oki2", start="PCM2_START", No_offset=true },   # OKI #2 music 2 MB (addr-bitswap+bank in download)
    # hvysmsh names its OKI regions oki1/oki2 directly (sfx 512 KB banked; music raw)
    { name="oki1", machine="hvysmsh", start="PCM1_START", No_offset=true },
    { name="oki2", machine="hvysmsh", start="PCM2_START", No_offset=true },
    { name="eeprom" },                                                        # 93C46 defaults (candance differs here)
    { name="plds",     skip=true },
]

order = [ "maincpu", "tiles", "oki1", "oki2", "sprites" ]
