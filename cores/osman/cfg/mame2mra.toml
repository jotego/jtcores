# Osman / Cannon Dancer — MAME -> MRA. Data East Simple 156 (dataeast/simpl156.cpp).
# Decryption is at-fetch (deco156 ARM, deco56 tiles) — the MRA only assembles ROMs into SDRAM banks.
# Base pattern: nslasher (ARM width=32 maincpu). gfx packing borrows cninja's deco16/decospr technique.

[global]
author=["jotego"]

[parse]
sourcefile=[ "simpl156.cpp", "deco156.cpp" ]   # deco156.cpp = hvysmsh+wcvol95 in MAME 0.282 (split to hvysmsh.cpp later)
# All simpl156.cpp families enabled. Shared by all: ARM DE156 @28MHz, 93C46, deco16ic
# 2x64x32 w/ bank_cb, DECO52 sprites, 2xOKI (sfx 1MHz + music), 320x240@58Hz, xBGR555;
# oki-music bitswap is common. Per-family deltas live in the [header] registers below.
# joemacr (+2 clones)  DE-0491-1 DECO;   blk @0x10xxxx; tiles 1MB, spr 1MB; music 2MHz
# chainrec             DECO;             blk @0x40xxxx; tiles 1MB, spr 2MB; music 2MHz; 4-way joy
#   magdrop/magdropp   DECO clone maps;  blk @0x38xxxx / @0x68xxxx
# charlien             Mitchell MT5601-0; blk @0x18xxxx; tiles 2MB, spr 2MB; music 1MHz; no eeprom dump
# prtytime (+gangonta) Mitchell, ROT90;  blk @0x18xxxx; tiles 2MB, spr 8MB; music 1MHz
# osman (+candance)    Mitchell;         blk @0x18xxxx; tiles 2MB, spr 8MB; clones differ in EEPROM only
# hvysmsh (+2 clones)  DECO (deco156.cpp); scattered map; tiles 2MB (ROM_CONTINUE), spr 8MB region
#                      (4MB dumped); pal xBGR888 32-bit; sfx OKI 512KB banked; music 2MHz, NO bitswap
# sets without an available dump:
skip.setnames=[
    "joemacrj",   # its own 1MB tile ROM (mbn00, crc 11b2dac7) is not in the collection
]
skip.machines=[
    "wcvol95",    # deco156.cpp but YMZ280B sound + own map: different hardware class
]

[header]
# cninja pattern: ONE-HOT family bits only - the per-family address decode and
# behaviour flags live in jtosman_main/jtosman_game muxes, not in the MRA.
# All-zero = Mitchell MT5601-0 map (osman, candance, prtytime, gangonta).
# cn only widens the sprite-interleave decode (charlien map IS the Mitchell one).
registers=[
    { name="jm",  pos="0[0]", desc="Joe & Mac Returns",  values=[{ machine="joemacr",  value=1 }] },
    { name="cr",  pos="0[1]", desc="Chain Reaction",     values=[{ setname="chainrec", value=1 }] },
    { name="md",  pos="0[2]", desc="Magical Drop",       values=[{ setname="magdrop",  value=1 }] },
    { name="mdp", pos="0[3]", desc="Magical Drop Plus",  values=[{ setname="magdropp", value=1 }] },
    { name="cn",  pos="0[4]", desc="Charlie Ninja",      values=[{ machine="charlien", value=1 }] },
    { name="hv",  pos="0[5]", desc="Heavy Smash",        values=[{ machine="hvysmsh",  value=1 }] },
]

[buttons]
# osman is a Strider-like action game, 3 buttons (EEPROM is fixed to 3-button). TODO confirm names.
Names = [ { machine="osman", names="Attack,Jump,Special" },
          { machine="hvysmsh", names="Shot,Jump,Special" } ]

[ROM]
regions = [
    { name="maincpu",  width=32, reverse=true },                         # ARM DE156, deco156-encrypted
    # ---- tiles (deco56-encrypted, decrypt-at-fetch). RAW load for now — boot doesn't fetch gfx.
    # TODO(video step): ROM_CONTINUE reorder (blk0->0,blk1->0x100000,blk2->0x080000,blk3->0x180000)
    # + 4bpp RGN_FRAC(1,2) plane split, byte-checked (never hand-derive).
    { name="tiles",    start="JTFRAME_BA1_START", No_offset=true },
    # ---- sprites (8 MB, 4bpp RGN_FRAC(1,2), NOT encrypted). MAME loads mcf-01..04 reversed
    # (@0x600000/0x400000/0x200000/0x000000). Plane-pair pack for jtframe_decospr = TODO byte-check
    # (cninja darkseal/supbtime pattern: load straight + game.v plane-pair rotate, OR width=32 parts).
    { name="sprites",  start="JTFRAME_BA3_START", No_offset=true },
    { name="okisfx",   rename="oki1", start="PCM1_START", No_offset=true },   # OKI #1 SFX 256 KB (512 KB slot)
    { name="okimusic", rename="oki2", start="PCM2_START", No_offset=true },   # OKI #2 music 2 MB (addr-bitswap+bank in download)
    # hvysmsh names its OKI regions oki1/oki2 directly (sfx 512 KB banked; music raw)
    { name="oki1", machine="hvysmsh", start="PCM1_START", No_offset=true },
    { name="oki2", machine="hvysmsh", start="PCM2_START", No_offset=true },
    { name="eeprom" },                                                        # 93C46 defaults (candance differs here)
    { name="plds",     skip=true },
]

order = [ "maincpu", "tiles", "oki1", "oki2", "sprites" ]
