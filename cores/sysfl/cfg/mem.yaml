# System FL memory map, cps3-style cache lanes on a dual-chip SDRAM
# chip 0: main+data (b0) | C75 data (b1) | C352 PCM (b2) | obj gfx (b3)
# chip 1: woven ROZ (b0, raw streams below the window) | woven scroll (b1)
#         | work RAM (b2, no download)
download:
  pre_addr: true   # weaves the raw ROZ/scroll texel+mask streams into 8-byte units
clocks:
  clk:
    # i960KA-20 at 48*5/12 = 20 MHz, minimum 2-clock cen spacing. The C75
    # handshake needs the main loop to iterate several times per frame:
    # check CPUSTAT idle time if this ever changes
    - mul: 5
      div: 12
      outputs:
        - cpu_cen
    # PCB clocks are 48.384 MHz divisions, applied to the stock 48 MHz base
    - mul: 1
      div: 3               # C75 XIN (timers, ADC)
      outputs:
        - xin_cen
    - mul: 1
      div: 2               # C352
      outputs:
        - c352_cen
sdram:
  cache-lanes:
    # one coherent rw lane serves both work-RAM views (16-bit funnel and
    # 32-bit code fetches); write-back caching makes split lanes unsafe
    - name: wram
      data_width: 32
      rw: true
      blocks: { count: 128, size: 32 }
      at: { chip: 1, bank: 2, length: 2MB }
    - name: main
      data_width: 32
      blocks: { count: 64, size: 32 }
      at: { chip: 0, bank: 0, length: 4MB }
    - name: mcurom  # C75 external data ROM (se1_spr), own bank for latency
      data_width: 16
      blocks: { count: 64, size: 16 }
      at: { chip: 0, bank: 1, length: 512kB }
    - name: objrom
      data_width: 32
      blocks: { count: 128, size: 32 }
      at: { chip: 0, bank: 3, length: 8MB }
    - name: roz   # 8-byte woven units: 4 texels + 2 mask bytes + pad
      data_width: 64
      blocks: { count: 16, size: 16 }
      at: { chip: 1, bank: 0, length: 4MB }
    - name: scr   # 16-byte woven tile row: both col[2] half-units
      data_width: 128
      blocks: { count: 256, size: 64 } # 4 tile rows/block, a full line survives
      at: { chip: 1, bank: 1, length: 8MB }
    - name: pcm
      data_width: 8
      blocks: { count: 128, size: 16 }
      at: { chip: 0, bank: 2, length: 4MB }
bram:
  - name: backup    # 8kB backup memory (game nvram), saved/restored on the SD card
    addr_width: 13
    data_width: 16
    rw: true
    ioctl: { save: true, restore: true, order: 0 }
  - name: vram      # 123 tilemaps, 64kB. Primary port: video read
    addr_width: 16
    data_width: 16
    simfile: {}
    ioctl: { save: true, order: 1 }
    dual_port:
      name: cvram   # CPU side
      rw: true
      din:  cvram_din
      dout: cvram_dout
      we:   cvram_we
  - name: rozram    # C169 tilemap + scanline records, 128kB
    addr_width: 17
    data_width: 16
    simfile: {}
    ioctl: { save: true, order: 2 }
    dual_port:
      name: crozram
      rw: true
      din:  crozram_din
      dout: crozram_dout
      we:   crozram_we
  - name: oram      # C355 sprite tables, 128kB
    addr_width: 17
    data_width: 16
    rw: true        # vblank DMA snapshots the placement tables into page 1
    din:  oram_din
    we:   oram_we
    simfile: {}
    ioctl: { save: true, order: 3 }
    dual_port:
      name: coram
      rw: true
      din:  coram_din
      dout: coram_dout
      we:   coram_we
  - name: rpal      # C116 palette RAMs, 8kB each. Primary port: video read
    addr_width: 13
    data_width: 8
    simfile: {}
    ioctl: { save: true, order: 4 }
    dual_port:
      name: cr_pal  # written by the C116 CPU interface
      rw: true
      addr: pal_waddr
      din:  pal_wdin
      we:   rpal_we
      dout: rpal_cdout
  - name: gpal
    addr_width: 13
    data_width: 8
    simfile: {}
    ioctl: { save: true, order: 5 }
    dual_port:
      name: cg_pal
      rw: true
      addr: pal_waddr
      din:  pal_wdin
      we:   gpal_we
      dout: gpal_cdout
  - name: bpal
    addr_width: 13
    data_width: 8
    simfile: {}
    ioctl: { save: true, order: 6 }
    dual_port:
      name: cb_pal
      rw: true
      addr: pal_waddr
      din:  pal_wdin
      we:   bpal_we
      dout: bpal_cdout
  - name: share     # 32kB CPU-C75 shared RAM at 0x30284000
    addr_width: 15
    data_width: 16
    rw: true
    dual_port:
      name: mcu     # C75 (stub) side
      rw: true
      din:  mcu_din
      dout: mcu_dout
      we:   mcu_we
  - name: c75bios   # C75 internal 16kB mask ROM (c75.bin, namcoc75.zip device set)
    addr_width: 14
    data_width: 16
    rom: { offset: "(`C75BIOS_START)>>1" }
