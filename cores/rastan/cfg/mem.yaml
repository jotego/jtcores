params:
  - { name:  RAM_OFFSET, value: "22'h10_0000" }
  - { name: VRAM_OFFSET, value: "22'h11_0000" }
  - { name:  PCM_OFFSET, value: "(`PCM_START-`JTFRAME_BA1_START)>>1"}
clocks:
  clk:
    - freq: 4 MHz
      outputs:
        - fm_cen
    - freq: 384 kHz
      outputs:
        - pcm_cen
    - freq: 192 kHz
      outputs:
        - fir_cen
    - freq: 12 MHz
      outputs:
        - cchip_cen
sdram:
  banks:
    - buses:
      - name: ram
        addr_width: 18
        data_width: 16
        cs: xram_cs
        din: main_dout
        rw: true
        offset: RAM_OFFSET
      - name: main
        addr_width: 19
        data_width: 16
      - name: scr0ram
        addr_width: 16
        data_width: 32
        offset: VRAM_OFFSET
      - name: scr1ram
        addr_width: 16
        data_width: 32
        offset: VRAM_OFFSET
    - buses:
      - name: snd
        addr_width: 16
        data_width: 8
      - name: pcm0
        addr_width: 19
        data_width: 8
        offset: PCM_OFFSET
      - name: pcm1
        addr_width: 19
        data_width: 8
        offset: PCM_OFFSET
    - buses:
      - name: scr0rom
        addr_width: 20
        data_width: 32
      - name: scr1rom
        addr_width: 20
        data_width: 32
    - buses:
      - name: orom
        addr_width: 20
        data_width: 32
bram:
  - { name: cchip_mask,  addr_width: 12, data_width: 8, prom: true }
  - { name: cchip_eprom, addr_width: 13, data_width: 8, prom: true }
