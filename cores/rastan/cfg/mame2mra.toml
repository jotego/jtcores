[global]
author=["jotego"]

zip.alt="cchip.zip"

[parse]
sourcefile=[ "rastan.cpp", "opwolf.cpp", "rbisland.cpp" ]

[parse.skip]
# opwolfb is the Bear Corp bootleg: it replaces the C-chip with an extra Z80
# (different hardware), so it stays unsupported for now.
# jumping* are Rainbow Islands bootlegs: extra Z80 for sound, relocated sprite
# RAM and no C-chip (different hardware), so they stay unsupported for now.
setnames=[ "opwolfb", "jumping", "jumpinga", "jumpingi" ]

[buttons]
names=[
    { machine="rastan",  names="Slash,Jump" },
    { machine="opwolf", names="Bullet,Grenade" },
    { machine="rbisland", names="Rainbow,Jump" },
]

# Registers generate cores/rastan/hdl/jtrastan_header.v (named, latched outputs)
# and set the per-set header bytes. Gun offsets are signed 8-bit, computed per set
# the way MAME's init_opwolf does (X = 0x101-rom[0x3ffb0], Y = 0x1f8-rom[0x3ffae]);
# opwolfp reproduces the prototype's fixed +26/-6.
[header]
registers=[
    { name="rastan",    pos="0[0]",   desc="Rastan hardware",         values=[{ machine="rastan", value=1 }] },
    { name="opwolf",    pos="0[1]",   desc="Operation Wolf hardware", values=[{ setnames=["opwolfp","opwolf","opwolfa","opwolfj","opwolfjsc","opwolfu"], value=1 }] },
    { name="rbisland",  pos="0[2]",   desc="Rainbow Islands",         values=[{ setnames=["rbisland","rbislando","rbislande"], value=1 }] },
    { name="cchip",     pos="0[3]",   desc="C-chip present",          values=[{ setnames=["opwolf","opwolfa","opwolfj","opwolfjsc","opwolfu"], value=1 }, { setnames=["rbisland","rbislando","rbislande"], value=1 }] },
    { name="gun_xoff8", pos="1[7:0]", desc="Light-gun X offset (signed)", values=[{ setname="opwolfp", value=0x1A }, { setnames=["opwolf","opwolfa"], value=0x11 }, { setnames=["opwolfj","opwolfjsc"], value=0x15 }, { setname="opwolfu", value=0x15 }] },
    { name="gun_yoff8", pos="2[7:0]", desc="Light-gun Y offset (signed)", values=[{ setname="opwolfp", value=0xFE }, { setnames=["opwolf","opwolfa"], value=0xF4 }, { setnames=["opwolfj","opwolfjsc"], value=0xFC }, { setname="opwolfu", value=0xE0 }] },
]

[dipsw]
delete=[{names=["Unused","Unknown"]}]
rename=[
    {name="Bonus Life", to="1PUP" },
    {name="Discount When Continuing", to="Continue discount" },
    {name="Display Hit Percentage (Cheat)", to="Hit Percentage Cheat" },
]

[ROM]
# values starting with $ refer to macro definitions in the .def file
# or arguments passed to mame2mra
regions = [
    { name="maincpu", width=16, reverse=true, no_offset=true },
    { name="audiocpu", start="JTFRAME_BA1_START" },
    { name="adpcm", start="PCM_START"    },
    { name="pc080sn", start="JTFRAME_BA2_START", width=16, no_offset=true  },
    { name="pc090oj", start="JTFRAME_BA3_START", width=16, no_offset=true  },
    { name="pc080sn", setnames=["rbisland","rbislando","rbislande"], start="JTFRAME_BA2_START", width=16, reverse=true },
    { name="pc090oj", setnames=["rbisland","rbislando","rbislande"], start="JTFRAME_BA3_START", width=16, reverse=true, overrules=[
        { names=[ "b22-13.6", "b22-12.7" ], reverse=false },
    ] },
    # mask ROM is a device/BIOS ROM (cchip.zip) not in the per-machine dump, so it requires special handling.
    { name="cchip_bios", setnames=["opwolf","opwolfa","opwolfj","opwolfjsc","opwolfu","rbisland","rbislando","rbislande"], start="JTFRAME_PROM_START", rom_len=0x1000, files=[ { name="cchip_upd78c11.bin", crc="43021521", size=0x1000 } ] },
    { name="cchip:cchip_eprom", rename="cchip_eprom", rom_len=0x2000 }
]

order = [
    "maincpu", "audiocpu", "adpcm", "pc080sn", "pc090oj",
    "cchip_bios", "cchip_eprom"
]
