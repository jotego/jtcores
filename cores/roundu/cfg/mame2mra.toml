[global]
author=["Andrea Bogazzi"]

[parse]
sourcefile=["roundup5.cpp"]
main_setnames=["roundup5"]

[parse.mustbe]
machines=["roundup5"]

[buttons]
names=[{ names="Accelerator,Brake,Shift,Turbo" }]

[dipsw]
bitcnt=24
offset=[
    { name="DSW", value=0 },
    { name="IN1", value=16 },
]
# MAME exports PORT_SERVICE as a plain input, not a dipswitch
extra = [
    { machine="roundup5", name="Service Mode", bits="16", Options="On,Off" },
]

[ROM]
regions=[
    { name="master_rom", width=16, len=0x80000 },
    { name="slave_rom", start="SLAVE_START", width=16, len=0x80000 },
    { name="sprites:sprites_l", rename="sprites" },
    { name="sprites:sprites_h", rename="sprites" },
    { name="sprites", machine="roundup5", start="JTFRAME_BA1_START", width=64, len=0x180000, parts=[
        { name="ru-00b", crc="388a0647", offset=0x00000, length=0x10000, map="00000001" },
        { name="ru-02b", crc="eff33945", offset=0x00000, length=0x10000, map="00000010" },
