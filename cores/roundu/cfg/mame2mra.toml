        { name="ru-12b", crc="ca63b1f8", offset=0x00000, length=0x10000, map="01000000" },
        { name="ru-14b", crc="dde79bfc", offset=0x00000, length=0x10000, map="10000000" },
        { name="ru-00b", crc="388a0647", offset=0x10000, length=0x10000, map="00000001" },
