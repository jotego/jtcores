[global]
author=["aCORES"]

[parse]
sourcefile=[ "docastle.cpp" ]

# parents is deliberately left unset: any clone of one of these sets would also
# live in docastle.cpp, so jtframe derives the grouping from mame.xml directly.
# parents=[] only matters when a parent set lives outside the selected
# sourcefile.
skip.Bootlegs=true

[dipsw]
# The DIP tables themselves come from MAME's own PORT_DIPNAME data.
#
#  - defaults: the per-set factory DSW bytes, byte order dsw1,dsw2 (LSB first).
#  - rename: two MAME option names exceed MiSTer's OSD line width; shortened
#    without losing meaning.
defaults=[
	{ machine="docastle", value="df,ff" },
	{ machine="douni",    value="df,ff" },
	{ machine="dorunrun", value="df,ff" },
	{ machine="dowild",   value="df,ff" },
	{ machine="jjack",    value="df,ff" },
	{ machine="kickridr", value="df,ff" },
	{ machine="spiero",   value="df,ff" },
	{ machine="idsoccer", value="ff,ff" },
	{ machine="asoccer",  value="ff,ff" },
]
rename=[
	{ name="Bonus Credit for Diamond", to="Diamond Bonus" },
	{ name="Difficulty of EXTRA", to="EXTRA Difficulty" },
]

[header]
# ---------------------------------------------------------------------------
# JTFRAME_HEADER=8 (cfg/macros.def) prepends an 8-byte header to the main ROM
# file at MRA-build time. jtdcastl_game captures byte 0 of that header into
# its game_id/game_id_ok pair via `header && prog_we && prog_addr[2:0]==3'd0`
# and feeds game_id into jtdcastl_profile, which decodes it into the per-set
# hardware profile. This section is the producing end of that wiring.
#
# byte 0: game ID, 0x00-0x08, one value per set. It must match
#         jtdcastl_profile's case statement:
#           0x00 Mr. Do's Castle (docastle)     -- native_vertical
#           0x01 Mr. Do! vs. Unicorns (douni)   -- native_vertical
#           0x02 Do! Run Run (dorunrun)         -- PROFILE_RUNRUN, low_pen_priority
#           0x03 Mr. Do's Wild Ride (dowild)    -- PROFILE_RUNRUN, low_pen_priority
#           0x04 Jumping Jack (jjack)           -- PROFILE_RUNRUN, low_pen_priority, native_vertical
#           0x05 Kick Rider (kickridr)          -- PROFILE_RUNRUN, low_pen_priority
#           0x06 Super Pierrot (spiero)         -- PROFILE_RUNRUN, low_pen_priority
#           0x07 Indoor Soccer (idsoccer)       -- PROFILE_SOCCER, low_pen_priority, soccer_sprites, has_adpcm, has_joys2
#           0x08 American Soccer (asoccer)      -- PROFILE_SOCCER, low_pen_priority, soccer_sprites, has_adpcm, has_joys2
#         (0x09 exists in the profile decoder as a spare RunRun-profile slot but
#         is not used by any of these 9 sets and is not assigned here.)
# bytes 1-7: unused/reserved, left at the `fill` value.
info="""
	byte 0: game ID / profile select, see hdl/jtdcastl_profile.v's case
	        statement (0x00 docastle, 0x01 douni, 0x02 dorunrun, 0x03 dowild,
	        0x04 jjack, 0x05 kickridr, 0x06 spiero, 0x07 idsoccer, 0x08 asoccer)
	bytes 1-7: unused, reserved
"""
# fill=0xff, not 0x00: game_id 0x00 is a valid id (Mr. Do's Castle) in
# jtdcastl_profile's decoder, so filling unassigned bytes or machines with
# 0x00 would silently boot the wrong game. 0xff is not a valid id -- it falls
# into `default:`, which clears `valid` and holds the core in reset via
# `base_reset = rst | ~profile_valid | ~game_id_ok` in jtdcastl_game. That
# also covers any docastle.cpp machine that reaches the MRA generator without
# an explicit `data` entry below: it is held in reset rather than booting as
# Mr. Do's Castle.
fill=0xff
data = [
	{ machine="docastle", offset=0, data="00" },
	{ machine="douni",    offset=0, data="01" },
	{ machine="dorunrun", offset=0, data="02" },
	{ machine="dowild",   offset=0, data="03" },
	{ machine="jjack",    offset=0, data="04" },
	{ machine="kickridr", offset=0, data="05" },
	{ machine="spiero",   offset=0, data="06" },
	{ machine="idsoccer", offset=0, data="07" },
	{ machine="asoccer",  offset=0, data="08" },
]

[buttons]
# JTFRAME_BUTTONS=2 (macros.def) is fixed core-wide: the main CPU decodes two
# action-button lines per player on every one of the 9 games. The seven
# non-soccer games only make documented use of the first, so the second gets a
# generic "Button 2" name rather than dropping below the expected name count.
names=[
	{ machine="docastle", names="Hammer,Button 2" },
	{ machine="douni",    names="Hammer,Button 2" },
	{ machine="dorunrun", names="Throw,Button 2" },
	{ machine="spiero",   names="Throw,Button 2" },
	{ machine="dowild",   names="Speed,Button 2" },
	{ machine="jjack",    names="Action,Button 2" },
	{ machine="kickridr", names="Accelerate,Button 2" },
	{ machine="idsoccer", names="Kick,Change Player" },
	{ machine="asoccer",  names="Kick,Change Player" },
]

[ROM]
# 7 regions, ordered and anchored to match cfg/mem.yaml's bank grouping: ba0
# groups main+sub+adpcm via the SUB_START/ADPCM_START offsets; ba1=gfx1 at
# JTFRAME_BA1_START; ba2=gfx2 at JTFRAME_BA2_START; spritecpu and proms (cprom)
# are the two BRAM regions, anchored at JTFRAME_PROM_START and
# JTFRAME_PROM2_START. Every non-first region needs its own distinct start
# macro, so the two BRAM regions cannot share one.
#
# "adpcm" is a MAME ROM_REGION only on idsoccer/asoccer (Soccer profile). No
# per-machine restriction is written for it: no other machine defines the region
# at all, so it is simply absent from their ROM lists.
#
# All widths are 8-bit, straight linear byte concatenation -- there is no
# odd/even interleave anywhere in this ROM layout, so no width=16 or sequence=
# overrides are needed.
regions = [
	{ name="maincpu" },
	{ name="subcpu",    start="SUB_START" },
	{ name="adpcm",     start="ADPCM_START" },  # idsoccer, asoccer only
	{ name="gfx1",      start="JTFRAME_BA1_START" },
	{ name="gfx2",      start="JTFRAME_BA2_START" },
	{ name="spritecpu", start="JTFRAME_PROM_START" },
	{ name="proms",     start="JTFRAME_PROM2_START" },
]

order = [ "maincpu", "subcpu", "adpcm", "gfx1", "gfx2", "spritecpu", "proms" ]
