[global]
# "aCORES" is the project/contributor identifier used for this port; no
# individual porting author is documented in this repo (README.md Credits
# only names the upstream MiSTer Universal_DoCastle core and jt89/jt5205
# authorship, and git history on this branch carries a single generic
# committer identity). Left as-is pending jotego's guidance on his preferred
# author-attribution convention -- other cores in this repo use both real
# names (e.g. "jotego", "Andrea Bogazzi") and this kind of project handle.
author=["aCORES"]

[parse]
sourcefile=[ "docastle.cpp" ]

# parents is deliberately left unset: any clone of one of these sets would also
# live in docastle.cpp, so jtframe derives the grouping from mame.xml directly.
# parents=[] only matters when a parent set lives outside the selected
# sourcefile.
#
# main_setnames: douni, spiero and asoccer are clones (of docastle, dorunrun
# and idsoccer respectively) in mame.xml, so without this they are treated as
# "just a clone" of their parent and skipped instead of being generated as
# their own top-level release. All three are curated sets in their own right
# and need their own MRA.
main_setnames=["douni","spiero","asoccer"]

# skip.Setnames: the remaining docastle.cpp clones are NOT curated sets. They
# are explicitly skipped here -- this is not "safe by construction" because of
# how sourcefile grouping works; nothing about parsing docastle.cpp alone
# would exclude them. None of these 7 has header/profile data assigned below,
# so if doc/mame.xml ever gains fuller coverage of docastle.cpp and one of
# them stopped being skipped, jtframe mra would emit an MRA for it whose
# header byte 0 falls through to `fill` (0xff), an invalid game_id that holds
# the core in permanent reset (see [header] below). Listing them here avoids
# ever reaching that state.
skip.Setnames=["docastle2","docastleo","dorunrun2","dorunrunc","dorunrunca","idsoccera","idsoccert"]
skip.Bootlegs=true

[dipsw]
# The DIP tables themselves come from MAME's own PORT_DIPNAME data.
#
#  - defaults: the per-set factory DSW bytes, byte order dsw1,dsw2 (LSB first).
#  - rename: two MAME option names exceed MiSTer's OSD line width; shortened
#    without losing meaning.
defaults=[
	{ machine="docastle", value="df,ff" },
	{ machine="douni",    value="df,ff" },
	{ machine="dorunrun", value="df,ff" },
	{ machine="dowild",   value="df,ff" },
	{ machine="jjack",    value="df,ff" },
	{ machine="kickridr", value="df,ff" },
	{ machine="spiero",   value="df,ff" },
	{ machine="idsoccer", value="ff,ff" },
	{ machine="asoccer",  value="ff,ff" },
]
rename=[
	{ name="Bonus Credit for Diamond", to="Diamond Bonus" },
	{ name="Difficulty of EXTRA", to="EXTRA Difficulty" },
]

[header]
# ---------------------------------------------------------------------------
# JTFRAME_HEADER=8 (cfg/macros.def) prepends an 8-byte header to the main ROM
# file at MRA-build time. `registers` below makes jtframe mra generate
# jtdcastl_header.v (see modules/jtframe/hdl/inc/header.v), a small module
# that latches the game_id field out of the download stream as it goes by
# (`header && prog_we && prog_addr==<offset>`) and exposes it as a `game_id`
# output. jtdcastl_game instantiates jtdcastl_header and feeds its game_id
# output into jtdcastl_profile, which decodes it into the per-set hardware
# profile. This section is the producing end of that wiring; the game_id
# register/module replaces the old hand-rolled capture that used to live
# directly in jtdcastl_game.
#
# byte 0, bits [3:0]: game ID, 0x0-0x8, one value per set. It must match
#         jtdcastl_profile's case statement:
#           0x00 Mr. Do's Castle (docastle)     -- native_vertical
#           0x01 Mr. Do! vs. Unicorns (douni)   -- native_vertical
#           0x02 Do! Run Run (dorunrun)         -- PROFILE_RUNRUN, low_pen_priority
#           0x03 Mr. Do's Wild Ride (dowild)    -- PROFILE_RUNRUN, low_pen_priority
#           0x04 Jumping Jack (jjack)           -- PROFILE_RUNRUN, low_pen_priority, native_vertical
#           0x05 Kick Rider (kickridr)          -- PROFILE_RUNRUN, low_pen_priority
#           0x06 Super Pierrot (spiero)         -- PROFILE_RUNRUN, low_pen_priority
#           0x07 Indoor Soccer (idsoccer)       -- PROFILE_SOCCER, low_pen_priority, soccer_sprites, has_adpcm, has_joys2
#           0x08 American Soccer (asoccer)      -- PROFILE_SOCCER, low_pen_priority, soccer_sprites, has_adpcm, has_joys2
#         (0x09 exists in the profile decoder as a spare RunRun-profile slot but
#         is not used by any of these 9 sets and is not assigned here.)
# No value= entry is given for the 7 skip.Setnames clones above (docastle2,
# docastleo, dorunrun2, dorunrunc, dorunrunca, idsoccera, idsoccert): they
# must never resolve to a valid game_id, on top of being skipped outright.
# byte 0 bits [7:4] and bytes 1-7: unused/reserved, left at the `fill` value.
info="""
	byte 0[3:0]: game ID / profile select, see hdl/jtdcastl_profile.v's case
	        statement (0x0 docastle, 0x1 douni, 0x2 dorunrun, 0x3 dowild,
	        0x4 jjack, 0x5 kickridr, 0x6 spiero, 0x7 idsoccer, 0x8 asoccer)
	byte 0[7:4], bytes 1-7: unused, reserved
"""
# fill=0xff, not 0x00: game_id 0x0 is a valid id (Mr. Do's Castle) in
# jtdcastl_profile's decoder, so filling unassigned bytes or machines with
# 0x00 would silently boot the wrong game. 0xff is not a valid id in bits
# [3:0] (0xf) -- it falls into `default:`, which clears `valid` and holds the
# core in reset via `base_reset = rst | ~profile_valid | ~game_id_ok` in
# jtdcastl_game. That also covers any docastle.cpp machine that reaches the
# MRA generator without an explicit `values` match below: its game_id byte
# stays at the `fill` value (0xff, low nibble 0xf), so it is held in reset
# rather than booting as Mr. Do's Castle.
fill=0xff
registers = [
	{ name="game_id", pos="0[3:0]", desc="Game ID / profile select", values=[
		{ machine="docastle", value=0x00 },
		{ setname="douni",    value=0x01 },
		{ machine="dorunrun", value=0x02 },
		{ machine="dowild",   value=0x03 },
		{ machine="jjack",    value=0x04 },
		{ machine="kickridr", value=0x05 },
		{ setname="spiero",   value=0x06 },
		{ machine="idsoccer", value=0x07 },
		{ setname="asoccer",  value=0x08 },
	] },
]

[buttons]
# JTFRAME_BUTTONS=2 (macros.def) is fixed core-wide: the main CPU decodes two
# action-button lines per player on every one of the 9 games. The seven
# non-soccer games only make documented use of the first, so the second gets a
# generic "Button 2" name rather than dropping below the expected name count.
names=[
	{ machine="docastle", names="Hammer,Button 2" },
	{ machine="douni",    names="Hammer,Button 2" },
	{ machine="dorunrun", names="Throw,Button 2" },
	{ machine="spiero",   names="Throw,Button 2" },
	{ machine="dowild",   names="Speed,Button 2" },
	{ machine="jjack",    names="Action,Button 2" },
	{ machine="kickridr", names="Accelerate,Button 2" },
	{ machine="idsoccer", names="Kick,Change Player" },
	{ machine="asoccer",  names="Kick,Change Player" },
]

[ROM]
# 7 regions, ordered and anchored to match cfg/mem.yaml's bank grouping: ba0
# groups main+sub+adpcm via the SUB_START/ADPCM_START offsets; gfx2 is the
# SDRAM region, at JTFRAME_BA1_START (SDRAM bank 1); gfx1 is BRAM, anchored at
# JTFRAME_PROM_START, not SDRAM -- spritecpu and proms (cprom) are the other
# two BRAM regions, anchored at JTFRAME_PROM2_START and JTFRAME_PROM3_START.
# Every non-first region needs its own distinct start macro, so the three
# BRAM regions cannot share one.
#
# "adpcm" is a MAME ROM_REGION only on idsoccer/asoccer (Soccer profile). No
# per-machine restriction is written for it: no other machine defines the region
# at all, so it is simply absent from their ROM lists.
#
# All widths are 8-bit, straight linear byte concatenation -- there is no
# odd/even interleave anywhere in this ROM layout, so no width=16 or sequence=
# overrides are needed.
regions = [
	{ name="maincpu" },
	{ name="subcpu",    start="SUB_START" },
	{ name="adpcm",     start="ADPCM_START" },  # idsoccer, asoccer only
	{ name="gfx2",      start="JTFRAME_BA1_START" },
	{ name="gfx1",      start="JTFRAME_PROM_START" },
	{ name="spritecpu", start="JTFRAME_PROM2_START" },
	{ name="proms",     start="JTFRAME_PROM3_START" },
]

order = [ "maincpu", "subcpu", "adpcm", "gfx2", "gfx1", "spritecpu", "proms" ]
