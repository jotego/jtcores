[global]
author=["Andrea Bogazzi"]

[parse]
sourcefile=["seicross.cpp"]
main_setnames=["seicross","sectrzont","friskyt","radrad"]

[parse.mustbe]
machines=["seicross","friskyt","radrad"]

[header]
data=[
    { setnames=["seicross","seicrossa","sectrzon","sectrzona"], data="01" },
    { setname="sectrzont", data="00" },
    { setnames=["friskyt","friskyta"], data="03" },
    { setname="friskytb", data="02" },
    { setnames=["radrad","radradj"], data="05" },
]

[buttons]
names=[
    { machine="seicross", names="Fire" },
    { machine="friskyt", names="-,-", map="--" },
    { machine="radrad", names="Fire,Jump" },
]

[dipsw]
bitcnt=32
offset=[
    { name="DSW1", value=0 },
    { name="DSW2", value=8 },
    { name="DSW3", value=16 },
    { name="TEST", value=24 },
    { name="IN1", value=24 },
    { name="DEBUG", value=24 },
]

