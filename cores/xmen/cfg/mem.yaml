params:
  - { name: PCM_OFFSET,   value: "22'h020000>>1" }
clocks:
  clk48:
    - freq: 16M
      outputs:
        - cen_16
        - cen_8
        - cen_4   # cen_fm
        - cen_2   # cen_fm2
    - freq: 18432k
      gate: [pcm]
      outputs:
        - cen_pcm
audio:
  gain: 1.99
  channels:
    - { name: k539,   module: jt054539, rsum: 1k, rc: [ { r: 4.7k, c: 2.2n } ] }
sdram:
  banks:
    - buses:
        - name: main
          addr_width: 20
          data_width: 16
    - buses:
        - name: snd
          addr_width: 17
          data_width: 8
        - name: pcm
          addr_width: 21
          data_width: 8
          offset: PCM_OFFSET
    - buses:
        - name: lyrf
          addr_width: 21
          data_width: 32
        - name: lyra
          addr_width: 21
          data_width: 32
        - name: lyrb
          addr_width: 21
          data_width: 32
    - buses:
        - name: lyro
          addr_width: 22
          data_width: 32
bram:
  # Main CPU work RAM
  - name: ram
    addr_width: 14
    data_width: 16
    rw: true
    addr: main_addr[13:1]
    din: ram_din
    dout: ram_data
  # EEROM
  - name: nvram
    addr_width: 7
    data_width: 8
    simfile: {}

    rw: true
    ioctl: { save: true, restore: true, order: 0 }
