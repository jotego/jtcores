nemesis:
  - get:
      - jtnemesis_game.v
      - nemesis_main.v
      - nemesis_sound.v
      - nemesis_jt49_exp.v
      - nemesis_68k_addr_dec.v
      - nemesis_sound_debug.v
      - nemesis_rom_debug.v
jtframe:
  - get:
      - jtframe_ff.v
  - from: clocking
    get:
      - jtframe_frac_cen.v
  - from: cpu
    get:
      - T80.yaml
      - jtframe_z80wait.v
  - from: ram
    get:
      - jtframe_ram.v
      - jtframe_dual_ram.v
      - jtframe_prom.v
  - from: sdram
    get:
      - jtframe_dwnld.v
  - from: video
    get:
      - jtframe_blank.v
  - from: video
    when: [ NOVIDEO ]
    get:
      - jtframe_vtimer.v

