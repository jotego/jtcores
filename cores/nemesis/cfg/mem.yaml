params:
  # SDRAM addresses 16-bit words, but ioctl sends bytes,
  # so we need to divide the offsets by 2
  - { name: SND_OFFSET,  value: "(`SND_START)>>1" }

download:
  pre_addr: false
  post_addr: false
  post_data: false

sdram:
  banks:
    - buses:
      - name: main
        # we have 17 pre-mem.yaml, but if we put 17 it becomes 16 (?)
        # but in the MRA, it says "length 0x40000 (18 bits)", so OK
        addr_width: 18
        data_width: 16
      - name: audio
        addr_width: 14
        data_width: 8
        offset: SND_OFFSET
