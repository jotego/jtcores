[global]
author=[ "LMN-san", "OScherler", "Raki" ]
webpage="https://gx400-friends.github.io/"
twitter="-"

[parse]
sourcefile=[ "nemesis.cpp" ]
mustbe.machines=[ "nemesis", "konamigt" ]
skip.setnames=[ "gradius", "rf2" ]
 
[buttons]
names=[
    { setname="konamigt", names="Accelerator,Brake,Gear Shift", map="ABY" },
    { names="Option,Fire,Bomb", map="YBA" },
]

[header]
fill=0
registers=[
    { name="konamigt", pos="0[0]", values=[{ setname="konamigt", value=1 }] },
]

[ROM]
regions=[
    # reverse=true: jtframe_dwnld byte-swaps on the way into SDRAM, so the MRA
    # must present the 16-bit words pre-swapped for the 68000 to read them back
    # big-endian. Without it the reset SSP loads as 0x0600F07F (odd) -> address
    # error -> double fault -> CPU halts after 12 bus cycles.
    { name="maincpu",  width=16, no_offset=true, reverse=true },
    { name="audiocpu", start="JTFRAME_BA1_START"  },
    { name="k005289",  start="JTFRAME_PROM_START" },
]

order=["maincpu", "audiocpu", "k005289"]
