clocks:
  clk24:
    - freq: 5M
      gate: [ main ]
      outputs: [ cpu ]
    - freq: 2500k
      outputs: [ fm ]

ports:
  - { name: cpu_addr, msb: 15, lsb: 0 }
  - { name: cpu_dout, msb: 7,  lsb: 0 }

audio:
  rsum: 1k
  channels:
    - { name: fm, module: jtopl2, rsum: 1k }

sdram:
  banks:
    - buses:
        - name: main
          addr_width: 16
          data_width: 8
    - buses:
        - name: scr
          addr_width: 16
          data_width: 32
    - buses:
        - name: objrom
          addr_width: 16
          data_width: 32

bram:
  # e000-e7ff work RAM, battery backed on the PCB
  - name: wram
    addr_width: 11
    data_width: 8
    addr: cpu_addr[10:0]
    din: cpu_dout
    rw: true
  # e800-ebff sprite RAM (mirrored at ec00-efff)
  - name: oram
    addr_width: 10
    data_width: 8
    addr: cpu_addr[9:0]
    din: cpu_dout
    rw: true
    simfile: {}
    dual_port:
      name: oscan
      dout: oscan_dout
  # f000-f3ff tile code
  - name: vram
    addr_width: 10
    data_width: 8
    addr: cpu_addr[9:0]
    din: cpu_dout
    rw: true
    simfile: {}
    dual_port:
      name: vscan
      dout: vscan_dout
  # f400-f7ff tile attributes: colour, hflip and code MSBs
  - name: cram
    addr_width: 10
    data_width: 8
    addr: cpu_addr[9:0]
    din: cpu_dout
    rw: true
    simfile: {}
    dual_port:
      name: cscan
      addr: vscan_addr
      dout: cscan_dout
  # Colour PROMs. Order must match the proms region in mame2mra.toml:
  # tdclr3=red, tdclr2=green, tdclr1=blue
  - { name: rpal, addr_width: 8, data_width: 4, addr: pen, prom: true }
  - { name: gpal, addr_width: 8, data_width: 4, addr: pen, prom: true }
  - { name: bpal, addr_width: 8, data_width: 4, addr: pen, prom: true }
