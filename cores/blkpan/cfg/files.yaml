nemsis:
  - get:
      - jtnemsis_gx400a_video.v
      - jtnemsis_gx400_priority_handler.v
      - jtnemsis_k5290.v
      - jtnemsis_k5291.v
      - jtnemsis_k5292.v
      - jtnemsis_k5293.v
      - jtnemsis_k5294.v
      - jtnemsis_k5295.v
      - jtnemsis_video_bram_if.v
      - jtnemsis_lmn74194_nbit.v
      - jtnemsis_os_pulse_gen.v

jtframe:
  - get:
      - jtframe_ff.v
  - from: ram
    get:
      - jtframe_ram.v
      - jtframe_dual_ram.v
      - jtframe_dual_ram16.v
  - from: video
    get:
      - jtframe_blank.v
  - from: cpu
    get:
      - jtframe_z80.yaml
  - from: cpu
    unless: [NOMAIN]
    get:
      - jtframe_m68k.yaml

