[global]
author=["jotego"]

[parse]
sourcefile=["88games.cpp"]

[buttons]
names=[
    { names="Left button,Centre button,Right button", map="YXA" },
]

[dipsw]
delete=[{names=["Unused","Unknown"]}]
rename=[{name="World Records", to="Records", values=["Keep","Erase"]}]

[ROM]
regions=[
    { name="maincpu" },
    { name="audiocpu", start="JTFRAME_BA1_START" },
    { name="upd1",     start="UPD1_START" },
    { name="upd2",     start="UPD2_START" },
    { name="k052109",  start="JTFRAME_BA2_START", width=32 },
    { name="k051960",  start="JTFRAME_BA3_START", width=32, reverse=true },
    { name="k051316",  start="PSAC_START" },
    { name="proms",    start="JTFRAME_PROM_START" },
]
order=["maincpu","audiocpu","upd1","upd2","k052109","k051960","k051316","proms"]
