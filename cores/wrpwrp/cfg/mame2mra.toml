[global]
author=["Andrea Bogazzi"]

[parse]
sourcefile=["warpwarp.cpp"]
mustbe.machines=["warpwarp", "bombbee", "cutieq"]

[header]
registers=[
    { name="paddle_board", pos="0[0]", values=[{ machines=["bombbee", "cutieq"], value=1 }], desc="Bomb Bee and Cutie Q board" },
]

[buttons]
names=[
    { machine="warpwarp", names="Fire" },
    { machines=["bombbee", "cutieq"], names="Serve" },
]

[ROM]
regions=[
    { name="maincpu", len=0x4000 },
    { name="gfx1" }
]
order=["maincpu", "gfx1"]
