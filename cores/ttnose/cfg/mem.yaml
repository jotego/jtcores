params:
  - { name: WORK_OFFSET, value: "`WORK_START>>1" }
  - { name: PCM_OFFSET, value: "(`PCM_START-`JTFRAME_BA3_START)>>1" }

clocks:
  clk:
    - freq: 5 MHz
      outputs: [snd_cen, snd2p5_cen, acia_cen]
    - freq: 8 MHz
      outputs: [fm_cen]

audio:
  channels: []

sdram:
  banks:
    - buses:
        - name: work
          addr_width: 14
          data_width: 16
          rw: true
          offset: WORK_OFFSET
        - name: main
          addr_width: 20
          data_width: 16
    - buses:
        - name: chars
          addr_width: 20
          data_width: 32
    - buses:
        - name: obj
          addr_width: 19
          data_width: 32
    - buses:
        - name: snd
          addr_width: 17
          data_width: 8
        - name: pcm
          addr_width: 17
          data_width: 8
          offset: PCM_OFFSET

bram:
  - name: rozgfx
    addr_width: 17
    data_width: 16
    rw: true
    din: main_dout
    dual_port: { name: rozg, dout: rozg_data }
    simfile: { big_endian: true }
  - name: oram
    addr_width: 12
    data_width: 16
    rw: true
    din: main_dout
    dual_port: { name: objr, dout: objr_data }
    simfile: { big_endian: true }
  - name: txram
    addr_width: 12
    data_width: 16
    rw: true
    din: main_dout
    dual_port: { name: txv, dout: txv_data }
    simfile: { big_endian: true }
  - name: pal
    addr_width: 12
    data_width: 16
    rw: true
    din: main_dout
    dual_port: { name: mix, dout: mix_data }
    simfile: { big_endian: true }
  - name: sram
    addr_width: 11
    data_width: 8
    rw: true
    din: snd_dout
