params:
  # offsets are relative to each SDRAM bank start and divided by two
  - { name: SND_OFFSET,  value: "`SND_START>>1" }
  - { name: PCMB_OFFSET, value: "(`PCMB_START-`JTFRAME_BA1_START)>>1" }

clocks:
  clk:
    - freq: 8 MHz
      outputs:
        - fm_cen
    - freq: 5 MHz
      outputs:
        - snd_cen

audio:
  channels:
    - { name: fm, data_width: 16, stereo: true, rsum: 10k }

sdram:
  banks:
    - buses:
      - name: main
        addr_width: 20
        data_width: 16
      - name: snd
        addr_width: 17
        data_width: 8
        offset: SND_OFFSET
    - buses:
      - name: pcma
        addr_width: 20
        data_width: 8
      - name: pcmb
        addr_width: 19
        data_width: 8
        offset: PCMB_OFFSET
    - buses:
      - name: scr0
        addr_width: 20
        data_width: 32
    - buses:
      - name: obj0
        addr_width: 22
        data_width: 32

bram:
  - name: ram
    addr_width: 16
    data_width: 16
    rw: true
    din: main_dout
  - name: vram
    addr_width: 12
    data_width: 16
    rw: true
    din: main_dout
    simfile: { big_endian: true }
    dual_port: { name: scr, dout: scr_vram }
  - name: rascr
    addr_width: 12
    data_width: 16
    rw: true
    din: main_dout
    simfile: { big_endian: true }
    dual_port: { name: ras, dout: ras_dout }
  - name: oram
    addr_width: 10
    data_width: 16
    rw: true
    din: main_dout
    simfile: { big_endian: true }
    dual_port: { name: objr, dout: objr_dout }
  - name: lut
    addr_width: 14
    data_width: 16
    rw: true
    din: main_dout
    simfile: { big_endian: true }
    dual_port: { name: objl, dout: objl_dout }
  - name: pal
    addr_width: 12
    data_width: 16
    rw: true
    din: main_dout
    simfile: { big_endian: true }
    dual_port: { name: mix, dout: mix_pal }
