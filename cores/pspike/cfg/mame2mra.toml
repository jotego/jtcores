[global]
author=["jotego","andreabogazzi"]
platform="jtpspike"

[parse]
sourcefile=[ "pspikes.cpp" ]
# aerofgtb is a clone of aerofgt, which lives in aerofgt.cpp - declare the
# parent or jtframe skips the derivative
parents=[ { name="aerofgt", description="Aero Fighters" } ]
# The whole driver is in scope except the bootlegs: they replace the sound
# hardware (OKI6295 / MSM5205 / uPD7759) and re-encode the gfx.
skip.bootlegs=true
skip.setnames=[
    "wbbc97",   # Comad, adds a bitmap layer
    "kickball", # Seoung Youn, different sound hardware
]
# karatblz / spinlbrk / aerofgtb still need work, so only the two families
# that are wired up
mustbe.machines=[ "pspikes", "turbofrc", "aerofgt" ]

[header]
info="""byte 1 bit 0 = pspikes  hardware\n             bit 1 = turbofrc hardware\n             bit 2 = aerofgt  hardware"""
# jtframe generates cores/pspike/hdl/jtpspike_header.v from this block. Byte 0
# carries coremod (rotation), so the game flags start at byte 1
registers = [
    { name="pspikes",  pos="1[0]", values=[{ setnames=["pspikes", "pspikesk", "pspikesu", "svolly91"], value=1 }],       desc="Power Spikes hardware" },
    { name="turbofrc", pos="1[1]", values=[{ setnames=["turbofrc", "turbofrco", "turbofrcu", "turbofrcua"], value=1 }],  desc="Turbo Force hardware: two tile layers, two sprite chips" },
    { name="aerofgt",  pos="1[2]", values=[{ setnames=["aerofgtb", "aerofgtc", "sonicwi"], value=1 }],                   desc="Aero Fighters hardware: turbofrc map moved, 320x224" },
]

[dipsw]
bitcnt = 16
delete=[{names=["Unused","Unknown"]}]
# MiSTer's OSD truncates long DIP lines
rename=[
    { name="1 Player Starting Score",   to="1P Start Score" },
    { name="2 Players Starting Score",  to="2P Start Score" },
    { name="2 Players Time Per Credit", to="2P Time/Credit" },
    # MiSTer OSD budget is 26 chars for name+option. "Continue Coin" plus
    # "Start 2/Continue 1" is 31, so both sides are trimmed
    { name="Continue Coin", to="Continue", values=["Start 2/Cont 1", "Start 1/Cont 1"] },
]

[ROM]
# The 68000 ROM is ROM_LOAD16_WORD_SWAP, so MAME's memory image is the file
# byte-swapped: SP=0x110000 (top of work RAM), PC=0x400. The jtframe download
# path already assembles the 16-bit word from the blob in that swapped order,
# so the region is loaded STRAIGHT - adding reverse=true here swaps twice and
# the CPU fetches 0x1100 instead of 0x0011.
#
# Region names are MAME's. For pspikes gfx1 is the tile layer and gfx2 the
# sprites; the other sets of this driver name them differently and will need
# their own setname-qualified entries.
regions = [
    # straight load: the blob holds the file bytes and the download path
    # assembles the 16-bit word in the order the 68000 wants. turbofrc has
    # three word-swapped ROMs concatenated, so no interleave applies
    # pspikes and turbofrc are ROM_LOAD16_WORD_SWAP: one pre-swapped file per
    # chunk, loaded straight. aerofgtb is ROM_LOAD16_BYTE, an even/odd pair
    # that has to be interleaved into 16-bit words
    { setnames=["pspikes", "pspikesk", "pspikesu", "svolly91", "turbofrc", "turbofrco", "turbofrcu", "turbofrcua"], name="maincpu", no_offset=true },
    { setnames=["aerofgtb", "aerofgtc", "sonicwi"], name="maincpu", width=16, reverse=true, no_offset=true },
    { name="soundbank", start="SND_START" },
    { name="ymsnd:adpcma", rename="pcma", start="JTFRAME_BA1_START" },
    { name="ymsnd:adpcmb", rename="pcmb", start="PCMB_START" },
    { name="gfx1", start="JTFRAME_BA2_START" },
    # pspikes: gfx2 IS the sprite ROM. turbofrc: gfx2 is the second tile layer
    # and the sprites live in spritegfx / gfx4
    { setnames=["pspikes", "pspikesk", "pspikesu", "svolly91"], name="gfx2", start="JTFRAME_BA3_START", width=32 },
    { setnames=["turbofrc", "turbofrco", "turbofrcu", "turbofrcua", "aerofgtb", "aerofgtc", "sonicwi"], name="gfx2", start="SCR1_START" },
    # turbofrc loads both sprite regions with ROM_LOAD32_WORD, the aerofgt sets
    # with ROM_LOAD32_WORD_SWAP - the extra byte swap inside each 16-bit half is
    # what makes the sprite columns come out transposed if it is missed
    { setnames=["turbofrc", "turbofrco", "turbofrcu", "turbofrcua"], name="spritegfx", start="JTFRAME_BA3_START", width=32 },
    { setnames=["turbofrc", "turbofrco", "turbofrcu", "turbofrcua"], name="gfx4", start="OBJ1_START", width=32 },
    { setnames=["aerofgtb", "aerofgtc", "sonicwi"], name="spritegfx", start="JTFRAME_BA3_START", width=32, parts=[
        { name="it-19-04", map="0012" },
        { name="it-19-05", map="1200" } ] },
    { setnames=["aerofgtb", "aerofgtc", "sonicwi"], name="gfx4", start="OBJ1_START", width=32, parts=[
        { name="g27", map="0012" },
        { name="g26", map="1200" } ] },
    { name="plds", skip=true },
]

# the sort key is the region name AFTER rename
order = [
    "maincpu", "soundbank", "pcma", "pcmb",
    "gfx1", "gfx2", "spritegfx", "gfx4"
]
